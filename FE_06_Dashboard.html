<script>
      const dateVal = dateEl ? dateEl.value : '';
      const userId = document.getElementById('inpCeremonyTeacher').value;
      if (!dateVal || !userId) return showToast('Lengkapi tanggal dan guru.', 'error');
      const d = new Date(dateVal + 'T00:00:00');
      if (d.getDay() !== 1) {
        showToast('Jadwal upacara hanya boleh pada hari Senin.', 'error');
        return;
      }
      if (cachedUpcomingCeremonies && cachedUpcomingCeremonies.some(c => String(c.date) === String(dateVal))) {
        showToast('Tanggal ' + formatDateID(dateVal) + ' sudah ada dalam jadwal upacara.', 'error');
        return;
      }
      const btn = document.getElementById('btnSaveCeremony');
      if (!btn) return;
      if (btn.dataset.saving === 'true') return showToast('Sedang menyimpan, mohon tunggu...', 'info');
      btn.dataset.saving = 'true';
      const restore = _busyButton(btn, 'Menyimpan...');
      const finalize = () => {
        btn.dataset.saving = 'false';
        restore();
      };
      const token = localStorage.getItem('auth_token');
      google.script.run
        .withSuccessHandler((res) => {
          finalize();
          if (res && res.status === 'success') {
            showToast('Jadwal upacara disimpan.', 'success');
            if (dateEl) dateEl.value = '';
            initPicket();
          } else {
            showToast((res && res.message) || 'Gagal menyimpan jadwal.', 'error');
          }
        })
        .withFailureHandler((err) => {
          finalize();
          showToast('Koneksi gagal: ' + err, 'error');
        })
        .saveCeremonySchedule(token, dateVal, userId);
    }

    function initPasswordValidation() {
      const inp = document.getElementById('inpNewPass');
      const rulesBox = document.getElementById('val-rules');
      const strengthWrap = document.getElementById('pwdStrengthWrap');
      if (!inp || !rulesBox) return;
      if (inp.dataset.pwdListenerAttached === 'true') return;
      inp.dataset.pwdListenerAttached = 'true';
      inp.addEventListener('input', function () {
        const val = this.value;
        const name = document.getElementById('inpProfileName').value || '';
        const oldPassEl = document.getElementById('inpOldPass');
        const oldVal = oldPassEl ? oldPassEl.value : '';
        if (val.length > 0) {
          rulesBox.classList.remove('hidden');
          if (strengthWrap) strengthWrap.classList.remove('hidden');
        } else {
          rulesBox.classList.add('hidden');
          if (strengthWrap) strengthWrap.classList.add('hidden');
        }
        const setStatus = (id, isValid) => {
          const el = document.getElementById(id);
          if (!el) return;
          const dot = el.querySelector('.rule-dot') || el.querySelector('span');
          if (isValid) {
            el.classList.remove('text-slate-400', 'text-red-500', 'text-slate-500');
            el.classList.add('text-green-600', 'font-medium');
            if (dot) { dot.classList.remove('bg-slate-300', 'bg-red-500', 'bg-slate-200'); dot.classList.add('bg-green-600'); }
          } else {
            el.classList.remove('text-slate-400', 'text-green-600', 'font-medium');
            el.classList.add('text-slate-500');
            if (dot) { dot.classList.remove('bg-green-600'); dot.classList.add('bg-slate-300'); }
          }
        };
        var checks = {
          len: val.length >= 8,
          upper: /[A-Z]/.test(val),
          lower: /[a-z]/.test(val),
          num: /[0-9]/.test(val),
          spec: /[!@#$%^&*(),.?":{}|<>]/.test(val)
        };
        setStatus('rule-len', checks.len);
        setStatus('rule-upper', checks.upper);
        setStatus('rule-lower', checks.lower);
        setStatus('rule-num', checks.num);
        setStatus('rule-spec', checks.spec);
        let nameValid = true;
        if (name) {
          const parts = name.split(' ').filter(p => p.length > 2);
          for (let p of parts) {
            if (val.toLowerCase().includes(p.toLowerCase())) {
              nameValid = false; break;
            }
          }
        }
        var nameOK = nameValid && val.length > 0;
        setStatus('rule-name', nameOK);
        var differentOK = val.length > 0 && (oldVal === '' || val !== oldVal);
        setStatus('rule-different', differentOK);
        var passedCount = (checks.len ? 1 : 0) + (checks.upper ? 1 : 0) + (checks.lower ? 1 : 0) + (checks.num ? 1 : 0) + (checks.spec ? 1 : 0);
        var bonus = val.length >= 12 ? 1 : 0;
        var totalScore = Math.min(5, passedCount + bonus);
        if (!nameOK && val.length > 0) totalScore = Math.max(0, totalScore - 1);
        if (!differentOK && val.length > 0 && oldVal) totalScore = Math.max(0, totalScore - 2);
        var fill = document.getElementById('pwdStrengthFill');
        var label = document.getElementById('pwdStrengthText');
        var score = document.getElementById('pwdStrengthScore');
        if (fill) {
          fill.classList.remove('s1', 's2', 's3', 's4', 's5');
          if (totalScore > 0) fill.classList.add('s' + totalScore);
          fill.style.width = (totalScore * 20) + '%';
        }
        if (label) {
          var textMap = { 0: 'Belum diisi', 1: 'Sangat lemah', 2: 'Lemah', 3: 'Cukup', 4: 'Kuat', 5: 'Sangat kuat' };
          var colorMap = {
            0: '#94a3b8',
            1: '#ef4444',
            2: '#f97316',
            3: '#eab308',
            4: '#22c55e',
            5: '#16a34a'
          };
          label.textContent = textMap[totalScore] || 'Belum diisi';
          label.style.color = colorMap[totalScore] || '#94a3b8';
        }
        if (score) score.textContent = totalScore + '/5';
      });
      var oldInp = document.getElementById('inpOldPass');
      if (oldInp && oldInp.dataset.pwdReevalAttached !== 'true') {
        oldInp.dataset.pwdReevalAttached = 'true';
        oldInp.addEventListener('input', function () {
          try {
            inp.dispatchEvent(new Event('input', { bubbles: true }));
          } catch (_) {
            var ev = document.createEvent('Event');
            ev.initEvent('input', true, true);
            inp.dispatchEvent(ev);
          }
        });
      }
    }
    function copyUsernameAction() {
      var inp = document.getElementById('inpProfileUsername');
      var btn = document.getElementById('btnCopyUsername');
      if (!inp || !inp.value) return;
      var done = function () {
        if (!btn) return;
        var origHTML = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>';
        setTimeout(function () {
          btn.classList.remove('copied');
          btn.innerHTML = origHTML;
        }, 1400);
        showToast('Username disalin ke clipboard', 'success');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(inp.value).then(done, function () {
          try {
            inp.select();
            document.execCommand('copy');
            done();
          } catch (_) {
            showToast('Gagal menyalin ke clipboard', 'error');
          }
        });
      } else {
        try {
          inp.select();
          document.execCommand('copy');
          done();
        } catch (_) {
          showToast('Browser tidak mendukung salin otomatis', 'error');
        }
      }
    }
    function saveProfileName() {

      var phoneEl = document.getElementById('inpProfilePhone');
      const newPhoneRaw = (phoneEl ? phoneEl.value : '').trim();

        showToast('Nama tidak boleh kosong', 'error');
        var inp = document.getElementById('inpProfileName');
        if (inp) try { inp.focus(); } catch (_) { }
        return;
      }
      if (newName.length < 2) {
        showToast('Nama minimal 2 karakter', 'error');
        return;
      }
      var normalizedPhone = '';
      if (newPhoneRaw) {
        var pn = _normalizePhoneClient(newPhoneRaw);

          showToast(pn.message || 'Nomor HP tidak valid.', 'error');
          if (phoneEl) try { phoneEl.focus(); } catch (_) { }

        }

      }

      var currentPhone = String(localStorage.getItem('user_phone') || '').trim();
      if (newName === currentName && normalizedPhone === currentPhone) {

        return;
      }

          restore();

              localStorage.setItem('user_phone', String(res.phone || ''));

            if (elNameBig) elNameBig.innerText = newName;
            if (elInitBig) elInitBig.innerText = newName.charAt(0).toUpperCase();
          } else {
            showToast((res && res.message) || 'Gagal menyimpan profil.', 'error');
          }

          restore();
          showToast('Gagal terhubung ke server: ' + (err && err.message ? err.message : err), 'error');

    function _normalizePhoneClient(input) {
      var s = String(input || '').trim();
      if (!s) return { valid: true, normalized: '' };
      s = s.replace(/[\s\-\(\)\.]/g, '');
      if (s.indexOf('+') === 0) s = s.substring(1);
      if (!/^\d+$/.test(s)) return { valid: false, message: 'Nomor HP hanya boleh mengandung angka.' };
      if (s.charAt(0) === '0') s = '62' + s.substring(1);
      else if (!(s.charAt(0) === '6' && s.charAt(1) === '2')) {
        if (s.length >= 8 && s.length <= 13) s = '62' + s;
      }
      if (s.length < 10 || s.length > 15) {
        return { valid: false, message: 'Nomor HP harus 10–15 digit (termasuk kode negara).' };
      }
      if (s.indexOf('62') !== 0) {
        return { valid: false, message: 'Nomor HP harus menggunakan kode negara Indonesia (62).' };
      }
      return { valid: true, normalized: s };
    }
    function profile_normalizePhoneOnInput(el) {
      if (!el) return;
      var caret = el.selectionStart;
      var oldVal = el.value;
      var v = String(oldVal || '').replace(/[^\d+]/g, '');
      if (v.indexOf('+') > 0) v = v.replace(/\+/g, function (m, idx) { return idx === 0 ? '+' : ''; });
      if (v.charAt(0) === '0') v = '62' + v.substring(1);
      if (v !== oldVal) {
        el.value = v;
        try { el.setSelectionRange(caret, caret); } catch (_) { }
      }
    }

    function _setEmailFieldReadOnly(readOnly) {
      var input = document.getElementById('inpProfileEmail');
      var btnChange = document.getElementById('btnChangeEmail');
      var btnCancel = document.getElementById('btnCancelChangeEmail');
      var btnReq = document.getElementById('btnRequestEmailOtp');
      var hint = document.getElementById('profileEmailHint');
      if (!input) return;
      if (readOnly) {
        input.setAttribute('readonly', '');
        input.style.background = '#f1f5f9';
        input.style.color = '#64748b';
        input.style.cursor = 'default';
        if (btnChange) btnChange.classList.remove('hidden');
        if (btnChange) btnChange.classList.add('inline-flex');
        if (btnCancel) btnCancel.classList.add('hidden');
        if (btnReq) {
          btnReq.classList.remove('hidden');
          btnReq.disabled = true;
          btnReq.classList.add('opacity-50', 'cursor-not-allowed');
          btnReq.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Email Terverifikasi';
        }
        if (hint) {
          hint.textContent = 'Klik "Ganti Email" untuk mengubah alamat email Anda.';
          hint.classList.remove('hidden');
        }
        _resetOtpUI();
      } else {
        input.removeAttribute('readonly');
        input.style.background = '';
        input.style.color = '';
        input.style.cursor = '';
        if (btnChange) {
          btnChange.classList.add('hidden');
          btnChange.classList.remove('inline-flex');
        }
        if (hint) {
          hint.textContent = 'Email akan diverifikasi via kode OTP sebelum disimpan.';
          hint.classList.remove('hidden');
        }
      }
    }
    function profile_startChangeEmail() {

    function _checkPasswordRules(password, fullName, username) {
      if (!password || password.length < 8) return { valid: false, message: 'Password baru minimal 8 karakter.' };
      if (!/[A-Z]/.test(password)) return { valid: false, message: 'Password harus mengandung huruf besar.' };
      if (!/[a-z]/.test(password)) return { valid: false, message: 'Password harus mengandung huruf kecil.' };
      if (!/[0-9]/.test(password)) return { valid: false, message: 'Password harus mengandung angka.' };
      if (!/[!@#$%^&*(),.?":{}|<>]/.test(password)) return { valid: false, message: 'Password harus mengandung simbol khusus.' };
      var lower = password.toLowerCase();
      if (username && lower.indexOf(String(username).toLowerCase()) !== -1) {
        return { valid: false, message: 'Password tidak boleh mengandung username.' };
      }
      if (fullName) {
        var parts = String(fullName).split(/\s+/).filter(function (p) { return p.length > 2; });
        for (var i = 0; i < parts.length; i++) {
          if (lower.indexOf(parts[i].toLowerCase()) !== -1) {
            return { valid: false, message: 'Password tidak boleh mengandung unsur nama Anda (' + parts[i] + ').' };
          }
        }
      }
      return { valid: true };
    }

    function scrollToDashboardSchedule() {
      var target = document.getElementById('panelJadwalMengajarHariIni');
      if (!target) return;
      function _findScrollParent(el) {
        var parent = el.parentElement;
        while (parent && parent !== document.body) {
          var style = window.getComputedStyle(parent);
          var overflow = style.overflowY;
          if (overflow === 'auto' || overflow === 'scroll') return parent;
          parent = parent.parentElement;
        }
        return window;
      }
      var scroller = _findScrollParent(target);
      var offset = 72; // tinggi navbar kira-kira, agar tidak tertutup
      if (scroller === window) {
        var top = target.getBoundingClientRect().top + window.pageYOffset - offset;
        window.scrollTo({ top: top, behavior: 'smooth' });
      } else {
        var containerTop = scroller.getBoundingClientRect().top;
        var targetTop    = target.getBoundingClientRect().top;
        var scrollTo     = scroller.scrollTop + (targetTop - containerTop) - offset;
        scroller.scrollTo({ top: scrollTo, behavior: 'smooth' });
      }
    }

      if (tbody) tbody.innerHTML = skeletonTableRows(5, 4);
      ['admTotalJTM', 'admTotalHonor', 'admTotalTransport'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = '<div class="skeleton h-7 w-16 rounded inline-block"></div>';
      });
      google.script.run.withSuccessHandler((res) => {
        if (res && res.status === 'success') {
          const elJtm = document.getElementById('admTotalJTM');
          const elHonor = document.getElementById('admTotalHonor');
          if (elJtm) animateValue(elJtm, 0, Number(res.total_jtm_school || 0), 800);
          if (elHonor) animateRupiah(elHonor, res.est_honor_school, 900);
          const elTransport = document.getElementById('admTotalTransport');
          const transportCard = document.getElementById('admTransportCard');
          if (elTransport) {
            if (!res.transport_enabled) {
              if (transportCard) transportCard.style.display = 'none';
            } else {
              if (transportCard) transportCard.style.display = '';
              animateRupiah(elTransport, res.transport_total_school_formatted || 'Rp 0', 850);
            }
          }
          if (res.schedules.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="py-8">
               <div class="error-state-container">
                 <div class="w-14 h-14 bg-slate-50 rounded-2xl flex items-center justify-center mb-3 mx-auto">
                   <svg class="w-7 h-7 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                 </div>
                 <p class="text-slate-500 font-semibold text-sm">Tidak ada jadwal hari ini</p>
                 <p class="text-slate-400 text-xs mt-1">Hari ini libur atau belum ada data jadwal</p>
               </div>
             </td></tr>`;
          } else {
            let html = '';
            const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
            res.schedules.forEach(s => {
              if (!s || !s.status) return;
              const isSudah = s.status.includes('Sudah');
              const badge = isSudah
                ? `<span class="inline-flex items-center gap-1 bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-1 rounded-full text-xs font-semibold"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span>${s.status}</span>`
                : `<span class="inline-flex items-center gap-1 bg-amber-50 text-amber-700 border border-amber-200 px-2.5 py-1 rounded-full text-xs font-semibold"><span class="w-1.5 h-1.5 rounded-full bg-amber-400 inline-block animate-pulse"></span>${s.status}</span>`;
              let rowHighlight = '';
              if (s.time && s.time.includes('-')) {
                const [tStart, tEnd] = s.time.split('-').map(t => t.trim());
                const toMin = (t) => {
                  const [hh, mm] = t.split(':').map(Number);
                  return (hh || 0) * 60 + (mm || 0);
                };
                const sMin = toMin(tStart);
                const eMin = toMin(tEnd);
                if (nowMin >= sMin && nowMin <= eMin) {
                  rowHighlight = ' style="background:linear-gradient(90deg,#FEF9C3,#FFFBEB);" data-active-row="1"';
                }
</script>
