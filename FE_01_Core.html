    function initSettings() {
      const token = localStorage.getItem('auth_token');
      const tbodyHolidays = document.getElementById('tbodyHolidays');
      const tbodySubjects = document.getElementById('tbodySubjects');
      const tbodyAllowances = document.getElementById('tbodyAllowances');
      if (tbodyHolidays) tbodyHolidays.innerHTML = skeletonTableRows(4, 3);
      if (tbodySubjects) tbodySubjects.innerHTML = skeletonTableRows(2, 3);
      if (tbodyAllowances) tbodyAllowances.innerHTML = skeletonTableRows(4, 3);

        if (!data) {
          showToast('Data konfigurasi kosong.', 'error');
          return;
        }
        if (data.status === 'success') {
          globalConfig = data.config;
          if (document.getElementById('cfgKepsek')) document.getElementById('cfgKepsek').value = data.config.kepala_sekolah || '';
          if (document.getElementById('cfgSalary')) document.getElementById('cfgSalary').value = data.config.base_salary || '';
          if (document.getElementById('cfgLevel')) document.getElementById('cfgLevel').value = data.config.tingkatan || 'SD';
          if (document.getElementById('cfgTahunPelajaran')) document.getElementById('cfgTahunPelajaran').value = data.config.tahun_pelajaran || '';

          if (document.getElementById('cfgWaktuPerJTM')) document.getElementById('cfgWaktuPerJTM').value = data.config.waktu_per_jtm || '40';
          if (document.getElementById('cfgAppVersion')) document.getElementById('cfgAppVersion').value = data.config.app_version || '2.1.1';
          if (document.getElementById('chkUseParallel')) document.getElementById('chkUseParallel').checked = (data.config.use_parallel === 'true');
          if (document.getElementById('selParallelMax')) document.getElementById('selParallelMax').value = data.config.parallel_max || 'A';
          if (document.getElementById('cfgTarifPerKm')) document.getElementById('cfgTarifPerKm').value = data.config.tarif_per_km || '';
          if (document.getElementById('cfgTransportEnabled')) document.getElementById('cfgTransportEnabled').checked = (String(data.config.transport_allowance_enabled).toLowerCase() === 'true');
          // Maintenance Mode fields
          var mtnChk = document.getElementById('cfgMaintenanceEnabled');
          var mtnMsg = document.getElementById('cfgMaintenanceMessage');
          // FIX Bug 7: Use null-safe check — if key absent, data.config.maintenance_mode is
          // undefined; String(undefined) === 'undefined' which would never equal 'true', but
          // explicit null-coalescing makes intent clear and prevents future surprises.
          if (mtnChk) mtnChk.checked = (String(data.config.maintenance_mode || '').toLowerCase() === 'true');
          if (mtnMsg) mtnMsg.value = data.config.maintenance_message || '';

          var schedChk = document.getElementById('cfgMaintenanceScheduledEnabled');
          var startEl = document.getElementById('cfgMaintenanceStart');
          var endEl = document.getElementById('cfgMaintenanceEnd');
          if (schedChk) schedChk.checked = (String(data.config.maintenance_scheduled || '').toLowerCase() === 'true');
          if (startEl) startEl.value = data.config.maintenance_start || '';
          if (endEl) endEl.value = data.config.maintenance_end || '';
          if (typeof toggleScheduledMsgField === 'function') toggleScheduledMsgField();
          renderClassInputs();
          renderHolidaysList(data.holidays);

        } else {
          showToast(data.message, 'error');

          if (tbodySubjects) tbodySubjects.innerHTML = errorTableRows(2, 'Gagal memuat data.', 'initSettings()');

        if (tbodySubjects) tbodySubjects.innerHTML = errorTableRows(2, 'Koneksi gagal.', 'initSettings()');

    function saveSystemConfig() {
      const token = localStorage.getItem('auth_token');
      const kepsekEl = document.getElementById('cfgKepsek');
      const salaryEl = document.getElementById('cfgSalary');
      const levelEl = document.getElementById('cfgLevel');
      const useParallelEl = document.getElementById('chkUseParallel');

      const waktuPerJTMEl = document.getElementById('cfgWaktuPerJTM');
      const appVersionEl = document.getElementById('cfgAppVersion');
      const kepsek = (kepsekEl ? kepsekEl.value : '').trim();
      const salaryRaw = salaryEl ? salaryEl.value : '';
      const level = levelEl ? levelEl.value : 'SD';
      const useParallel = useParallelEl ? useParallelEl.checked : false;
      const parallelMax = parallelMaxEl ? parallelMaxEl.value : 'A';
      const tahunPelajaran = (tahunPelajaranEl ? tahunPelajaranEl.value : '').trim();
      const semester = (semesterEl ? semesterEl.value : 'Ganjil');
      const waktuPerJTM = (waktuPerJTMEl ? waktuPerJTMEl.value : '40');
      const appVersion = (appVersionEl ? appVersionEl.value : '').trim();
      if (!kepsek) {
        showToast('Nama kepala sekolah wajib diisi.', 'error');
        if (kepsekEl) try { kepsekEl.focus(); } catch (_) { }
        return;
      }
      if (salaryRaw === '' || isNaN(Number(salaryRaw)) || Number(salaryRaw) < 0) {
        showToast('Gaji pokok per JTM harus angka ≥ 0.', 'error');
        if (salaryEl) try { salaryEl.focus(); } catch (_) { }
        return;
      }
      if (!tahunPelajaran) {
        showToast('Tahun pelajaran wajib diisi.', 'error');
        if (tahunPelajaranEl) try { tahunPelajaranEl.focus(); } catch (_) { }
        return;
      }
      if (!waktuPerJTM || isNaN(Number(waktuPerJTM)) || Number(waktuPerJTM) <= 0) {
        showToast('Waktu per JTM harus angka > 0.', 'error');
        if (waktuPerJTMEl) try { waktuPerJTMEl.focus(); } catch (_) { }
        return;
      }
      if (!appVersion) {
        showToast('Versi aplikasi wajib diisi.', 'error');
        if (appVersionEl) try { appVersionEl.focus(); } catch (_) { }
        return;
      }
      let classData = {};
      const inputs = document.querySelectorAll('[id^="inpStd_"]');
      inputs.forEach(inp => {
        const key = 'std_kelas_' + inp.id.split('inpStd_')[1];
        classData[key] = inp.value;
      });
      const configData = {
        kepala_sekolah: kepsek,
        base_salary: salaryRaw,
        tingkatan: level,
        use_parallel: useParallel ? 'true' : 'false',
        parallel_max: parallelMax,
        tahun_pelajaran: tahunPelajaran,
        semester: semester,
        waktu_per_jtm: waktuPerJTM,
        app_version: appVersion,
        ...classData
      };
      var btn = document.getElementById('btnSaveConfig');
      if (btn && btn.dataset.busy === 'true') return;
      var restore = (typeof _busyButton === 'function') ? _busyButton(btn, 'Menyimpan...') : function () {
        if (btn) { btn.disabled = true; btn.dataset._oldHTML = btn.innerHTML; btn.innerHTML = 'Menyimpan...'; }
        return function () { if (btn) { btn.disabled = false; if (btn.dataset._oldHTML) { btn.innerHTML = btn.dataset._oldHTML; delete btn.dataset._oldHTML; } } };
      }();
      google.script.run.withSuccessHandler((res) => {
        restore();
        if (res && res.status === 'success') {
          showToast('Konfigurasi sistem disimpan', 'success');
          globalConfig = { ...globalConfig, ...configData };
          if (document.getElementById('txtFooterVersion')) {
             document.getElementById('txtFooterVersion').innerText = configData.app_version || '2.1.1';
          }
          if (document.getElementById('txtLoginVersionLeft')) {
             document.getElementById('txtLoginVersionLeft').innerText = configData.app_version || '2.1.1';
          }
          if (typeof populateGlobalClassSelects === 'function') populateGlobalClassSelects();
        }
        else showToast((res && res.message) || 'Gagal menyimpan konfigurasi.', 'error');
      }).withFailureHandler((err) => {
        restore();
        showToast('Koneksi gagal: ' + (err && err.message ? err.message : err), 'error');
      }).saveSystemConfig(token, configData);
    }

    function populateGlobalClassSelects() {
      const level = globalConfig.tingkatan || 'SMP';
      const useParallel = globalConfig.use_parallel === 'true';
      const parallelMax = globalConfig.parallel_max || 'A';
      let baseClasses = [];
      if (level === 'SD') baseClasses = [1, 2, 3, 4, 5, 6];
      else if (level === 'SMA' || level === 'SMK') baseClasses = [10, 11, 12];
      else baseClasses = [7, 8, 9];
      let finalClasses = [];
      if (useParallel) {
        const alphabet = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K'];
        const maxIndex = alphabet.indexOf(parallelMax);
        baseClasses.forEach(c => {
          for (let i = 0; i <= maxIndex; i++) {
            finalClasses.push(`${c}${alphabet[i]}`);
          }
        });
      } else {
        finalClasses = baseClasses;
      }
      const targetIds = ['filterClass', 'inpSchedClass'];
      targetIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          const currentVal = el.value;
          let html = '<option value="">Pilih Kelas...</option>';
          finalClasses.forEach(c => {
            html += `<option value="${c}">${c}</option>`;
          });
          el.innerHTML = html;
          if (currentVal) el.value = currentVal;
        }
      });
    }
    function renderHolidaysList(holidays) {
      const tbody = document.getElementById('tbodyHolidays');
      if (!tbody) return;
      tbody.innerHTML = '';
      if (!holidays || holidays.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-6 text-slate-400 text-sm italic">Belum ada data libur</td></tr>';
        return;
      }
      let today = new Date();
      let tzOffset = 7 * 60 * 60 * 1000;
      let localToday = new Date(today.getTime() + tzOffset);
      let todayStr = localToday.toISOString().split('T')[0];
      holidays.forEach(h => {
        let isPast = h.date < todayStr;
        let dateStr = formatDateID(h.date);
        let descSafe = escapeHtml(h.desc || h.description || '');
        let safeIdJs = String(h.id || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        let safeDescJs = String(h.desc || h.description || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        let tr = document.createElement('tr');
        tr.className = "border-b hover:bg-slate-50 transition-colors";
        let actionsHtml = '';
        if (isPast) {
          actionsHtml = `<span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider bg-slate-100 px-2 py-1 rounded-md">Terkunci</span>`;
        } else {
          actionsHtml = `
            ${actionBtn('edit', `editHolidayAction('${safeIdJs}', '${h.date}', '${safeDescJs}', '${h.is_holiday}')`, 'Edit Hari Libur')}
            ${actionBtn('delete', `deleteHoliday('${safeIdJs}', this)`, 'Hapus Hari Libur')}
          `;
        }
        tr.innerHTML = `
              <td class="py-3 px-4 text-slate-700 text-sm" data-label="Tanggal"><span class="settings-mobile-value">${escapeHtml(dateStr)}</span></td>
              <td class="py-3 px-4 text-slate-600 text-sm" data-label="Keterangan"><span class="settings-mobile-value">${descSafe}</span></td>
              <td class="py-3 px-4 text-center" data-label="Hari Libur">
                ${h.is_holiday
            ? '<span class="inline-flex items-center gap-1 bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-semibold px-2.5 py-1 rounded-full">Ya</span>'
            : '<span class="inline-flex items-center gap-1 bg-slate-100 text-slate-500 border border-slate-200 text-xs font-medium px-2.5 py-1 rounded-full">Tidak</span>'}
              </td>
              <td class="py-3 px-4 text-center settings-cell-actions">
                ${actionsHtml}
              </td>`;
        tbody.appendChild(tr);
      });
    }

          }
        });
      } else {
        generatedClasses = baseClasses;

        var stdSiswa = (c.std_siswa !== null && c.std_siswa !== undefined) ? c.std_siswa : null;
        var statusBadge = hasData
          ? '<span class="inline-flex items-center gap-1 bg-teal-50 text-teal-700 border border-teal-200 px-2.5 py-0.5 rounded-full text-[11px] font-bold"><span class="w-1.5 h-1.5 rounded-full bg-teal-500 inline-block"></span>Sudah Diisi</span>'
          : '<span class="inline-flex items-center gap-1 bg-slate-100 text-slate-500 border border-slate-200 px-2.5 py-0.5 rounded-full text-[11px] font-semibold"><span class="w-1.5 h-1.5 rounded-full bg-slate-400 inline-block"></span>Belum Diisi</span>';
        var summaryHtml = '';
        if (hasData) {
          var totalFilled = (c.hadir||0) + (c.sakit||0) + (c.izin||0) + (c.alpa||0);
          var totalMatchStd = stdSiswa !== null && totalFilled === stdSiswa;
          var totalColor = stdSiswa !== null ? (totalMatchStd ? 'text-emerald-700' : 'text-red-600') : 'text-slate-700';
          summaryHtml = '<div class="mt-2 grid grid-cols-4 gap-1 text-center">' +
            '<div class="bg-emerald-50 rounded-lg py-1"><div class="text-[10px] text-emerald-600 font-semibold">Hadir</div><div class="font-mono font-bold text-emerald-700 text-sm">' + (c.hadir||0) + '</div></div>' +
            '<div class="bg-amber-50 rounded-lg py-1"><div class="text-[10px] text-amber-600 font-semibold">Sakit</div><div class="font-mono font-bold text-amber-700 text-sm">' + (c.sakit||0) + '</div></div>' +
            '<div class="bg-blue-50 rounded-lg py-1"><div class="text-[10px] text-blue-600 font-semibold">Izin</div><div class="font-mono font-bold text-blue-700 text-sm">' + (c.izin||0) + '</div></div>' +
            '<div class="bg-red-50 rounded-lg py-1"><div class="text-[10px] text-red-600 font-semibold">Alpa</div><div class="font-mono font-bold text-red-700 text-sm">' + (c.alpa||0) + '</div></div>' +
            '</div>' +
            '<div class="mt-1.5 flex items-center justify-between px-0.5">' +
            '<span class="text-[11px] text-slate-400">Total: <span class="font-mono font-bold ' + totalColor + '">' + totalFilled + '</span></span>' +
            (stdSiswa !== null ? '<span class="text-[11px] text-slate-400">Standar: <span class="font-mono font-semibold text-slate-600">' + stdSiswa + '</span>' + (totalMatchStd ? ' <span class="text-emerald-600">\u2713</span>' : ' <span class="text-red-500">\u2717</span>') + '</span>' : '') +
            '</div>';
        }
        var btnLabel = hasData ? 'Edit' : 'Input';
        var btnClass = hasData
          ? 'bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200'
          : 'bg-teal-600 text-white hover:bg-teal-700 shadow-sm';
        var existingDataJson = hasData ? JSON.stringify({hadir:c.hadir,sakit:c.sakit,izin:c.izin,alpa:c.alpa}).replace(/"/g,'&quot;') : 'null';
        var stdArg = stdSiswa !== null ? String(stdSiswa) : 'null';
        html +=
          '<div class="bg-white rounded-2xl border ' + (hasData ? 'border-teal-200' : 'border-slate-200') + ' shadow-sm p-4">' +
          '<div class="flex items-center justify-between mb-2">' +
          '<div class="flex items-center gap-2">' +
          '<div class="w-8 h-8 rounded-lg ' + (hasData ? 'bg-teal-100' : 'bg-slate-100') + ' flex items-center justify-center">' +
          '<span class="font-bold text-xs ' + (hasData ? 'text-teal-700' : 'text-slate-500') + '">' + cn + '</span>' +
          '</div>' +
          '<div>' +
          '<p class="font-bold text-slate-800 text-sm">' + cn + '</p>' +
          '<div class="flex items-center gap-1.5 mt-0.5">' + statusBadge +
          (stdSiswa !== null ? '<span class="text-[10px] text-slate-400 font-medium">Std: ' + stdSiswa + '</span>' : '') +
          '</div>' +
          '</div>' +
          '</div>' +
          '<button onclick="openStudentAttendanceModal(\'' + safeCn + '\',' + existingDataJson + ',' + stdArg + ')" class="text-xs font-semibold px-3 py-1.5 rounded-lg transition ' + btnClass + '">' + btnLabel + '</button>' +
          '</div>' +
          summaryHtml +
          '</div>';
      });
      grid.innerHTML = html;
    }
    function _updateSaProgress(submitted, total) {
      var label = document.getElementById('saProgressLabel');
      var bar   = document.getElementById('saProgressBar');
      var sub   = document.getElementById('saProgressSub');
      if (label) label.innerText = submitted + ' / ' + total;
      if (bar)   bar.style.width = (total > 0 ? Math.round(submitted/total*100) : 0) + '%';
      if (sub) {
        if (total === 0) { sub.innerText = 'Tidak ada kelas hari ini.'; }
        else if (submitted === 0) { sub.innerText = 'Belum ada kelas yang diisi. Silakan isi rekap semua kelas sebelum mengakses Halaman Piket & Kehadiran Harian.'; }
        else if (submitted < total) { sub.innerText = submitted + ' kelas sudah diisi, ' + (total - submitted) + ' kelas belum. Isi semua kelas untuk membuka akses Halaman Piket & Kehadiran Harian.'; }
        else { sub.innerText = 'Semua kelas sudah diisi. Halaman Piket & Kehadiran Harian dapat diakses.'; }
      }
    }
    function openStudentAttendanceModal(className, existingData, stdSiswa) {
      var modal = document.getElementById('studentAttendanceModal');
      if (!modal) {
        showToast('Modal tidak ditemukan. Coba muat ulang halaman.', 'error');
        return;
      }
      var inp   = document.getElementById('saInpClassName');
      var inpStd = document.getElementById('saInpStdSiswa');
      var title = document.getElementById('saModalTitle');
      var inpHadir = document.getElementById('saInpHadir');
      var inpSakit = document.getElementById('saInpSakit');
      var inpIzin  = document.getElementById('saInpIzin');
      var inpAlpa  = document.getElementById('saInpAlpa');
      if (inp)    inp.value    = className || '';
      if (inpStd) inpStd.value = (stdSiswa !== null && stdSiswa !== undefined && !isNaN(stdSiswa)) ? String(stdSiswa) : '';
      if (title)  title.innerText = 'Input Absensi \u2014 ' + (className || '');
      if (inpHadir) inpHadir.value = existingData && existingData.hadir !== undefined ? existingData.hadir : 0;
      if (inpSakit) inpSakit.value = existingData && existingData.sakit !== undefined ? existingData.sakit : 0;
      if (inpIzin)  inpIzin.value  = existingData && existingData.izin  !== undefined ? existingData.izin  : 0;
      if (inpAlpa)  inpAlpa.value  = existingData && existingData.alpa  !== undefined ? existingData.alpa  : 0;
      updateSaTotal();
      modal.classList.remove('hidden');
      document.body.classList.add('overflow-hidden');
    }
    function closeStudentAttendanceModal() {
      var modal = document.getElementById('studentAttendanceModal');
      if (modal) modal.classList.add('hidden');
      if (typeof _maybeReleaseBodyLock === 'function') _maybeReleaseBodyLock();
      else document.body.classList.remove('overflow-hidden');
    }
    function adjustSaInput(id, delta) {
      var el = document.getElementById(id);
      if (!el) return;
      var v = Math.max(0, Math.min(999, (parseInt(el.value || '0', 10) || 0) + delta));
      el.value = v;
      updateSaTotal();
    }
    function updateSaTotal() {
      var h = parseInt((document.getElementById('saInpHadir') || {}).value || '0', 10) || 0;
      var s = parseInt((document.getElementById('saInpSakit') || {}).value || '0', 10) || 0;
      var i = parseInt((document.getElementById('saInpIzin')  || {}).value || '0', 10) || 0;
      var a = parseInt((document.getElementById('saInpAlpa')  || {}).value || '0', 10) || 0;
      var total = h + s + i + a;

      var totEl    = document.getElementById('saTotalCount');
      var display  = document.getElementById('saTotalDisplay');
      var badge    = document.getElementById('saTotalStdBadge');
      var hint     = document.getElementById('saTotalHint');
      var btn      = document.getElementById('btnSaveStudentAttendance');
      var stdInp   = document.getElementById('saInpStdSiswa');
      var stdVal   = stdInp && stdInp.value !== '' ? parseInt(stdInp.value, 10) : null;

      if (totEl) totEl.innerText = total;

      var isValid = true;
      if (stdVal !== null && !isNaN(stdVal)) {
        var diff = total - stdVal;
        if (diff === 0) {
          // Tepat sesuai standar — hijau
          if (display) { display.style.background = '#F0FDF4'; display.style.borderColor = '#86EFAC'; }
          if (totEl)   totEl.style.color = '#15803D';
          if (badge) {
            badge.className = 'text-[11px] font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700';
            badge.innerText = '= ' + stdVal + ' \u2713';
            badge.classList.remove('hidden');
          }
          if (hint) { hint.innerText = 'Sesuai standar kelas (' + stdVal + ' siswa)'; hint.style.color = '#15803D'; hint.classList.remove('hidden'); }
          isValid = true;
        } else if (diff > 0) {
          // Melebihi standar — merah
          if (display) { display.style.background = '#FFF1F2'; display.style.borderColor = '#FCA5A5'; }
          if (totEl)   totEl.style.color = '#DC2626';
          if (badge) {
            badge.className = 'text-[11px] font-semibold px-2 py-0.5 rounded-full bg-red-100 text-red-700';
            badge.innerText = 'Standar: ' + stdVal;
            badge.classList.remove('hidden');
          }
          if (hint) { hint.innerText = 'Melebihi standar ' + diff + ' siswa (standar: ' + stdVal + ')'; hint.style.color = '#DC2626'; hint.classList.remove('hidden'); }
          isValid = false;
        } else {
          // Kurang dari standar — oranye
          if (display) { display.style.background = '#FFFBEB'; display.style.borderColor = '#FCD34D'; }
          if (totEl)   totEl.style.color = '#B45309';
          if (badge) {
            badge.className = 'text-[11px] font-semibold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700';
            badge.innerText = 'Standar: ' + stdVal;
            badge.classList.remove('hidden');
          }
          if (hint) { hint.innerText = 'Kurang ' + Math.abs(diff) + ' siswa dari standar (' + stdVal + ')'; hint.style.color = '#B45309'; hint.classList.remove('hidden'); }
          isValid = false;
        }
      } else {
        // Tidak ada standar — tampilan netral
        if (display) { display.style.background = ''; display.style.borderColor = ''; }
        if (totEl)   totEl.style.color = '';
        if (badge)   { badge.classList.add('hidden'); }
        if (hint)    { hint.classList.add('hidden'); }
        isValid = total > 0;
      }

      if (btn) {
        btn.disabled = !isValid;
      }
    }
    function submitStudentAttendance() {
      var className = (document.getElementById('saInpClassName') || {}).value || '';
      if (!className) return showToast('Nama kelas tidak valid.', 'error');
      var hadir = parseInt((document.getElementById('saInpHadir') || {}).value || '0', 10) || 0;
      var sakit = parseInt((document.getElementById('saInpSakit') || {}).value || '0', 10) || 0;
      var izin  = parseInt((document.getElementById('saInpIzin')  || {}).value || '0', 10) || 0;
      var alpa  = parseInt((document.getElementById('saInpAlpa')  || {}).value || '0', 10) || 0;
      if ((hadir + sakit + izin + alpa) === 0) {
        return showToast('Total siswa tidak boleh nol. Harap isi setidaknya satu nilai.', 'error');
      }
      var btn = document.getElementById('btnSaveStudentAttendance');
      if (btn) { btn.disabled = true; btn.innerText = 'Menyimpan...'; }
      var token = localStorage.getItem('auth_token');
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            closeStudentAttendanceModal();
            showToast('Rekap absensi kelas ' + className + ' berhasil disimpan.', 'success');
            initStudentAttendance();
          } else {
            if (btn) btn.innerText = 'Simpan';
            showToast((res && res.message) || 'Gagal menyimpan rekap.', 'error');
            updateSaTotal(); // restore disabled state sesuai validasi standar
          }
        })
        .withFailureHandler(function(err) {
          if (btn) btn.innerText = 'Simpan';
          showToast('Koneksi gagal: ' + err, 'error');
          updateSaTotal(); // restore disabled state sesuai validasi standar
        })
        .saveStudentAttendance(token, { class_name: className, hadir: hadir, sakit: sakit, izin: izin, alpa: alpa });
    }
