    function animateValue(element, start, end, duration) {
      if (!element) return;
      const safeEnd = Number(end) || 0;
      const safeStart = Number(start) || 0;
      if (safeEnd === safeStart) {
        element.innerHTML = String(safeEnd);
        return;
      }
      let startTimestamp = null;
      const ease = (t) => 1 - Math.pow(1 - t, 3);
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const linear = Math.min((timestamp - startTimestamp) / duration, 1);
        const progress = ease(linear);
        element.innerHTML = Math.floor(progress * (safeEnd - safeStart) + safeStart);
        if (linear < 1) {
          window.requestAnimationFrame(step);
        } else {
          element.innerHTML = String(safeEnd);
        }
      };
      window.requestAnimationFrame(step);
    }
    function animateRupiah(element, endText, duration) {
      if (!element) return;
      duration = duration || 800;
      const numStr = String(endText || '').replace(/[^\d-]/g, '');
      const endVal = parseInt(numStr, 10) || 0;
      if (endVal === 0) {
        element.innerText = endText || 'Rp 0';
        return;
      }
      let startTimestamp = null;
      const ease = (t) => 1 - Math.pow(1 - t, 3);
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const linear = Math.min((timestamp - startTimestamp) / duration, 1);
        const progress = ease(linear);
        const v = Math.floor(progress * endVal);
        element.innerText = 'Rp ' + v.toLocaleString('id-ID');
        if (linear < 1) {
          window.requestAnimationFrame(step);
        } else {
          element.innerText = endText;
        }
      };
      window.requestAnimationFrame(step);
    }

            Isi Jurnal

        html += `<tr class="border-b hover:bg-slate-50 transition-colors"${rowStyle}>

        <td class="px-3 sm:px-6 py-3 sm:py-4 text-center" style="overflow:visible;white-space:normal;">${btnHtml}</td>

    function copyJournalMateri() {
      const txt = (document.getElementById('viewJournalMateri') || {}).innerText || '';
      if (!txt || txt === '-') return showToast('Tidak ada materi untuk disalin.', 'info');
      const done = () => {
        const btn = document.getElementById('btnCopyMateri');
        if (btn) {
          const orig = btn.innerHTML;
          btn.innerHTML = '<svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg> Tersalin';
          setTimeout(() => { btn.innerHTML = orig; }, 1500);
        }
        showToast('Materi disalin ke clipboard.', 'success');
      };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(done, () => _fallbackCopy(txt, done));
        } else {
          _fallbackCopy(txt, done);
        }
      } catch (e) { _fallbackCopy(txt, done); }
    }
    function _fallbackCopy(text, cb) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', '');
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select(); document.execCommand('copy');
        document.body.removeChild(ta);
        if (typeof cb === 'function') cb();
      } catch (e) { showToast('Gagal menyalin: ' + e, 'error'); }
    }
