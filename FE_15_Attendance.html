<script>
    function initAttendance() {
      const token = localStorage.getItem('auth_token');
      google.script.run
        .withSuccessHandler(function(gateRes) {
          if (gateRes && gateRes.status === 'success' && gateRes.redirect_needed) {
            showToast('Harap lengkapi rekap absensi siswa terlebih dahulu sebelum mengakses halaman ini.', 'info', 5000);
            handleNav('Page_StudentAttendanceInput');
            return;
          }
          _initAttendancePage();
        })
        .withFailureHandler(function() { _initAttendancePage(); })
        .checkStudentAttendanceToday(token);
    }
    function initMyAttendance() {
      var monthSel = document.getElementById('mahMonth');
      if (monthSel && monthSel.options.length === 0) {
        var bulan = ['Januari','Februari','Maret','April','Mei','Juni',
                     'Juli','Agustus','September','Oktober','November','Desember'];
        bulan.forEach(function(n, i) {
          var opt = document.createElement('option');
          opt.value = i + 1;
          opt.textContent = n;
          monthSel.appendChild(opt);
        });
      }
      var yearSel = document.getElementById('mahYear');
      if (yearSel && yearSel.options.length === 0) {
        var thisYear = new Date().getFullYear();
        for (var y = thisYear; y >= thisYear - 3; y--) {
          var opt = document.createElement('option');
          opt.value = y;
          opt.textContent = y;
          yearSel.appendChild(opt);
        }
      }
      var now = new Date();
      if (monthSel) monthSel.value = now.getMonth() + 1;
      if (yearSel)  yearSel.value  = now.getFullYear();
      loadMyAttendanceHistory();
    }
    function loadMyAttendanceHistory() {
      var monthSel = document.getElementById('mahMonth');
      var yearSel  = document.getElementById('mahYear');
      var container = document.getElementById('mahListContainer');
      var summaryBar = document.getElementById('mahSummaryBar');
      if (!monthSel || !yearSel || !container) return;
      var month = parseInt(monthSel.value, 10);
      var year  = parseInt(yearSel.value,  10);
      var token = localStorage.getItem('auth_token');
      if (!token) return;
      summaryBar.style.display = 'none';
      container.innerHTML = [1,2,3].map(function() {
        return '<div class="mah-skeleton-card">' +
          '<div class="mah-sk-line" style="width:35%"></div>' +
          '<div class="mah-sk-line" style="width:65%"></div>' +
          '<div class="mah-sk-line" style="width:50%"></div>' +
          '</div>';
      }).join('');
      google.script.run
        .withSuccessHandler(function(res) {
          if (!res || res.status !== 'success') {
            container.innerHTML = '<div class="mah-empty-state">' +
              '<svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>' +
              '<p>Gagal memuat data</p>' +
              '<span>' + escapeHtml((res && res.message) || 'Coba lagi beberapa saat.') + '</span></div>';
            return;
          }
          var days = res.days || [];
          var sum  = res.summary || {};
          if (days.length > 0) {
            summaryBar.style.display = 'flex';
            summaryBar.innerHTML =
              _mahSumChip('🟢', sum.hadir || 0, 'Hadir') +
              _mahSumChip('🔴', sum.tidak_hadir || 0, 'Tidak Hadir') +
              _mahSumChip('⏰', sum.terlambat || 0, 'Terlambat') +
              _mahSumChip('🏖️', sum.libur || 0, 'Hari Libur') +
              _mahSumChip('📅', sum.total_days || 0, 'Total Hari');
          } else {
            summaryBar.style.display = 'none';
            summaryBar.innerHTML = '';
          }
          if (days.length === 0) {
            container.innerHTML = '<div class="mah-empty-state">' +
              '<svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>' +
              '<p>Tidak ada data</p><span>Belum ada data kehadiran untuk periode ini.</span></div>';
            return;
          }
          var html = '';
          days.forEach(function(d) {
            html += _mahRenderDay(d);
          });
          container.innerHTML = html;
        })
        .withFailureHandler(function() {
          container.innerHTML = '<div class="mah-empty-state">' +
            '<svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18.364 5.636l-12.728 12.728M5.636 5.636l12.728 12.728"/></svg>' +
            '<p>Koneksi gagal</p><span>Periksa koneksi internet Anda.</span></div>';
        })
        .getMyAttendanceHistory(token, month, year);
    }
    function _mahSumChip(icon, num, label) {
      return '<div class="mah-sum-chip">' +
        '<span style="font-size:1.1rem;">' + icon + '</span>' +
        '<div><div class="mah-sum-num">' + num + '</div>' +
        '<div class="mah-sum-lbl">' + escapeHtml(label) + '</div></div></div>';
    }
    function _mahRenderDay(d) {
      var dateLabel = escapeHtml(d.date_formatted || d.date);
      var dow       = escapeHtml(d.dow || '');
      if (d.no_record) {
        var noRecBadgeClass, noRecBadgeLabel, noRecDotColor, noRecBodyText;
        if (d.calendar_desc) {
          noRecBadgeClass = d.is_holiday ? 'mah-badge-holiday' : 'mah-badge-noschedule';
          noRecBadgeLabel = d.is_holiday ? '🏖️ Libur' : '📌 Keterangan';
          noRecDotColor   = '#94A3B8';
          noRecBodyText   = escapeHtml(d.calendar_desc);
        } else if (d.has_schedule) {
          noRecBadgeClass = 'mah-badge-absent';
          noRecBadgeLabel = 'Tidak Hadir';
          noRecDotColor   = '#EF4444';
          noRecBodyText   = 'Guru berjadwal namun tidak tercatat hadir pada hari ini.';
        } else {
          noRecBadgeClass = 'mah-badge-noschedule';
          noRecBadgeLabel = 'Tidak ada Jadwal';
          noRecDotColor   = '#94A3B8';
          noRecBodyText   = 'Tidak ada jadwal atau tidak datang ke madrasah.';
        }
        return '<div class="mah-day-card">' +
          '<div class="mah-day-header">' +
            '<div><div class="mah-day-date">' + dateLabel + '</div>' +
            '<div class="mah-day-dow">' + dow + '</div></div>' +
            '<span class="mah-status-badge ' + noRecBadgeClass + '">' +
              (d.calendar_desc ? '' : '<span style="width:6px;height:6px;border-radius:50%;background:' + noRecDotColor + ';display:inline-block;"></span>') +
              noRecBadgeLabel + '</span>' +
          '</div>' +
          '<div class="mah-day-body">' +
            '<p class="mah-empty-day">' + noRecBodyText + '</p>' +
          '</div></div>';
      }
      var hasBothTimes = d.time_in && d.time_out;
      var badgeClass, badgeLabel, badgeDot;
      if (hasBothTimes) {
        badgeClass = 'mah-badge-hadir'; badgeLabel = 'Hadir';
        badgeDot = '#10B981';
      } else if (d.time_in && !d.time_out) {
        badgeClass = 'mah-badge-working'; badgeLabel = 'Sedang Bekerja';
        badgeDot = '#3B82F6';
      } else {
        badgeClass = 'mah-badge-absent'; badgeLabel = 'Tidak Lengkap';
        badgeDot = '#F97316';
      }
      var isLate = d.time_in && d.sched_time_in && d.time_in > d.sched_time_in;
      var lateBadge = isLate
        ? '<span class="mah-status-badge" style="background:#FFF7ED;color:#C2410C;border:1px solid #FDBA74;margin-left:4px;">' +
          '<span style="width:6px;height:6px;border-radius:50%;background:#F97316;display:inline-block;"></span>Terlambat</span>'
        : '';
      var html = '<div class="mah-day-card">' +
        '<div class="mah-day-header">' +
          '<div><div class="mah-day-date">' + dateLabel + '</div>' +
          '<div class="mah-day-dow">' + dow + '</div></div>' +
          '<div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;">' +
            '<span class="mah-status-badge ' + badgeClass + '">' +
              '<span style="width:6px;height:6px;border-radius:50%;background:' + badgeDot + ';display:inline-block;"></span>' +
              badgeLabel + '</span>' +
            lateBadge +
          '</div>' +
        '</div>' +
        '<div class="mah-day-body">' +
          '<div class="mah-time-row">';
      html += '<div class="mah-time-chip">' +
        '<svg width="12" height="12" fill="none" stroke="#10B981" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>' +
        '<span class="mah-time-chip-label">Masuk</span>' +
        '<span class="mah-time-chip-val' + (d.time_in ? '' : ' empty') + '">' +
          (d.time_in ? escapeHtml(d.time_in) : '—') + '</span>';
      if (d.sched_time_in) {
        html += '<span style="font-size:10px;color:#94A3B8;">(Jadwal: ' + escapeHtml(d.sched_time_in) + ')</span>';
      }
      html += '</div>';
      html += '<div class="mah-time-chip">' +
        '<svg width="12" height="12" fill="none" stroke="#F97316" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>' +
        '<span class="mah-time-chip-label">Pulang</span>' +
        '<span class="mah-time-chip-val' + (d.time_out ? '' : ' empty') + '">' +
          (d.time_out ? escapeHtml(d.time_out) : '—') + '</span>';
      if (d.sched_time_out) {
        html += '<span style="font-size:10px;color:#94A3B8;">(Jadwal: ' + escapeHtml(d.sched_time_out) + ')</span>';
      }
      html += '</div>';
      html += '</div>'; // end mah-time-row
      if (d.calendar_desc) {
        var bannerIcon  = d.is_holiday ? '🏖️' : '📌';
        var bannerLabel = d.is_holiday ? 'Hari Libur' : 'Keterangan';
        html += '<div class="mah-holiday-banner">' +
          '<span>' + bannerIcon + '</span>' +
          '<span>' + bannerLabel + ': <strong>' + escapeHtml(d.calendar_desc) + '</strong></span>' +
          '</div>';
      }
      if (d.leaves && d.leaves.length > 0) {
        html += '<div class="mah-leaves">' +
          '<div class="mah-leaves-title">🚪 Izin Keluar Sementara (' + d.leaves.length + 'x)</div>';
        d.leaves.forEach(function(lv) {
          var timeRange = (lv.leave_time || '—') + ' → ' + (lv.return_time || '—');
          html += '<div class="mah-leave-item">' +
            '<span class="mah-leave-time">' + escapeHtml(timeRange) + '</span>';
          if (lv.reason) {
            html += '<span class="mah-leave-reason">"' + escapeHtml(lv.reason) + '"</span>';
          }
          html += '</div>';
        });
        html += '</div>';
      }
      
      if (d.transport_nominal && d.transport_nominal > 0) {
        var formatRp = function(num) {
          return 'Rp ' + Math.round(num).toString().replace(/\\B(?=(\\d{3})+(?!\\d))/g, ".");
        };
        html += '<div style="margin-top: 12px; padding-top: 12px; border-top: 1px dashed #E2E8F0; display: flex; justify-content: space-between; align-items: center;">' +
          '<div style="display: flex; align-items: center; gap: 8px;">' +
            '<div style="padding: 6px; background-color: #EFF6FF; color: #2563EB; border-radius: 8px;">' +
              '<svg style="width: 16px; height: 16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' +
            '</div>' +
            '<div>' +
              '<div style="font-size: 12px; font-weight: 600; color: #334155;">Transportasi</div>' +
              '<div style="font-size: 10px; color: #94A3B8;">Durasi: ' + Math.round(d.transport_percentage) + '%</div>' +
            '</div>' +
          '</div>' +
          '<div style="font-weight: 700; font-size: 14px; color: #2563EB;">' + formatRp(d.transport_nominal) + '</div>' +
        '</div>';
      }
      
      html += '</div></div>'; // end mah-day-body + mah-day-card
      return html;
    }
    function exportMyAttendancePDF() {
      var monthSel = document.getElementById('mahMonth');
      var yearSel  = document.getElementById('mahYear');
      var container = document.getElementById('mahListContainer');
      var summaryBar = document.getElementById('mahSummaryBar');
      if (!monthSel || !yearSel || !container) return;

      // Jangan export jika belum ada data atau sedang loading
      if (container.querySelector('.mah-skeleton-card') || container.querySelector('.mah-empty-state')) {
        showToast('Tidak ada data kehadiran untuk diekspor.', 'warning');
        return;
      }
      if (!container.querySelector('.mah-day-card')) {
        showToast('Tidak ada data kehadiran untuk diekspor.', 'warning');
        return;
      }

      var bulanNames = ['Januari','Februari','Maret','April','Mei','Juni',
                        'Juli','Agustus','September','Oktober','November','Desember'];
      var month = parseInt(monthSel.value, 10);
      var year  = parseInt(yearSel.value, 10);
      var bulanLabel = bulanNames[month - 1] || monthSel.options[monthSel.selectedIndex].text;

      // Ambil nama guru dari navbar
      var namaGuru = '';
      var namaEl = document.getElementById('navUserName') || document.getElementById('sidebarUserName') || document.getElementById('userName');
      if (namaEl) namaGuru = namaEl.textContent.trim();

      var btn = document.getElementById('mahBtnExportPdf');
      var btnOriginalHTML = btn ? btn.innerHTML : '';
      if (btn) { btn.disabled = true; btn.innerHTML = '<svg class="animate-spin" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg> Menyiapkan...'; }

      // Buat container PDF di memori (tidak perlu di-append ke DOM untuk mencegah bug layout offset)
      // A4 @96dpi = 794px lebar. Margin 1cm = ~37.8px per sisi @96dpi.
      // Lebar konten aktif = 794 - 2*37.8 = 718px (pas dengan area cetak 190mm)
      var pdfWrap = document.createElement('div');
      pdfWrap.id = 'mah-pdf-export-container';
      pdfWrap.style.cssText = [
        'width:794px',        /* lebar A4 @96dpi = 210mm */
        'background:#ffffff',
        'font-family:Arial,sans-serif',
        'font-size:12px',
        'color:#1E293B',
        'box-sizing:border-box',
        'padding:38px'        /* margin 1cm (≈37.8px) semua sisi, konten tidak terpotong */
      ].join(';');

      // Header PDF
      var summaryHTML = '';
      if (summaryBar && summaryBar.style.display !== 'none') {
        var chips = summaryBar.querySelectorAll('.mah-sum-chip');
        var chipsHTML = '';
        chips.forEach(function(chip) {
          var numEl  = chip.querySelector('.mah-sum-num');
          var lblEl  = chip.querySelector('.mah-sum-lbl');
          var iconEl = chip.querySelector('span:first-child');
          var icon = iconEl ? iconEl.textContent.trim() : '';
          var num  = numEl  ? numEl.textContent.trim()  : '';
          var lbl  = lblEl  ? lblEl.textContent.trim()  : '';
          chipsHTML +=
            '<td style="text-align:center;padding:6px 10px;border:1px solid #E2E8F0;border-radius:8px;background:#F8FAFC;min-width:70px;">' +
              '<div style="font-size:13px;">' + icon + '</div>' +
              '<div style="font-size:15px;font-weight:800;color:#1E293B;">' + num + '</div>' +
              '<div style="font-size:9px;color:#64748B;font-weight:600;">' + lbl + '</div>' +
            '</td>';
        });
        summaryHTML =
          '<table style="width:100%;border-collapse:separate;border-spacing:6px;margin-bottom:14px;"><tr>' +
            chipsHTML +
          '</tr></table>';
      }

      var nowStr = new Date().toLocaleDateString('id-ID', {day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
      pdfWrap.innerHTML =
        '<div style="background:#0F172A;color:#fff;padding:16px 20px;border-radius:8px;margin-bottom:12px;">' +
          '<div style="font-size:9px;font-weight:700;color:#7DD3FC;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:5px;">Riwayat Kehadiran</div>' +
          '<div style="font-size:18px;font-weight:800;margin-bottom:3px;">Riwayat Kehadiran Saya</div>' +
          '<div style="font-size:11px;color:#CBD5E1;">Periode: ' + bulanLabel + ' ' + year + (namaGuru ? '  |  ' + namaGuru : '') + '</div>' +
          '<div style="font-size:9px;color:#64748B;margin-top:3px;">Dicetak: ' + nowStr + '</div>' +
        '</div>' +
        (summaryHTML ? '<div style="margin-bottom:12px;">' + summaryHTML + '</div>' : '');

      // Render setiap card kehadiran
      var cardsWrap = document.createElement('div');
      cardsWrap.style.cssText = 'padding:0;';

      var dayCards = container.querySelectorAll('.mah-day-card');
      dayCards.forEach(function(card) {
        var dateEl = card.querySelector('.mah-day-date');
        var dowEl  = card.querySelector('.mah-day-dow');

        // Badge teks
        var badges = card.querySelectorAll('.mah-status-badge');
        var badgeCells = '';
        badges.forEach(function(b) {
          var txt = (b.textContent || '').replace(/\s+/g, ' ').trim();
          if (txt) badgeCells += '<span style="font-size:8px;font-weight:800;padding:2px 7px;border-radius:999px;background:#F1F5F9;color:#475569;margin-left:3px;white-space:nowrap;">' + txt + '</span>';
        });

        var dateStr = dateEl ? dateEl.textContent.trim() : '';
        var dowStr  = dowEl  ? dowEl.textContent.trim()  : '';

        // Time chips — pakai <table> agar html2canvas render stabil
        var timeChips = card.querySelectorAll('.mah-time-chip');
        var timesCells = '';
        timeChips.forEach(function(tc) {
          var labelEl = tc.querySelector('.mah-time-chip-label');
          var valEl   = tc.querySelector('.mah-time-chip-val');
          var schedSpan = tc.querySelector('span[style*="10px"]');
          var label = labelEl ? labelEl.textContent.trim() : '';
          var val   = valEl   ? valEl.textContent.trim()   : '\u2014';
          var sched = schedSpan ? schedSpan.textContent.trim() : '';
          timesCells +=
            '<div style="display:inline-block; padding:3px 8px; background:#F8FAFC; border:1px solid #E2E8F0; border-radius:5px; font-size:10px; white-space:nowrap; margin-right:6px; margin-bottom:6px;">' +
              '<span style="font-weight:600;color:#64748B;">' + label + '</span> ' +
              '<span style="font-family:monospace;font-weight:800;color:#1E293B;">' + val + '</span>' +
              (sched ? ' <span style="font-size:8px;color:#94A3B8;">' + sched + '</span>' : '') +
            '</div>';
        });
        var timesHTML = timesCells
          ? '<div style="margin-bottom:5px;">' + timesCells + '</div>'
          : '';

        // Empty day text
        var emptyDayEl = card.querySelector('.mah-empty-day');
        var emptyText  = emptyDayEl ? emptyDayEl.textContent.trim() : '';

        // Holiday banner
        var bannerEl  = card.querySelector('.mah-holiday-banner');
        var bannerHTML = bannerEl
          ? '<div style="background:#F0FDF4;border:1px solid #86EFAC;border-radius:5px;padding:4px 8px;font-size:9px;color:#15803D;font-weight:600;margin-top:4px;">' + bannerEl.textContent.replace(/\s+/g,' ').trim() + '</div>'
          : '';

        // Izin keluar sementara
        var leavesEl = card.querySelector('.mah-leaves');
        var leavesHTML = '';
        if (leavesEl) {
          var titleEl = leavesEl.querySelector('.mah-leaves-title');
          leavesHTML = '<div style="margin-top:6px;border-top:1px dashed #E2E8F0;padding-top:5px;">' +
            '<div style="font-size:8px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:3px;">' +
              (titleEl ? titleEl.textContent.trim() : 'Izin Keluar') +
            '</div>';
          leavesEl.querySelectorAll('.mah-leave-item').forEach(function(li) {
            var timeEl   = li.querySelector('.mah-leave-time');
            var reasonEl = li.querySelector('.mah-leave-reason');
            leavesHTML += '<div style="background:#FFF7ED;border:1px solid #FED7AA;border-radius:4px;padding:2px 7px;font-size:9px;margin-bottom:2px;">' +
              '<span style="font-family:monospace;font-weight:800;color:#9A3412;">' + (timeEl ? timeEl.textContent.trim() : '') + '</span>' +
              (reasonEl ? ' <span style="color:#78350F;font-style:italic;">' + reasonEl.textContent.trim() + '</span>' : '') +
            '</div>';
          });
          leavesHTML += '</div>';
        }

        // Transport allowance
        var transportHTML = '';
        card.querySelectorAll('div').forEach(function(d) {
          if (d.style && d.style.borderTop && d.style.borderTop.indexOf('dashed') !== -1) {
            var nomEl = d.querySelector('[style*="font-weight: 700"][style*="color: rgb(37, 99, 235)"], [style*="font-weight: 700"][style*="color: #2563EB"]');
            if (!nomEl) nomEl = d.querySelector('[style*="2563EB"]');
            if (nomEl) {
              transportHTML =
                '<table style="width:100%;margin-top:5px;border-top:1px dashed #E2E8F0;padding-top:4px;"><tr>' +
                  '<td style="font-size:9px;font-weight:600;color:#334155;">Transportasi</td>' +
                  '<td style="text-align:right;font-weight:800;font-size:11px;color:#2563EB;">' + nomEl.textContent.trim() + '</td>' +
                '</tr></table>';
            }
          }
        });

        // Warna border berdasarkan status
        var borderColor = '#E2E8F0';
        if (badges[0]) {
          var bc = badges[0].className;
          if (bc.indexOf('mah-badge-hadir')    !== -1) borderColor = '#A7F3D0';
          else if (bc.indexOf('mah-badge-absent')  !== -1) borderColor = '#FECACA';
          else if (bc.indexOf('mah-badge-holiday') !== -1) borderColor = '#86EFAC';
          else if (bc.indexOf('mah-badge-working') !== -1) borderColor = '#BFDBFE';
        }

        var cardHTML =

      var pdfHtmlString = pdfWrap.outerHTML;

        margin:      [0, 0, 0, 0],

        html2canvas: { scale: 3.125, useCORS: true, logging: false, windowWidth: 794, scrollX: 0, scrollY: 0 },

      setTimeout(function() {

    function renderAttendanceList(list) {

        } else if (!item.sched_time_in) {
          statusBadge = '<span class="inline-flex items-center gap-1.5 py-1 px-2.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-600 border border-slate-200"><span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>Belum Jadwal</span>';
        } else {
          statusBadge = '<span class="inline-flex items-center gap-1.5 py-1 px-2.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-700 border border-amber-200"><span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>Belum Datang</span>';

        const safeName   = escapeHtml(item.full_name || 'Unknown');

        const kepalaTag  = item.isKepalaSekolah ? ' <span class="text-[10px] text-indigo-600 font-bold">(Kepala Sekolah)</span>' : '';

        let schedInfo = '';

          schedInfo = `<div class="text-[10px] text-violet-500 mt-0.5 italic" title="Alasan penambahan">📝 ${escapeHtml(item.extra_notes)}</div>`;
        } else if (item.sched_time_in && item.sched_time_out) {

        let actionHtml = `<div class="flex flex-wrap items-center justify-center gap-1">`;
        if (item.canInputSched) {
          actionHtml += `<button onclick="openSetJadwalModal('${safeUserId}','${safeNameJs}','${item.sched_time_in||''}','${item.sched_time_out||''}')" class="px-2 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded text-xs font-semibold border border-indigo-200 transition" title="Set Jam Jadwal">Jadwal</button>`;
        }
        if (item.canInputTimeIn) {
          actionHtml += `<button onclick="openTimeInModal('${safeUserId}','${safeNameJs}')" class="px-2 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-600 rounded text-xs font-semibold border border-emerald-200 transition">Masuk</button>`;

          actionHtml += `<button disabled title="${escapeHtml(item.timeInBlockReason||'Tidak diizinkan')}" class="px-2 py-1 bg-slate-50 text-slate-400 rounded text-xs font-semibold border border-slate-200 cursor-not-allowed">Masuk</button>`;

        html += `<tr class="hover:bg-slate-50 transition group">
          <td class="py-3 px-4 text-center text-sm text-slate-500">${index + 1}</td>

          <td class="py-3 px-4">${actionHtml}</td>
        </tr>`;

      var sel = document.getElementById('selAddAttendeeUser');
      if (!sel) return;
      sel.innerHTML = '<option value="">-- Pilih Guru --</option>';
      users.forEach(function(u) {
        var opt = document.createElement('option');
        opt.value       = u.id;
        opt.textContent = (u.full_name || u.username || u.id) +
                          (u.nip ? ' (' + u.nip + ')' : '');
        sel.appendChild(opt);
      });

    function _filterAddAttendeeSelect(query) {
      var q = String(query || '').toLowerCase().trim();
      var filtered = q
        ? _addAttendeeAllUsers.filter(function(u) {
            return (u.full_name || '').toLowerCase().includes(q) ||
                   (u.username  || '').toLowerCase().includes(q) ||
                   (u.nip       || '').toLowerCase().includes(q);
          })
        : _addAttendeeAllUsers;
      _populateAddAttendeeSelect(filtered);
    }

     */
    function _openLeaveFromBtn(btn, canInput) {
      const userId  = btn.getAttribute('data-userid')  || '';
      const name    = btn.getAttribute('data-username') || '';
      const rawJson = btn.getAttribute('data-leaves')  || '[]';
      let leaves = [];
      try { leaves = JSON.parse(rawJson); } catch (_) { leaves = []; }
      if (canInput) {
        _openLeaveModal(userId, name, leaves, true);
      } else {
        _openLeaveModal(userId, name, leaves, false);
      }
    }
    /**
     * Satu fungsi tunggal untuk membuka modal izin keluar.
     * @param {string}  userId
     * @param {string}  name
     * @param {Array}   leavesArr
     * @param {boolean} canInput - true = tampilkan form input; false = view-only
     */
    function _openLeaveModal(userId, name, leavesArr, canInput) {
      _leaveModalUserId   = userId;
      _leaveModalUserName = name;
      _leaveModalLeaves   = Array.isArray(leavesArr) ? leavesArr : [];
      document.getElementById('lblLeaveModalUserName').textContent = name;
      const formSection = document.getElementById('leaveFormSection');
      if (formSection) {
        if (canInput) {
          formSection.classList.remove('hidden');
          const now = new Date();
          document.getElementById('inpLeaveTime').value   = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
          document.getElementById('inpReturnTime').value  = '';
          document.getElementById('inpLeaveReason').value = '';
        } else {
          formSection.classList.add('hidden');
        }
      }
      _renderLeaveList(canInput);
      const modal = document.getElementById('attendanceLeaveModal');
      if (modal) modal.classList.remove('hidden');
    }
    function closeLeaveModal() {
      const modal = document.getElementById('attendanceLeaveModal');
      if (modal) modal.classList.add('hidden');
    }
    /**
     * @param {boolean} canDelete - apakah tombol hapus per entri ditampilkan
     */
    function _renderLeaveList(canDelete) {
      const container = document.getElementById('leaveListContainer');
      if (!container) return;
      if (!_leaveModalLeaves || _leaveModalLeaves.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 text-center py-3 italic">Belum ada catatan izin keluar sementara.</p>';
        return;
      }
      let html = '<div class="space-y-2">';
      _leaveModalLeaves.forEach(function(lv) {
        const leaveDisp  = escapeHtml(lv.leave_time  || '-');
        const returnDisp = escapeHtml(lv.return_time || '-');
        const reasonDisp = escapeHtml(lv.reason      || '\u2014');
        const safeId     = escapeHtml(lv.id || '');
        let durLabel = '';
        if (lv.leave_time && lv.return_time) {
          const lParts = lv.leave_time.split(':');
          const rParts = lv.return_time.split(':');
          const lMin   = parseInt(lParts[0], 10) * 60 + parseInt(lParts[1], 10);
          const rMin   = parseInt(rParts[0], 10) * 60 + parseInt(rParts[1], 10);
          const diff   = rMin - lMin;
          if (diff > 0) {
            const h = Math.floor(diff / 60);
            const m = diff % 60;
            durLabel = h > 0 ? (h + 'j ' + m + 'm') : (m + ' mnt');
          }
        }
        const deleteBtn = (canDelete !== false)
          ? '<button onclick="_deleteLeave(\'' + safeId + '\')" class="text-rose-400 hover:text-rose-600 transition flex-shrink-0 mt-0.5" title="Hapus entri ini">' +
              '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>' +
            '</button>'
          : '';
        html += '<div class="flex items-start justify-between gap-2 bg-rose-50 border border-rose-100 rounded-xl px-3 py-2.5">' +
          '<div class="flex-1 min-w-0">' +
            '<div class="flex items-center gap-2 flex-wrap">' +
              '<span class="font-mono text-sm font-bold text-rose-700">' + leaveDisp + ' \u2013 ' + returnDisp + '</span>' +
              (durLabel ? '<span class="text-[10px] bg-rose-100 text-rose-600 border border-rose-200 rounded-full px-2 py-0.5 font-semibold">' + escapeHtml(durLabel) + '</span>' : '') +
            '</div>' +
            '<p class="text-xs text-slate-500 mt-0.5 truncate" title="' + reasonDisp + '">' + reasonDisp + '</p>' +
          '</div>' +
          deleteBtn +
        '</div>';
      });
      html += '</div>';
      container.innerHTML = html;
    }
    function submitLeave() {
      const dateStr    = document.getElementById('inpAttendanceDate').value;
      const leaveTime  = document.getElementById('inpLeaveTime').value;
      const returnTime = document.getElementById('inpReturnTime').value;
      const reason     = document.getElementById('inpLeaveReason').value;
      if (!leaveTime || !returnTime) {
        showToast('Jam keluar dan jam kembali wajib diisi.', 'error'); return;
      }
      if (!reason || !reason.trim()) {
        showToast('Keterangan wajib diisi.', 'error');
        try { document.getElementById('inpLeaveReason').focus(); } catch (_) {}
        return;
      }
      const btn = document.getElementById('btnSubmitLeave');
      const origHtml = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = 'Menyimpan...';
      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false; btn.innerHTML = origHtml;
          if (res && res.status === 'success') {
            showToast(res.message || 'Izin keluar berhasil dicatat.');
            if (res.id) {
              _leaveModalLeaves.push({ id: res.id, leave_time: leaveTime, return_time: returnTime, reason: reason });
              _renderLeaveList(true);
            }
            document.getElementById('inpLeaveReason').value = '';
            const now = new Date();
            document.getElementById('inpLeaveTime').value  = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
            document.getElementById('inpReturnTime').value = '';
            _loadAttendanceList();
          } else {
            showToast((res && res.message) || 'Gagal menyimpan izin keluar.', 'error');
          }
        })
        .withFailureHandler(function() {
          btn.disabled = false; btn.innerHTML = origHtml;
          showToast('Koneksi gagal.', 'error');
        })
        .saveAttendanceLeave(localStorage.getItem('auth_token'), {
          user_id:     _leaveModalUserId,
          date:        dateStr,
          leave_time:  leaveTime,
          return_time: returnTime,
          reason:      reason
        });
    }
    function _deleteLeave(leaveId) {
      if (!leaveId || !confirm('Hapus entri izin keluar ini?')) return;
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            showToast(res.message || 'Entri dihapus.');
            _leaveModalLeaves = _leaveModalLeaves.filter(function(lv) { return lv.id !== leaveId; });
            _renderLeaveList(true);
            _loadAttendanceList();
          } else {
            showToast((res && res.message) || 'Gagal menghapus.', 'error');
          }
        })
        .withFailureHandler(function() {
          showToast('Koneksi gagal.', 'error');
        })
        .deleteAttendanceLeave(localStorage.getItem('auth_token'), leaveId);
    }
    const DAY_NAMES  = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
    const DAY_COLORS = {
      1:'bg-blue-100 text-blue-700', 2:'bg-violet-100 text-violet-700',
      3:'bg-emerald-100 text-emerald-700', 4:'bg-amber-100 text-amber-700',
      5:'bg-rose-100 text-rose-700', 6:'bg-orange-100 text-orange-700',
      0:'bg-slate-100 text-slate-600'
    };
    let _schedTplCache = { data:[], is_exam_period:false, active_type:'KBM' };
    function initSchedTemplates() {
      const dateStr = (document.getElementById('inpAttendanceDate')||{}).value||'';
      ['tbodySchedKBM','tbodySchedUjian'].forEach(function(id) {
        const t = document.getElementById(id);
        if (t) t.innerHTML = '<tr><td colspan="4" class="text-center py-6 text-slate-400 text-xs">Memuat...</td></tr>';
      });
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            _schedTplCache = res;
            renderSchedTemplates(res);
          } else {
            ['tbodySchedKBM','tbodySchedUjian'].forEach(function(id) {
              const t = document.getElementById(id);
              if (t) t.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-red-500 text-xs">${escapeHtml((res&&res.message)||'Gagal memuat.')}</td></tr>`;
            });
          }
        })
        .withFailureHandler(function() {
          ['tbodySchedKBM','tbodySchedUjian'].forEach(function(id) {
            const t = document.getElementById(id); if (t) t.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-red-500 text-xs">Koneksi gagal.</td></tr>';
          });
        })
        .getAttendanceSchedTemplates(localStorage.getItem('auth_token'), dateStr);
    }
    function renderSchedTemplates(res) {
      const data       = res.data || [];
      const activeType = res.active_type || 'KBM';
      const isExam     = !!res.is_exam_period;
      const banner = document.getElementById('schedTypeInfoBanner');
      if (banner) {
        banner.className = 'mb-4 flex items-center gap-2.5 px-4 py-3 rounded-xl border text-sm font-medium ' +
          (isExam ? 'bg-violet-50 border-violet-200 text-violet-700' : 'bg-emerald-50 border-emerald-200 text-emerald-700');
        banner.innerHTML = isExam
          ? '<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>&nbsp;Tanggal ini masuk <strong>Periode Ujian</strong> — Jam Jadwal Ujian yang aktif.'
          : '<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>&nbsp;Tanggal ini hari <strong>KBM</strong> — Jam Jadwal KBM yang aktif.';
        banner.classList.remove('hidden');
      }
      ['badgeKBMActive','badgeUjianActive'].forEach(function(bid) { const b=document.getElementById(bid); if(b)b.classList.add('hidden'); });
      const activeBadgeId = activeType==='UJIAN' ? 'badgeUjianActive' : 'badgeKBMActive';
      const ab = document.getElementById(activeBadgeId); if (ab) ab.classList.remove('hidden');
      const kbmData   = data.filter(function(d){ return d.sched_type==='KBM';   });
      const ujianData = data.filter(function(d){ return d.sched_type==='UJIAN'; });
      function renderRows(tbodyId, rows, schedType) {
        const tbody = document.getElementById(tbodyId); if (!tbody) return;
        const map = {};
        rows.forEach(function(r){ map[r.day_index]=r; });
        let html = '';
        for (let di=1; di<=6; di++) {
          const rec      = map[di];
          const dayName  = DAY_NAMES[di];
          const dayColor = DAY_COLORS[di];
          const timeIn   = rec ? escapeHtml(formatHHmm(rec.sched_time_in))  : '-';
          const timeOut  = rec ? escapeHtml(formatHHmm(rec.sched_time_out)) : '-';
          const safeId   = rec ? escapeHtml(rec.id) : '';
          const tplJson  = rec ? JSON.stringify(rec).replace(/"/g,'&quot;') : 'null';
          const hasMono  = rec ? 'font-mono font-bold text-slate-700' : 'text-slate-400';
          html += `<tr class="hover:bg-slate-50 transition">
            <td class="py-2.5 px-4"><span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-bold ${dayColor}">${dayName}</span></td>
            <td class="py-2.5 px-4 text-center text-sm ${hasMono}">${timeIn}</td>
            <td class="py-2.5 px-4 text-center text-sm ${hasMono}">${timeOut}</td>
            <td class="py-2.5 px-4 text-center">
              <div class="flex items-center justify-center gap-1">
                <button onclick="openSchedTemplateModal(${tplJson},'${schedType}',${di})" class="action-btn ${rec?'action-btn-edit':'action-btn-approve'}" title="${rec?'Edit':'Atur'}">
                  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${rec?'M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z':'M12 4v16m8-8H4'}"/></svg>
                </button>
                ${rec?`<button onclick="deleteSchedTemplate('${safeId}','${escapeHtml(dayName+' '+schedType)}')" class="action-btn action-btn-delete" title="Hapus"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>`:''}
              </div>
            </td>
          </tr>`;
        }
        tbody.innerHTML = html;
      }
      renderRows('tbodySchedKBM',   kbmData,   'KBM');
      renderRows('tbodySchedUjian', ujianData, 'UJIAN');
    }
    function openSchedTemplateModal(tpl, schedType, dayIndex) {
      const modal = document.getElementById('schedTemplateModal'); if (!modal) return;
      const isEdit = tpl && tpl.id;
      const type   = schedType || (isEdit ? (tpl.sched_type||'KBM') : 'KBM');
      const di     = (dayIndex!==undefined&&dayIndex!==null) ? dayIndex : (isEdit ? tpl.day_index : '');
      const typeLbl = type==='UJIAN' ? '📋 Ujian' : '📚 KBM';
      document.getElementById('lblSchedTemplateModalTitle').textContent = (isEdit?'Edit':'Atur')+' Jam Jadwal '+typeLbl;
      document.getElementById('lblSchedTemplateModalSub').textContent   = 'Jam masuk & pulang untuk '+typeLbl+' hari '+(DAY_NAMES[di]||'-');
      document.getElementById('inpSchedTemplateId').value        = isEdit ? tpl.id : '';
      document.getElementById('inpSchedTemplateSchedType').value = type;
      document.getElementById('inpSchedTemplateDayIndex').value  = di;
      document.getElementById('inpSchedTemplateTimeIn').value    = isEdit ? (formatHHmm(tpl.sched_time_in)||'')  : '';
      document.getElementById('inpSchedTemplateTimeOut').value   = isEdit ? (formatHHmm(tpl.sched_time_out)||'') : '';
      document.getElementById('btnSubmitSchedTemplate').textContent = 'Simpan & Terapkan';
      const dateStr = (document.getElementById('inpAttendanceDate')||{}).value||'';
      const noteEl  = document.getElementById('lblSchedTemplateApplyNote');
      if (noteEl) {
        if (dateStr) { noteEl.textContent='Setelah disimpan, jam jadwal ini otomatis diterapkan ke semua guru pada '+dateStr+'.'; noteEl.classList.remove('hidden'); }
        else noteEl.classList.add('hidden');
      }
      modal.classList.remove('hidden');
      setTimeout(function(){ const el=document.getElementById('inpSchedTemplateTimeIn'); if(el)el.focus(); },100);
    }
    function closeSchedTemplateModal() {
      const modal = document.getElementById('schedTemplateModal'); if (modal) modal.classList.add('hidden');
    }
    function submitSchedTemplate() {
      const schedType = document.getElementById('inpSchedTemplateSchedType').value;
      const dayIndex  = document.getElementById('inpSchedTemplateDayIndex').value;
      const timeIn    = document.getElementById('inpSchedTemplateTimeIn').value;
      const timeOut   = document.getElementById('inpSchedTemplateTimeOut').value;
      const dateStr   = (document.getElementById('inpAttendanceDate')||{}).value||'';
      if (!dayIndex)           { showToast('Pilih hari terlebih dahulu.','warning'); return; }
      if (!timeIn || !timeOut) { showToast('Jam masuk dan jam pulang wajib diisi.','warning'); return; }
      const payload = { sched_type: schedType, day_index: parseInt(dayIndex,10), sched_time_in: timeIn, sched_time_out: timeOut };
      if (dateStr) payload.apply_date = dateStr;
      const btn = document.getElementById('btnSubmitSchedTemplate');
      const orig = btn.textContent;
      btn.disabled = true; btn.textContent = 'Menyimpan...';
      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false; btn.textContent = orig;
          if (res && res.status === 'success') {
            closeSchedTemplateModal();
            showToast(res.message || 'Jam jadwal berhasil disimpan.');
            initSchedTemplates();
            if (dateStr) _loadAttendanceList();
          } else {
            showToast((res&&res.message)||'Gagal menyimpan.','error');
          }
        })
        .withFailureHandler(function(){ btn.disabled=false; btn.textContent=orig; showToast('Koneksi gagal.','error'); })
        .saveAttendanceSchedTemplate(localStorage.getItem('auth_token'), payload);
    }
    function deleteSchedTemplate(id, label) {
      showConfirm('Hapus Jam Jadwal', `Hapus jam jadwal <strong>${escapeHtml(label)}</strong>? Data ini tidak dapat dipulihkan.`, function() {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res&&res.status==='success') { showToast(res.message||'Dihapus.'); initSchedTemplates(); }
            else showToast((res&&res.message)||'Gagal menghapus.','error');
          })
          .withFailureHandler(function(){ showToast('Koneksi gagal.','error'); })
          .deleteAttendanceSchedTemplate(localStorage.getItem('auth_token'), id);
      });
    }
    function applyTemplateToDate(templateId, templateLabel) {
      const dateStr = (document.getElementById('inpAttendanceDate')||{}).value||'';
      if (!dateStr) { showToast('Pilih tanggal terlebih dahulu.','warning'); return; }
      const d       = new Date(dateStr+'T00:00:00');
      const dayName = DAY_NAMES[d.getDay()] || dateStr;
      const aType   = _schedTplCache.active_type || 'KBM';
      const tplName = templateLabel || ('Jam Jadwal '+aType+' '+dayName);
      showConfirm('Terapkan Jam Jadwal',
        `Jam jadwal <strong>${escapeHtml(tplName)}</strong> akan diterapkan ke semua guru yang belum memiliki jam jadwal pada <strong>${dateStr}</strong>. Guru yang sudah memiliki jam jadwal tidak akan diubah. Lanjutkan?`,
        function() {
          const btn = document.getElementById('btnApplyTplToDate');
          const orig = btn ? btn.innerHTML : null;
          if (btn) { btn.disabled=true; btn.textContent='Menerapkan...'; }
          const payload = { date: dateStr };
          if (templateId) payload.template_id = templateId;
          google.script.run
            .withSuccessHandler(function(res) {
              if (btn) { btn.disabled=false; if(orig) btn.innerHTML=orig; }
              if (res&&res.status==='success') {
                showToast(res.message||'Diterapkan.');
                if (_attActiveTab==='kehadiran') _loadAttendanceList();
              } else {
                showToast((res&&res.message)||'Gagal menerapkan.','error');
              }
            })
            .withFailureHandler(function(){ if(btn){btn.disabled=false;if(orig)btn.innerHTML=orig;} showToast('Koneksi gagal.','error'); })
            .applySchedTemplatesToDate(localStorage.getItem('auth_token'), payload);
        }
      );
    }
    document.addEventListener('keydown', function(e) {
      if (e.key==='Escape'||e.key==='Esc') {
        const m = document.getElementById('schedTemplateModal');
        if (m&&!m.classList.contains('hidden')) closeSchedTemplateModal();
      }
    });
</script>
