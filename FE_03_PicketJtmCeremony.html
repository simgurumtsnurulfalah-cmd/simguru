<script>
      const appVersionEl = document.getElementById('cfgAppVersion');
      const kepsek = (kepsekEl ? kepsekEl.value : '').trim();
      const salaryRaw = salaryEl ? salaryEl.value : '';
      const level = levelEl ? levelEl.value : 'SD';
      const useParallel = useParallelEl ? useParallelEl.checked : false;
      const parallelMax = parallelMaxEl ? parallelMaxEl.value : 'A';
      const tahunPelajaran = (tahunPelajaranEl ? tahunPelajaranEl.value : '').trim();
      const semester = (semesterEl ? semesterEl.value : 'Ganjil');
      const waktuPerJTM = (waktuPerJTMEl ? waktuPerJTMEl.value : '40');
      const appVersion = (appVersionEl ? appVersionEl.value : '').trim();
      if (!kepsek) {
        showToast('Nama kepala sekolah wajib diisi.', 'error');
        if (kepsekEl) try { kepsekEl.focus(); } catch (_) { }
        return;
      }
      if (salaryRaw === '' || isNaN(Number(salaryRaw)) || Number(salaryRaw) < 0) {
        showToast('Gaji pokok per JTM harus angka ≥ 0.', 'error');
        if (salaryEl) try { salaryEl.focus(); } catch (_) { }
        return;
      }
      if (!tahunPelajaran) {
        showToast('Tahun pelajaran wajib diisi.', 'error');
        if (tahunPelajaranEl) try { tahunPelajaranEl.focus(); } catch (_) { }
        return;
      }
      if (!waktuPerJTM || isNaN(Number(waktuPerJTM)) || Number(waktuPerJTM) <= 0) {
        showToast('Waktu per JTM harus angka > 0.', 'error');
        if (waktuPerJTMEl) try { waktuPerJTMEl.focus(); } catch (_) { }
        return;
      }
      if (!appVersion) {
        showToast('Versi aplikasi wajib diisi.', 'error');
        if (appVersionEl) try { appVersionEl.focus(); } catch (_) { }
        return;
      }
      let classData = {};
      const inputs = document.querySelectorAll('[id^="inpStd_"]');
      inputs.forEach(inp => {
        const key = 'std_kelas_' + inp.id.split('inpStd_')[1];
        classData[key] = inp.value;
      });
      const configData = {
        kepala_sekolah: kepsek,
        base_salary: salaryRaw,
        tingkatan: level,
        use_parallel: useParallel ? 'true' : 'false',
        parallel_max: parallelMax,
        tahun_pelajaran: tahunPelajaran,
        semester: semester,
        waktu_per_jtm: waktuPerJTM,
        app_version: appVersion,
        ...classData
      };
      var btn = document.getElementById('btnSaveConfig');
      if (btn && btn.dataset.busy === 'true') return;
      var restore = (typeof _busyButton === 'function') ? _busyButton(btn, 'Menyimpan...') : function () {
        if (btn) { btn.disabled = true; btn.dataset._oldHTML = btn.innerHTML; btn.innerHTML = 'Menyimpan...'; }
        return function () { if (btn) { btn.disabled = false; if (btn.dataset._oldHTML) { btn.innerHTML = btn.dataset._oldHTML; delete btn.dataset._oldHTML; } } };
      }();
      google.script.run.withSuccessHandler((res) => {
        restore();
        if (res && res.status === 'success') {
          showToast('Konfigurasi sistem disimpan', 'success');
          globalConfig = { ...globalConfig, ...configData };
          if (document.getElementById('txtFooterVersion')) {
             document.getElementById('txtFooterVersion').innerText = configData.app_version || '2.1.1';
          }
          if (document.getElementById('txtLoginVersionLeft')) {
             document.getElementById('txtLoginVersionLeft').innerText = configData.app_version || '2.1.1';
          }
          if (typeof populateGlobalClassSelects === 'function') populateGlobalClassSelects();
        }
        else showToast((res && res.message) || 'Gagal menyimpan konfigurasi.', 'error');
      }).withFailureHandler((err) => {
        restore();
        showToast('Koneksi gagal: ' + (err && err.message ? err.message : err), 'error');
      }).saveSystemConfig(token, configData);
    }
    function saveTransportConfigUI() {
      const token = localStorage.getItem('auth_token');
      const tarifEl = document.getElementById('cfgTarifPerKm');
      const enabledEl = document.getElementById('cfgTransportEnabled');
      const tarif_per_km = tarifEl ? tarifEl.value : '';
      const enabled = enabledEl ? enabledEl.checked : false;
      if (!tarif_per_km || isNaN(Number(tarif_per_km)) || Number(tarif_per_km) <= 0) {
        showToast('Tarif per KM harus diisi angka positif.', 'error');
        if (tarifEl) try { tarifEl.focus(); } catch (_) { }
        return;
      }
      var btn = document.getElementById('btnSaveTransportConfig');
      if (btn && btn.dataset.busy === 'true') return;
      var restore = (typeof _busyButton === 'function') ? _busyButton(btn, 'Menyimpan...') : function () {
        if (btn) { btn.disabled = true; btn.dataset._oldHTML = btn.innerHTML; btn.innerHTML = 'Menyimpan...'; }
        return function () { if (btn) { btn.disabled = false; if (btn.dataset._oldHTML) { btn.innerHTML = btn.dataset._oldHTML; delete btn.dataset._oldHTML; } } };
      }();
      const payload = {
        tarif_per_km: Number(tarif_per_km),
        transport_allowance_enabled: enabled
      };
      google.script.run.withSuccessHandler((res) => {
        restore();
        if (res && res.status === 'success') {
          showToast('Konfigurasi transportasi disimpan', 'success');
          globalConfig.tarif_per_km = payload.tarif_per_km;
          globalConfig.transport_allowance_enabled = payload.transport_allowance_enabled;
        } else {
          showToast((res && res.message) || 'Gagal menyimpan konfigurasi.', 'error');
        }
      }).withFailureHandler((err) => {
        restore();
        showToast('Koneksi gagal: ' + (err && err.message ? err.message : err), 'error');
      }).saveTransportConfig(token, payload);
    }
    function populateGlobalClassSelects() {
      const level = globalConfig.tingkatan || 'SMP';
      const useParallel = globalConfig.use_parallel === 'true';
      const parallelMax = globalConfig.parallel_max || 'A';
      let baseClasses = [];
      if (level === 'SD') baseClasses = [1, 2, 3, 4, 5, 6];
      else if (level === 'SMA' || level === 'SMK') baseClasses = [10, 11, 12];
      else baseClasses = [7, 8, 9];
      let finalClasses = [];
      if (useParallel) {
        const alphabet = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K'];
        const maxIndex = alphabet.indexOf(parallelMax);
        baseClasses.forEach(c => {
          for (let i = 0; i <= maxIndex; i++) {
            finalClasses.push(`${c}${alphabet[i]}`);
          }
        });
      } else {
        finalClasses = baseClasses;
      }
      const targetIds = ['filterClass', 'inpSchedClass'];
      targetIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          const currentVal = el.value;
          let html = '<option value="">Pilih Kelas...</option>';
          finalClasses.forEach(c => {
            html += `<option value="${c}">${c}</option>`;
          });
          el.innerHTML = html;
          if (currentVal) el.value = currentVal;
        }
      });
    }
    function renderHolidaysList(holidays) {
      const tbody = document.getElementById('tbodyHolidays');
      if (!tbody) return;
      tbody.innerHTML = '';
      if (!holidays || holidays.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-6 text-slate-400 text-sm italic">Belum ada data libur</td></tr>';
        return;
      }
      let today = new Date();
      let tzOffset = 7 * 60 * 60 * 1000;
      let localToday = new Date(today.getTime() + tzOffset);
      let todayStr = localToday.toISOString().split('T')[0];
      holidays.forEach(h => {
        let isPast = h.date < todayStr;
        let dateStr = formatDateID(h.date);
        let descSafe = escapeHtml(h.desc || h.description || '');
        let safeIdJs = String(h.id || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        let safeDescJs = String(h.desc || h.description || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        let tr = document.createElement('tr');
        tr.className = "border-b hover:bg-slate-50 transition-colors";
        let actionsHtml = '';
        if (isPast) {
          actionsHtml = `<span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider bg-slate-100 px-2 py-1 rounded-md">Terkunci</span>`;
        } else {
          actionsHtml = `
            ${actionBtn('edit', `editHolidayAction('${safeIdJs}', '${h.date}', '${safeDescJs}', '${h.is_holiday}')`, 'Edit Hari Libur')}
            ${actionBtn('delete', `deleteHoliday('${safeIdJs}', this)`, 'Hapus Hari Libur')}
          `;
        }
        tr.innerHTML = `
              <td class="py-3 px-4 text-slate-700 text-sm" data-label="Tanggal"><span class="settings-mobile-value">${escapeHtml(dateStr)}</span></td>
              <td class="py-3 px-4 text-slate-600 text-sm" data-label="Keterangan"><span class="settings-mobile-value">${descSafe}</span></td>
              <td class="py-3 px-4 text-center" data-label="Hari Libur">
                ${h.is_holiday
            ? '<span class="inline-flex items-center gap-1 bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-semibold px-2.5 py-1 rounded-full">Ya</span>'
            : '<span class="inline-flex items-center gap-1 bg-slate-100 text-slate-500 border border-slate-200 text-xs font-medium px-2.5 py-1 rounded-full">Tidak</span>'}
              </td>
              <td class="py-3 px-4 text-center settings-cell-actions">
                ${actionsHtml}
              </td>`;
        tbody.appendChild(tr);
      });
    }
    function editHolidayAction(id, date, desc, isHoliday) {
      document.getElementById('inpLiburId').value = id;
      document.getElementById('inpLiburDate').value = date;
      document.getElementById('inpLiburDesc').value = desc;
      document.getElementById('chkIsBonus').checked = (isHoliday === 'true' || isHoliday === true);
      if(typeof setLiburMode === 'function') setLiburMode('single');
      document.getElementById('btnAddHoliday').innerText = 'Simpan Edit';
      document.getElementById('btnCancelLibur').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function deleteHoliday(id, btnEl) {
      showConfirm('Hapus Libur', 'Hapus data hari libur ini?', () => {
        const token = localStorage.getItem('auth_token');
        var restoreBtn = (typeof _busyButton === 'function') ? _busyButton(btnEl, '') : function () { };
        var restoreRow = (typeof _setRowLoading === 'function') ? _setRowLoading(btnEl) : function () { };
        google.script.run.withSuccessHandler((res) => {
          if (res && res.status === 'success') {
            showToast('Hari libur dihapus.', 'success');
            initSettings();
          } else {
            restoreBtn(); restoreRow();
            showToast((res && res.message) || 'Gagal menghapus.', 'error');
          }
        }).withFailureHandler((err) => {
          restoreBtn(); restoreRow();
          showToast('Koneksi gagal: ' + (err && err.message ? err.message : err), 'error');
        }).deleteHoliday(token, id);
      });
    }
    function resetLiburForm() {
      document.getElementById('inpLiburId').value = '';
      document.getElementById('inpLiburDate').value = '';
      document.getElementById('inpLiburDesc').value = '';
      document.getElementById('chkIsBonus').checked = false;
      document.getElementById('btnAddHoliday').innerText = 'Simpan';
      document.getElementById('btnCancelLibur').classList.add('hidden');
    }
    function renderClassInputs() {
      const levelEl = document.getElementById('cfgLevel');
      const chkParallel = document.getElementById('chkUseParallel');
      const selMax = document.getElementById('selParallelMax');
      const container = document.getElementById('containerClassInputs');
      if (!container) return;
      const level = levelEl ? levelEl.value : (globalConfig.tingkatan || 'SD');
      const useParallel = chkParallel ? chkParallel.checked : (globalConfig.use_parallel === 'true');
      const parallelMax = selMax ? selMax.value : (globalConfig.parallel_max || 'A');
      if (selMax) {
        selMax.disabled = !useParallel;
        if (!useParallel) {
          selMax.classList.add('bg-slate-100', 'text-slate-400', 'cursor-not-allowed');
        } else {
          selMax.classList.remove('bg-slate-100', 'text-slate-400', 'cursor-not-allowed');
        }
      }
      let baseClasses = [];
      if (level === 'SD') baseClasses = [1, 2, 3, 4, 5, 6];
      else if (level === 'SMA' || level === 'SMK') baseClasses = [10, 11, 12];
      else baseClasses = [7, 8, 9];
      const alphabet = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K'];
      let generatedClasses = [];
      if (useParallel) {
        const maxIndex = alphabet.indexOf(parallelMax);
        baseClasses.forEach(c => {
          for (let i = 0; i <= maxIndex; i++) {
            generatedClasses.push(`${c}${alphabet[i]}`);
          }
        });
      } else {
        generatedClasses = baseClasses;
      }
      let html = '';
      generatedClasses.forEach(c => {
        const key = `std_kelas_${c}`;
        const val = globalConfig[key] || 32;
        html += `
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Kelas ${c}</label>
          <input type="number" id="inpStd_${c}" class="w-full px-2 py-1.5 border rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none" value="${val}">
        </div>`;
      });
      container.innerHTML = html;
    }
    function renderSubjectsList(subjects) {
      const tbody = document.getElementById('tbodySubjects');
      if (!tbody) return;
      if (!subjects || subjects.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-6 text-slate-400 italic text-sm settings-cell-empty">Belum ada mata pelajaran.</td></tr>';
        return;
      }
      let html = '';
      subjects.forEach(s => {
        var safeId = String(s.id || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        var safeName = String(s.name || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        var dispName = escapeHtml(s.name || '-');
        html += `
        <tr class="border-b hover:bg-slate-50 transition-colors group">
          <td class="px-4 py-3 font-medium text-slate-700" data-label="Mapel"><span class="settings-mobile-value">${dispName}</span></td>
          <td class="px-4 py-3 settings-cell-actions">
            <div class="flex items-center justify-end gap-1.5">
              ${actionBtn('edit', `openSubjectModal('${safeId}', '${safeName}')`, 'Edit Mapel')}
              ${actionBtn('delete', `deleteSubjectAction('${safeId}', this)`, 'Hapus Mapel')}
            </div>
          </td>
        </tr>`;
      });
      tbody.innerHTML = html;
    }
    function renderAllowancesList(allowances) {
      const tbody = document.getElementById('tbodyAllowances');
      if (!tbody) return;
      if (!allowances || allowances.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-6 text-slate-400 italic text-sm settings-cell-empty">Belum ada data tunjangan.</td></tr>';
        return;
      }
      let html = '';
      allowances.forEach((a, idx) => {
        var safeId = String(a.id || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        var safeDuty = String(a.name || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        var safeUserId = String(a.user_id || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        var safeAmount = Number(a.amount || 0);
        var dispName = escapeHtml(a.name || '-');
        var dispGuru = escapeHtml(a.guru_name || 'Unknown');
        const formattedAmount = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(a.amount);
        html += `<tr class="border-b hover:bg-slate-50 transition-colors">
          <td class="px-4 py-3 text-center text-slate-500 text-sm" data-label="No."><span class="settings-mobile-value">${idx + 1}</span></td>
          <td class="px-4 py-3 font-semibold text-slate-700 text-sm" data-label="Jenis Tunjangan"><span class="settings-mobile-value">${dispName}</span></td>
          <td class="px-4 py-3 text-slate-600 text-sm" data-label="Penerima"><span class="settings-mobile-value">${dispGuru}</span></td>
          <td class="px-4 py-3 text-right font-bold text-emerald-600 text-sm" data-label="Nominal"><span class="settings-mobile-value">${formattedAmount}</span></td>
          <td class="px-4 py-3 text-center settings-cell-actions">
            <div class="flex items-center justify-center gap-1.5">
              ${actionBtn('edit', `editAllowanceAction('${safeId}', '${safeDuty}', '${safeUserId}', ${safeAmount})`, 'Edit Tunjangan')}
              ${actionBtn('delete', `deleteAllowanceAction('${safeId}', this)`, 'Hapus Tunjangan')}
            </div>
          </td>
       </tr>`;
      });
      tbody.innerHTML = html;
    }
    function updateSidebarVisibility() {
      const role = localStorage.getItem('user_role');
      const adminSection = document.getElementById('admin-section');
      const guruSection  = document.getElementById('guru-section');
      const navExamPanitia = document.getElementById('nav-Page_ExamPanitia');
      if (String(role).toLowerCase() === 'admin') {
        if (adminSection) adminSection.classList.remove('hidden');
        if (guruSection)  guruSection.classList.add('hidden');
        if (navExamPanitia) navExamPanitia.classList.add('hidden');
      } else {
        if (adminSection) adminSection.classList.add('hidden');
        if (guruSection)  guruSection.classList.remove('hidden');
        if (navExamPanitia) {
          if (typeof checkExamPanitiaAccess === 'function') checkExamPanitiaAccess();
        }
      }
      if (typeof _wireEventNavItems === 'function') _wireEventNavItems();
    }
    function checkExamPanitiaAccess() {
      var navItem = document.getElementById('nav-Page_ExamPanitia');
      if (!navItem) return;
      var token = localStorage.getItem('auth_token');
      if (!token) { navItem.classList.add('hidden'); return; }
      try {
        var cached = sessionStorage.getItem('_examPanitiaAccess');
        if (cached) {
          var obj = JSON.parse(cached);
          if (obj && obj._ts && (Date.now() - obj._ts) < 60000) {
            _applyExamPanitiaNavVisibility(!!obj.show, !!obj.hasUnconfirmed);
            return;
          }
        }
      } catch (_) { }
      google.script.run
        .withSuccessHandler(function (res) {
          var show = !!(res && res.is_exam_period && res.is_confirmed_panitia);
          var hasUnconfirmed = false;
          if (show && Array.isArray(res.supervisors_to_confirm)) {
            res.supervisors_to_confirm.forEach(function (entry) {
              if (!entry) return;
              (entry.supervisors || []).forEach(function (sup) {
                if (!sup || !sup.status) return;
                if (sup.status === 'cancelled') return;
                if (!sup.confirmed_by || !String(sup.confirmed_by).trim()) hasUnconfirmed = true;
              });
            });
          }
          try {
            sessionStorage.setItem('_examPanitiaAccess', JSON.stringify({
              _ts: Date.now(), show: show, hasUnconfirmed: hasUnconfirmed
            }));
          } catch (_) { }
          _applyExamPanitiaNavVisibility(show, hasUnconfirmed);
        })
        .withFailureHandler(function () {
          navItem.classList.add('hidden');
        })
        .getExamPageData(token);
    }
    function _applyExamPanitiaNavVisibility(show, hasUnconfirmed) {
      var navItem = document.getElementById('nav-Page_ExamPanitia');
      var dot = document.getElementById('badgeExamPanitiaNotification');
      if (!navItem) return;
      if (show) navItem.classList.remove('hidden');
      else navItem.classList.add('hidden');
      if (dot) {
        if (show && hasUnconfirmed) dot.classList.remove('hidden');
        else dot.classList.add('hidden');
      }
    }
    function updateNavbarUser() {
      const name = String(localStorage.getItem('user_name') || '').trim() || 'Pengguna';
      const role = String(localStorage.getItem('user_role') || '').trim() || 'User';
      const initial = (name.charAt(0) || 'U').toUpperCase();
      const elName = document.getElementById('navUserName');
      const elRole = document.getElementById('navUserRole');
      const elInit = document.getElementById('navUserInitial');
      if (elName) elName.innerText = name;
      if (elRole) elRole.innerText = role;
      if (elInit) elInit.innerText = initial;
      const elSbName = document.getElementById('sidebarUserName');
      const elSbRole = document.getElementById('sidebarUserRole');
      const elSbInit = document.getElementById('sidebarUserInitial');
      if (elSbName) elSbName.innerText = name;
      if (elSbRole) elSbRole.innerText = role;
      if (elSbInit) elSbInit.innerText = initial;
    }
    function filterSidebarMenu(query) {
      const q = String(query || '').toLowerCase().trim();
      const items = document.querySelectorAll('#sidebarMenuContainer .nav-item');
      let visibleCount = 0;
      items.forEach(function (it) {
        if (it.classList.contains('hidden')) return;
        const tooltip = (it.getAttribute('data-tooltip') || '').toLowerCase();
        const search = (it.getAttribute('data-search') || '').toLowerCase();
        const match = !q || tooltip.indexOf(q) >= 0 || search.indexOf(q) >= 0;
        if (match) {
          it.classList.remove('is-search-hidden');
          visibleCount++;
        } else {
          it.classList.add('is-search-hidden');
        }
      });
      var allBodies = document.querySelectorAll('#sidebarMenuContainer .nav-accordion-body');
      if (q) {
        allBodies.forEach(function(b) { b.classList.add('is-open'); });
        var nestedBodiesQ = document.querySelectorAll('#sidebarMenuContainer .nav-nested-body');
        nestedBodiesQ.forEach(function(b) { b.classList.add('is-open'); });
        var nestedHeadersQ = document.querySelectorAll('#sidebarMenuContainer .nav-nested-header');
        nestedHeadersQ.forEach(function(h) { h.classList.add('is-open'); h.setAttribute('aria-expanded','true'); });
      } else {
        allBodies.forEach(function(b) { b.classList.remove('is-open'); });
        var nestedBodies = document.querySelectorAll('#sidebarMenuContainer .nav-nested-body');
        nestedBodies.forEach(function(b) { b.classList.remove('is-open'); });
        var nestedHeaders = document.querySelectorAll('#sidebarMenuContainer .nav-nested-header');
        nestedHeaders.forEach(function(h) { h.classList.remove('is-open'); h.setAttribute('aria-expanded','false'); });
        var curPage = window.currentPageState;
        if (curPage && typeof openAccordionForPage === 'function') {
          var statePageMap = { dashboard:'Page_Dashboard', schedule:'Page_MySchedule', journal:'Page_Journal',
            attendance:'Page_Attendance', picket:'Page_Picket', recap:'Page_Honorarium',
            'honorarium-history':'Page_HonorariumHistory', 'my-attendance':'Page_MyAttendance',
            users:'Page_Users', 'manage-schedule':'Page_ManageSchedule', exam:'Page_ExamSchedule',
            'settings-config':'Page_Settings_Config', 'settings-kalender':'Page_Settings_Kalender',
            'settings-mapel':'Page_Settings_Mapel', 'settings-tunjangan':'Page_Settings_Tunjangan',
            'settings-transportasi':'Page_Settings_Transportasi', 'settings-maintenance':'Page_Settings_Maintenance',
            'settings-pengumuman':'Page_Settings_Pengumuman', 'exam-panitia':'Page_ExamPanitia', profile:'Page_Profile',
            'attendance-list':'Page_AttendanceList', 'attendance-schedule':'Page_AttendanceSchedule',
            'admin-daily-attendance':'Page_AdminDailyAttendance', 'event-attendance':'Page_EventAttendance',
            'event-journal':'Page_EventJournal', 'event-journal-history':'Page_EventJournalHistory',
            'event-management':'Page_EventManagement',
            'student-attendance':'Page_StudentAttendance',
            'student-attendance-input':'Page_StudentAttendanceInput',
            'student-attendance-history':'Page_StudentAttendanceHistory' };
          for (var k in statePageMap) { if (k === curPage) { openAccordionForPage(statePageMap[k]); break; } }
        }
      }
      const labels = document.querySelectorAll('#sidebarMenuContainer .nav-section-label');
      labels.forEach(function (lbl) {
        let next = lbl.nextElementSibling;
        let anyVisible = false;
        while (next && !next.classList.contains('nav-section-label')) {
          if (next.classList && next.classList.contains('nav-item')) {
            if (!next.classList.contains('hidden') && !next.classList.contains('is-search-hidden')) {
              anyVisible = true; break;
            }
          }
          if (next.id === 'admin-section') {

        var diff = total - stdVal;

          isValid = true;
        } else if (diff > 0) {
          // Melebihi standar — merah
          if (display) { display.style.background = '#FFF1F2'; display.style.borderColor = '#FCA5A5'; }
          if (totEl)   totEl.style.color = '#DC2626';
          if (badge) {
            badge.className = 'text-[11px] font-semibold px-2 py-0.5 rounded-full bg-red-100 text-red-700';
            badge.innerText = 'Standar: ' + stdVal;
            badge.classList.remove('hidden');

          if (hint) { hint.innerText = 'Melebihi standar ' + diff + ' siswa (standar: ' + stdVal + ')'; hint.style.color = '#DC2626'; hint.classList.remove('hidden'); }
          isValid = false;
        } else {
          // Kurang dari standar — oranye
          if (display) { display.style.background = '#FFFBEB'; display.style.borderColor = '#FCD34D'; }
          if (totEl)   totEl.style.color = '#B45309';

          isValid = false;
        }
      } else {
        // Tidak ada standar — tampilan netral
        if (display) { display.style.background = ''; display.style.borderColor = ''; }
        if (totEl)   totEl.style.color = '';

      var className = (document.getElementById('saInpClassName') || {}).value || '';
      if (!className) return showToast('Nama kelas tidak valid.', 'error');
      var hadir = parseInt((document.getElementById('saInpHadir') || {}).value || '0', 10) || 0;
      var sakit = parseInt((document.getElementById('saInpSakit') || {}).value || '0', 10) || 0;
      var izin  = parseInt((document.getElementById('saInpIzin')  || {}).value || '0', 10) || 0;
      var alpa  = parseInt((document.getElementById('saInpAlpa')  || {}).value || '0', 10) || 0;
      if ((hadir + sakit + izin + alpa) === 0) {
        return showToast('Total siswa tidak boleh nol. Harap isi setidaknya satu nilai.', 'error');
      }
      var btn = document.getElementById('btnSaveStudentAttendance');
      if (btn) { btn.disabled = true; btn.innerText = 'Menyimpan...'; }
      var token = localStorage.getItem('auth_token');
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            closeStudentAttendanceModal();
            showToast('Rekap absensi kelas ' + className + ' berhasil disimpan.', 'success');
            initStudentAttendance();
          } else {

          updateSaTotal(); // restore disabled state sesuai validasi standar

    function initStudentAttendanceHistory() {
      var now = new Date();
      var monthSel = document.getElementById('saHistMonthFilter');
      var yearSel  = document.getElementById('saHistYearFilter');
      if (monthSel) monthSel.value = String(now.getMonth() + 1);
      if (yearSel) {
        yearSel.innerHTML = '';
        var curYear = now.getFullYear();
        for (var y = curYear; y >= curYear - 3; y--) {
          var opt = document.createElement('option');
          opt.value = y;
          opt.textContent = y;
          if (y === curYear) opt.selected = true;
          yearSel.appendChild(opt);
        }
      }
      loadStudentAttendanceHistory();
    }

    function _doInitPicket(token) {
      const lblDate = document.getElementById('lblPicketTodayDate');
      if (lblDate) lblDate.innerText = formatDateID(new Date());

      _subModalContext = null;

      if (tbodyStatusAdmin) tbodyStatusAdmin.innerHTML = skeletonTableRows(5, 4);
      if (tbodyStatusPicket) tbodyStatusPicket.innerHTML = skeletonTableRows(5, 4);
      google.script.run.withSuccessHandler((res) => {
        if (!res || res.status === 'error' || res.status === 'denied') {
          showToast((res && res.message) || 'Gagal memuat data piket.', 'error');
          if (res && res.message && (res.message.indexOf('Unauthorized') !== -1 || res.message.indexOf('Akses Ditolak') !== -1)) {
            handleNav('Page_Dashboard');
          }
          return;
        }
        _picketCache = res;
        if (!res.is_admin && !res.is_picket_today) {
          showToast("Akses Ditolak: Anda tidak memiliki jadwal piket hari ini.", "error");
          handleNav('Page_Dashboard');
          return;
        }
        const viewAdmin = document.getElementById('viewAdminPicket');
        const viewGuru = document.getElementById('viewTeacherPicket');
        const sub = document.getElementById('pktHeroSubtitle');
        if (sub) sub.innerText = res.is_admin
          ? 'Pemantauan & manajemen tugas piket dan upacara'
          : 'Tugas piket Anda hari ini';
        _renderPicketHeaderStats(res);
        if (res.is_admin) {
          if (viewAdmin) viewAdmin.classList.remove('hidden');
          if (viewGuru) viewGuru.classList.add('hidden');
          renderPicketSchedule(res.picket_schedule);
          renderTodayPickets(res.today_pickets);
          renderCeremonyAdmin(res.ceremony_info);
          renderDailyScheduleStatus(res.daily_schedules, true);
          renderAdminPicketSubstitutes(res.today_picket_subs || [], res.today_pickets || []);
          _refreshPicketAndCeremonySelects();
          setTimeout(loadActiveSubstitutes, 100);
          _restoreAdminPicketTab();
        } else {
          if (viewAdmin) viewAdmin.classList.add('hidden');
          if (viewGuru) viewGuru.classList.remove('hidden');
          const myPicketStatus = (res.today_pickets || []).find(p => String(p.user_id) === String(res.current_user_id));
          const amIPicketToday = !!res.is_picket_today;
          const mySubPicketStatus = (res.today_picket_subs || []).find(s => String(s.user_id) === String(res.current_user_id));
          let isPicketConfirmed = false;
          if (myPicketStatus) {
            isPicketConfirmed = !!myPicketStatus.is_present;
          } else if (mySubPicketStatus) {
            isPicketConfirmed = !!mySubPicketStatus.is_confirmed;
          } else if (amIPicketToday) {
            // Guru penerima relokasi JTM piket (PARTIAL-SUB-PIKET):
            // is_picket_today = true tapi tidak ada di today_pickets maupun today_picket_subs.
            // Mereka sudah mendapat JTM → dianggap sudah terkonfirmasi agar tombol aksi aktif.
            isPicketConfirmed = true;
          }
          const needsConfirmation = amIPicketToday && !isPicketConfirmed;
          window.picketNeedsConfirmation = needsConfirmation;
          const alertBox = document.getElementById('alertPicketUnconfirmed');
          if (alertBox) alertBox.classList.toggle('hidden', !needsConfirmation);
          if (typeof renderCeremonyPicket === "function") {
            renderCeremonyPicket(res.ceremony_info, res.current_user_id);
          }
          renderDailyScheduleStatus(res.daily_schedules, isPicketConfirmed);
          loadActiveSubstitutesForPicketTeacher();
          loadExamPanitiaPanel();
          const subPicketCard = document.getElementById('cardGuruSubPicketActive');
          const subPicketList = document.getElementById('listGuruSubPicket');
          const todaySubs = res.today_picket_subs || [];
          if (subPicketCard && subPicketList) {
            if (todaySubs.length > 0) {
              subPicketCard.classList.remove('hidden');
              let subHtml = '';
              todaySubs.forEach(s => {
                const initial = (s.name || '?').charAt(0).toUpperCase();
                const safeName = escapeHtml(s.name || '-');
                const safeOrigName = escapeHtml(s.original_name || '-');
                const isConf = !!s.is_confirmed;
                subHtml += `<div class="flex items-center justify-between p-3 bg-white rounded-xl border border-amber-200 shadow-sm gap-3 flex-wrap">
                  <div class="flex items-center gap-2 min-w-0">
                    <div class="w-8 h-8 rounded-full bg-amber-200 flex items-center justify-center text-xs font-bold text-amber-700 flex-shrink-0">${escapeHtml(initial)}</div>
                    <div class="min-w-0">
                      <p class="font-bold text-slate-800 text-sm truncate">${safeName}</p>
                      <p class="text-xs text-slate-500 truncate">Menggantikan: <span class="font-medium">${safeOrigName}</span></p>
                    </div>
                  </div>
                  <span class="inline-flex items-center gap-1 ${isConf ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-amber-50 text-amber-700 border-amber-200'} border px-2.5 py-1 rounded-full text-xs font-bold flex-shrink-0">
                    <span class="w-1.5 h-1.5 rounded-full ${isConf ? 'bg-emerald-500' : 'bg-amber-500'} inline-block"></span>${isConf ? 'Hadir' : 'Aktif'}
                  </span>
                </div>`;
              });
              subPicketList.innerHTML = subHtml;
            } else {
              subPicketCard.classList.add('hidden');
            }
          }
        }
      }).withFailureHandler((err) => {
        if (tbodyStatusAdmin) tbodyStatusAdmin.innerHTML = errorTableRows(5, 'Koneksi gagal: ' + err, 'initPicket()');
        if (tbodyStatusPicket) tbodyStatusPicket.innerHTML = errorTableRows(5, 'Koneksi gagal: ' + err, 'initPicket()');
        showToast('Gagal memuat halaman piket: ' + err, 'error');
      }).getPicketPageData(token);
      setTimeout(_fixMobileLayouts, 300);
    }

    function _renderPicketHeaderStats(res) {
      const set = (id, v) => { const el = document.getElementById(id); if (el) el.innerText = v; };
      if (!res) return;
      const todayPickets = res.today_pickets || [];
      const todayPicketSubs = res.today_picket_subs || [];
      const subsCount = (res.daily_schedules || []).filter(s => s.substitute_info && s.substitute_info.name).length;
      const dailySched = res.daily_schedules || [];
      const piketHadir = todayPickets.filter(p => p.is_present).length
        + todayPicketSubs.filter(s => s.is_confirmed).length;
      const piketTotal = todayPickets.length + todayPicketSubs.length;
      const kbmHadir = dailySched.filter(s => s.is_present || (s.substitute_info && s.substitute_info.name)).length;
      const kbmTotal = dailySched.length;
      set('pktStatPiketHadir', piketTotal === 0 ? '—' : (piketHadir + ' / ' + piketTotal));
      set('pktStatSubActive', String(subsCount + todayPicketSubs.length));
      set('pktStatKbm', kbmTotal === 0 ? '—' : (kbmHadir + ' / ' + kbmTotal));
      const ci = res.ceremony_info || {};
      if (!ci.is_ceremony_day) {
        set('pktStatCeremony', '—');
      } else if (!ci.data) {
        set('pktStatCeremony', 'Kosong');
      } else {
        set('pktStatCeremony', ci.data.is_confirmed ? '✓' : 'Pending');
      }
      const subBadge = document.getElementById('badgeAdminPicketTab2');
      if (subBadge) {
        const total = subsCount + todayPicketSubs.length;
        if (total > 0) {
          subBadge.innerText = String(total);
          subBadge.classList.remove('hidden');
        } else {
          subBadge.classList.add('hidden');
        }
      }
    }
