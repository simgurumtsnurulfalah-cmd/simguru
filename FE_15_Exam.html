    // Tunjuk guru pengganti piket
    function apmDoTunjukPengganti() {
      if (_apmInFlight) return;
      if (!_apmContext) return;
      const item  = _apmContext.item;
      const sel   = document.getElementById('apmSubstSelect');
      const token = localStorage.getItem('auth_token');
      if (!sel || !sel.value) {
        showToast('Pilih guru pengganti terlebih dahulu.', 'warning');
        if (sel) { sel.focus(); sel.style.borderColor = '#F59E0B'; setTimeout(function(){ sel.style.borderColor = ''; }, 2000); }
        return;
      }
      const substId   = sel.value;
      const substName = sel.options[sel.selectedIndex].text;

      _apmInFlight = true;
      const btn = document.getElementById('apmBtnTunjukPengganti');
      if (btn) { btn.disabled = true; btn.innerHTML = '<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg> Menunjuk...'; }

      google.script.run
        .withSuccessHandler(function(res) {
          _apmInFlight = false;
          if (btn) btn.disabled = false;
          if (res && res.status === 'success') {
            showToast(escapeHtml(substName) + ' berhasil ditunjuk sebagai piket pengganti.', 'success');
            // Update _apmContext dengan data pengganti baru agar Section ③ bisa langsung dipakai
            if (_apmContext && _apmContext.item) {
              _apmContext.item.substitute = {
                user_id:      substId,
                name:         substName,
                is_confirmed: false,
                time_in:      null,
                time_out:     null,
                att_id:       null,
              };
            }
            // Perbarui tampilan modal secara in-place (tanpa tutup modal)
            // sehingga admin bisa langsung input jam pengganti
            _apmRefreshModalAfterSubstitute();
            // Reload panel dashboard di background
            loadAdminDashboardPicket();
          } else if (res && res.collision) {
            // Pengganti sudah ada — tanya apakah ingin mengganti
            showToast((res.message || 'Sudah ada guru pengganti.') + ' Batalkan dulu lewat halaman Piket.', 'warning', 6000);
            if (btn) btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg> Tunjuk Sebagai Pengganti';
          } else {
            showToast((res && res.message) || 'Gagal menunjuk pengganti.', 'error');
            if (btn) btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg> Tunjuk Sebagai Pengganti';
          }
        })
        .withFailureHandler(function(err) {
          _apmInFlight = false;
          if (btn) { btn.disabled = false; btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg> Tunjuk Sebagai Pengganti'; }

     * Memperbarui tampilan modal manajemen piket secara in-place setelah
     * guru pengganti berhasil ditunjuk, tanpa menutup modal.
     * Menggunakan data dari _apmContext.item.substitute yang sudah diperbarui.

    function _apmRefreshModalAfterSubstitute() {
      if (!_apmContext || !_apmContext.item) return;
      const item = _apmContext.item;
      const sub  = item.substitute;
      if (!sub) return;

      // --- Perbarui header subtitle ---
      const subtitle = document.getElementById('apmModalSubtitle');
      if (subtitle) subtitle.innerText = 'Piket asli + pengganti aktif';

      // --- Perbarui info guru aktif (pengganti yang baru ditunjuk) ---
      const avatar    = document.getElementById('apmGuruAvatar');
      const nameEl    = document.getElementById('apmGuruName');
      const roleBadge = document.getElementById('apmRoleBadge');
      const confDot   = document.getElementById('apmConfirmDot');
      const confText  = document.getElementById('apmConfirmText');
      const confBadge = document.getElementById('apmConfirmBadge');

      const initial = (sub.name || '?').charAt(0).toUpperCase();
      if (avatar) {
        avatar.innerText = initial;
        avatar.style.cssText = 'background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE;';
      }
      if (nameEl) nameEl.innerText = sub.name || '—';
      if (roleBadge) {
        roleBadge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-indigo-500 inline-block"></span>Guru Piket Pengganti';
        roleBadge.style.cssText = 'background:#EEF2FF;color:#4338CA;border-color:#C7D2FE;';
      }
      if (confDot) confDot.style.background = '#F59E0B';
      if (confText) confText.innerText = 'Belum Dikonfirmasi';
      if (confBadge) confBadge.style.cssText = 'background:#FEF3C7;color:#92400E;border-color:#FCD34D;';

      // --- Perbarui Section ① Konfirmasi: tampilkan tombol konfirmasi ---
      const btnKonfirmasi      = document.getElementById('apmBtnKonfirmasi');
      const btnBatalKonfirmasi = document.getElementById('apmBtnBatalKonfirmasi');
      if (btnKonfirmasi) btnKonfirmasi.classList.remove('hidden');
      if (btnBatalKonfirmasi) {
        btnBatalKonfirmasi.classList.add('hidden');
        btnBatalKonfirmasi.classList.remove('flex');
      }

      // --- Perbarui Section ② Pengganti: ganti form dropdown ke info pengganti ---
      const substInfo = document.getElementById('apmSubstInfo');
      const substForm = document.getElementById('apmSubstForm');
      const substName = document.getElementById('apmSubstName');
      const substAvat = document.getElementById('apmSubstAvatar');
      const substConf = document.getElementById('apmSubstConfirmBadge');
      // Hapus note disable jika masih ada
      const staleNote = document.getElementById('apmSubstDisabledNote');
      if (staleNote) staleNote.remove();

      if (substInfo) substInfo.classList.remove('hidden');
      if (substForm) substForm.classList.add('hidden');
      if (substName) substName.innerText = sub.name || '—';
      if (substAvat) substAvat.innerText = initial;
      if (substConf) {
        substConf.innerText = '⏳ Belum Konfirmasi';
        substConf.style.cssText = 'background:#FEF3C7;color:#92400E;border-color:#FCD34D;';
      }

      // --- Perbarui Section ③ Jam: sembunyikan jam asli, tampilkan input jam pengganti (kosong) ---
      const jamOrigSection  = document.getElementById('apmJamOrigSection');
      const jamSubstSection = document.getElementById('apmJamSubstSection');
      const jamSubstLabel   = document.getElementById('apmJamSubstLabel');
      const tInSubst        = document.getElementById('apmTimeInSubst');
      const tOutSubst       = document.getElementById('apmTimeOutSubst');

      if (jamOrigSection)  jamOrigSection.classList.add('hidden');
      if (jamSubstLabel) jamSubstLabel.innerText = sub.name || 'Guru Piket Pengganti';
      if (tInSubst)  tInSubst.value  = '';
      if (tOutSubst) tOutSubst.value = '';
      if (jamSubstSection) {
        jamSubstSection.classList.remove('hidden');
        // Scroll ke section jam agar admin langsung melihat input yang perlu diisi
        setTimeout(function() {
          jamSubstSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 150);
      }
    }

    /**
     * Update tampilan satu item jadwal di kartu "Status Jurnal Hari Ini"
     * menjadi status "Selesai" tanpa me-reload seluruh kartu.
     * Dipanggil setelah submitJournal berhasil.

     * @param {string} scheduleId - ID jadwal yang baru saja diisi jurnalnya
     */
    function _markScheduleItemDone(scheduleId) {
      if (!scheduleId) return;
      const container = document.getElementById('guruJurnalProgressContainer');
      if (!container) return;
      const item = container.querySelector('[data-sched-id="' + CSS.escape(String(scheduleId)) + '"]');
      if (!item) return;
      item.classList.remove('bg-slate-50', 'border-slate-200', 'bg-indigo-50', 'border-indigo-200');
      item.classList.add('bg-emerald-50', 'border-emerald-200');
      const avatar = item.querySelector('div.w-7');
      if (avatar) {
        avatar.classList.remove(
          'bg-slate-200', 'text-slate-500',
          'bg-indigo-200', 'text-indigo-600'
        );
        avatar.classList.add('bg-emerald-200', 'text-emerald-700');
        avatar.textContent = '✓';
      }
      const badge = item.querySelector('span.flex-shrink-0:last-child');
      if (badge) {
        badge.classList.remove('bg-amber-100', 'text-amber-700');
        badge.classList.add('bg-emerald-100', 'text-emerald-700');
        badge.textContent = 'Selesai';
      }
      const allItems = container.querySelectorAll('[data-sched-id]');
      const doneItems = container.querySelectorAll(
        '[data-sched-id] span.bg-emerald-100.text-emerald-700:last-child,' +
        '[data-sched-id] span.text-emerald-700.flex-shrink-0'
      );
      let total = 0, done = 0;
      allItems.forEach(function (el) {
        const statusBadge = el.querySelector('span.flex-shrink-0:last-child');
        if (!statusBadge) return;
        const txt = statusBadge.textContent.trim();
        if (txt === 'Digantikan') return;
        total++;
        if (txt === 'Selesai') done++;
      });
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;
      const counterEl = container.querySelector('.flex.justify-between.text-xs span:first-child');
      if (counterEl) counterEl.textContent = done + ' dari ' + total + ' jurnal terisi';
      const pctEl = container.querySelector('.flex.justify-between.text-xs span:last-child');
      if (pctEl) {
        pctEl.textContent = pct + '%';
        pctEl.className = 'font-bold ' + (pct === 100 ? 'text-emerald-600' : 'text-blue-600');
      }
      const barEl = container.querySelector('.bg-slate-100 > div');
      if (barEl) {
        barEl.style.width = pct + '%';
        barEl.className = 'h-2.5 rounded-full transition-all duration-700 ' +
          (pct === 100
            ? 'bg-gradient-to-r from-emerald-400 to-emerald-600'
            : 'bg-gradient-to-r from-blue-400 to-blue-600');
      }
      const badgeEl = document.getElementById('guruJurnalBadge');
      if (badgeEl) {
        badgeEl.innerText = done + '/' + total + ' selesai';
        badgeEl.style.cssText = done === total
          ? 'background:#ECFDF5;color:#047857;border:1px solid #A7F3D0;'
          : 'background:#EFF6FF;color:#2563EB;border:1px solid #BFDBFE;';
      }
    }

      window._examSessionPreviewDuration = function () {
        var startEl = document.getElementById('inpExamSessionStart');
        var endEl = document.getElementById('inpExamSessionEnd');
        var box = document.getElementById('examSessionDurationPreview');
        var text = document.getElementById('examSessionDurationText');
        if (!startEl || !endEl || !box || !text) return;
        var s = startEl.value, e = endEl.value;
        if (!s || !e) {
          box.classList.add('hidden');
          return;
        }
        var sp = s.split(':'), ep = e.split(':');
        var sm = (parseInt(sp[0]) || 0) * 60 + (parseInt(sp[1]) || 0);
        var em = (parseInt(ep[0]) || 0) * 60 + (parseInt(ep[1]) || 0);
        if (em <= sm) {
          text.textContent = '⚠️ Jam selesai harus setelah jam mulai';
          box.classList.remove('hidden');
          box.classList.remove('bg-emerald-50', 'border-emerald-100');

          text.classList.remove('text-emerald-700');
          text.classList.add('text-rose-700');
          return;
        }
        var diff = em - sm;
        var hh = Math.floor(diff / 60);
        var mm = diff % 60;
        var label = '';
        if (hh > 0) label += hh + ' jam';
        if (mm > 0) label += (label ? ' ' : '') + mm + ' menit';
