          const now = new Date();
          const baseOptions = [{ value: 'current', label: 'Bulan Ini (Estimasi)', finalized: false }];
          for (let i = 1; i <= 12; i++) {
            const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
            const label = monthNames[d.getMonth()] + ' ' + d.getFullYear();
            baseOptions.push({ value: label, label: label, finalized: false });
          }
          function _renderPeriodOptions(finalizedSet) {
            const seen = {};
            let html = '';
            baseOptions.forEach(function (opt) {
              if (seen[opt.value]) return;
              seen[opt.value] = true;
              const isFinal = finalizedSet && finalizedSet[opt.value];
              const display = isFinal ? (opt.label + ' ✓') : opt.label;
              html += '<option value="' + opt.value.replace(/"/g, '&quot;') + '">' + display + '</option>';

            sel.innerHTML = html;

          _renderPeriodOptions(null);
          function _applyTargetPeriode(p) {
            const vals = Array.from(sel.options).map(o => o.value);

            .withSuccessHandler(function (res) {

                const finalizedSet = {};
                res.periods.forEach(function (p) { if (p) finalizedSet[p] = true; });
                _renderPeriodOptions(finalizedSet);
              }
              if (targetPeriode) {
                _applyTargetPeriode(targetPeriode);

                sel.value = 'current';
                loadGuruSlip(token, 'current');
