    function refreshTeacherStatusTable() {
      var token = localStorage.getItem('auth_token');
      var adminTbody = document.getElementById('tbodyTeacherStatusAdmin');
      var picketTbody = document.getElementById('tbodyTeacherStatusPicket');
      var tbody = adminTbody || picketTbody;
      if (!tbody || !token) {
        console.warn('Tabel status mengajar tidak ditemukan atau token tidak tersedia');
        return;
      }
      var activeTbody = tbody;
      activeTbody.style.opacity = '0.4';
      activeTbody.style.pointerEvents = 'none';
      google.script.run
        .withSuccessHandler(function (res) {
          activeTbody.style.opacity = '1';
          activeTbody.style.pointerEvents = 'auto';
          if (res.status === 'success') {
            var isAdminView = document.getElementById('viewAdminPicket') && !document.getElementById('viewAdminPicket').classList.contains('hidden');
            var isPicketConfirmed = true;
            if (!isAdminView && res.current_user_id) {
              var isOrigPicketOk = res.today_pickets && res.today_pickets.some(function (p) {
                return String(p.user_id) === String(res.current_user_id) && p.is_present === true;
              });
              var isSubPicketOk = res.today_picket_subs && res.today_picket_subs.some(function (s) {
                return String(s.user_id) === String(res.current_user_id) && s.is_confirmed === true;
              });
              isPicketConfirmed = isOrigPicketOk || isSubPicketOk;
            }
            if (typeof renderDailyScheduleStatus === 'function') {
              renderDailyScheduleStatus(res.daily_schedules, isPicketConfirmed);
            } else {
              console.error('Fungsi renderDailyScheduleStatus tidak ditemukan');
            }
          } else {
            console.error('Gagal refresh tabel status:', res.message);
            showToast('Gagal memperbarui tabel status: ' + res.message, 'error');
          }
        })
        .withFailureHandler(function (err) {
          activeTbody.style.opacity = '1';
          activeTbody.style.pointerEvents = 'auto';
          console.error('Error refreshTeacherStatusTable:', err);
          showToast('Gagal terhubung ke server saat refresh tabel', 'error');
        })
        .getPicketPageData(token);
    }
