    function updateBapTotalIndicator() {
      var inpH = document.getElementById('inpBapHadir');

      var totalEl = document.getElementById('bapTotalCount');
      var rateEl = document.getElementById('bapAttendanceRate');
      var hadirBar = document.getElementById('bapHadirBar');
      var absenBar = document.getElementById('bapAbsenBar');
      if (!inpH || !inpA || !indicator || !totalEl) return;
      var h = parseInt(inpH.value || '0', 10) || 0;
      var a = parseInt(inpA.value || '0', 10) || 0;
      var total = h + a;
      if (total > 0) {
        indicator.classList.remove('hidden');
        totalEl.innerText = total;
        var hPct = Math.round((h / total) * 100);
        var aPct = 100 - hPct;
        if (rateEl) rateEl.textContent = hPct + '%';
        if (hadirBar) hadirBar.style.width = hPct + '%';

    function initExamPanitiaPage() {
      var token = localStorage.getItem('auth_token');
      var skel = document.getElementById('examPanitiaSkeleton');
      var panel = document.getElementById('panelExamPanitia');
      var noAccess = document.getElementById('examPanitiaNoAccess');
      var noAccessTitle = document.getElementById('examPanitiaNoAccessTitle');
      var noAccessMsg = document.getElementById('examPanitiaNoAccessMsg');
      var periodInfo = document.getElementById('examPanitiaPeriodInfo');
      var periodName = document.getElementById('examPanitiaPeriodName');
      var periodRange = document.getElementById('examPanitiaPeriodRange');
      var todayEl = document.getElementById('examPanitiaToday');
      if (skel) skel.classList.remove('hidden');
      if (panel) panel.classList.add('hidden');
      if (noAccess) noAccess.classList.add('hidden');
      if (periodInfo) periodInfo.classList.add('hidden');
      if (todayEl && typeof formatDateID === 'function') {
        try { todayEl.textContent = formatDateID(new Date()); } catch (_) { }
      }
      google.script.run
        .withSuccessHandler(function (res) {
          if (skel) skel.classList.add('hidden');
          if (!res || res.status === 'error') {
            if (noAccess) {
              if (noAccessTitle) noAccessTitle.textContent = 'Gagal Memuat Data';
              if (noAccessMsg) noAccessMsg.textContent = (res && res.message) || 'Tidak dapat memuat data ujian. Coba muat ulang.';
              noAccess.classList.remove('hidden');
            }
            return;
          }
          if (res.is_exam_period && res.period) {
            if (periodInfo) periodInfo.classList.remove('hidden');
            if (periodName) periodName.textContent = res.period.name || '—';
            if (periodRange && typeof formatDateID === 'function') {
              try {
                periodRange.textContent =
                  formatDateID(res.period.date_start) + ' — ' + formatDateID(res.period.date_end);
              } catch (_) {
                periodRange.textContent = res.period.date_start + ' — ' + res.period.date_end;
              }
            }
          }
          if (!res.is_exam_period) {
            if (noAccess) {
              if (noAccessTitle) noAccessTitle.textContent = 'Tidak Ada Periode Ujian Aktif';
              if (noAccessMsg) noAccessMsg.textContent =
                'Saat ini tidak ada periode ujian yang sedang berlangsung. Halaman ini akan aktif saat periode ujian dimulai dan Anda dikonfirmasi sebagai panitia.';
              noAccess.classList.remove('hidden');
            }
            if (typeof checkExamPanitiaAccess === 'function') {
              try { sessionStorage.removeItem('_examPanitiaAccess'); } catch (_) { }
              checkExamPanitiaAccess();
            }
            return;
          }
          if (!res.is_confirmed_panitia) {
            if (noAccess) {
              if (noAccessTitle) noAccessTitle.textContent = 'Belum Dikonfirmasi sebagai Panitia';
              if (noAccessMsg) noAccessMsg.textContent =
                'Halaman ini akan aktif setelah Anda dikonfirmasi sebagai panitia ujian oleh admin pada periode ujian aktif.';
              noAccess.classList.remove('hidden');
            }
            return;
          }
          renderExamPanitiaPanel(res);
          try { sessionStorage.removeItem('_examPanitiaAccess'); } catch (_) { }
          if (typeof checkExamPanitiaAccess === 'function') checkExamPanitiaAccess();
        })
        .withFailureHandler(function (err) {
          if (skel) skel.classList.add('hidden');
          if (noAccess) {
            if (noAccessTitle) noAccessTitle.textContent = 'Koneksi Gagal';
            if (noAccessMsg) noAccessMsg.textContent =
              'Tidak dapat memuat data: ' + (err && err.message ? err.message : err);
            noAccess.classList.remove('hidden');
          }
        })
        .getExamPageData(token);
    }

     *   adjustOccurrenceJtm(token, { occurrence_type:'EXAM', supervisor_id,

     *   reallocateJtmDifference(token, { occurrence_type:'EXAM',
     *       occurrence_ref:supervisor_id,
     *       allocations:[{ substitute_user_id, allocated_jtm }] })
     *   removeReallocation(token, reallocation_id)
     *

     * `_jsStr`, `escapeHtml`, `_busyButton`, and `showToast` are reused. Per
     * Req 6.1/6.2 the supervisor Adjusted_JTM is validated the same as KBM

    function _examJtmEnsureTeachers(cb) {

      google.script.run
        .withSuccessHandler(function (users) {
          allTeachersCache = (users || []).filter(function (u) {
            return String(u.role).toLowerCase() === 'guru' && String(u.username) !== 'PenjagaMadrasah';

    function loadExamJtmState(supervisorId) {

            if (_statusEl) _statusEl.textContent = _errMsg;

          var adjEl    = document.getElementById('jtmExamAdjDisp-'   + sid);
          var diffEl   = document.getElementById('jtmExamDiffDisp-'  + sid);

    function recomputeExamJtmDiff(supervisorId) {
      var sid = _jtmSid(supervisorId);
      var inputEl = document.getElementById('jtmExamAdjInput-' + sid);
      if (!inputEl) return;
      var adjEl = document.getElementById('jtmExamAdjDisp-' + sid);
      var diffEl = document.getElementById('jtmExamDiffDisp-' + sid);
      var reasonWrap = document.getElementById('jtmExamReasonWrap-' + sid);
      var scheduled = Number(inputEl.dataset.scheduled || inputEl.getAttribute('max') || 0);
      var raw = String(inputEl.value).trim();
      var val = Number(raw);
      var isWholeInRange = raw !== '' && isFinite(val) && Math.floor(val) === val && val >= 0 && val <= scheduled;
      if (isWholeInRange) {
        if (adjEl) adjEl.textContent = val;
        if (diffEl) diffEl.textContent = (scheduled - val);
      }
      if (reasonWrap) {
        if (isWholeInRange && val < scheduled) reasonWrap.classList.remove('hidden');
        else reasonWrap.classList.add('hidden');
      }
    }
    function saveExamJtmAdjustment(supervisorId, userId, btnEl) {
      var sid = _jtmSid(supervisorId);
      var inputEl = document.getElementById('jtmExamAdjInput-' + sid);
      var reasonEl = document.getElementById('jtmExamReason-' + sid);
      var statusEl = document.getElementById('jtmExamAdjStatus-' + sid);
      if (!inputEl) return;
      var scheduled = Number(inputEl.dataset.scheduled || inputEl.getAttribute('max') || 0);
      var raw = String(inputEl.value).trim();
      var val = Number(raw);
      if (raw === '' || !isFinite(val) || Math.floor(val) !== val) {
        showToast('Adjusted JTM harus berupa bilangan bulat.', 'error');
        return;
      }
      if (val < 0 || val > scheduled) {
        showToast('Adjusted JTM harus di antara 0 dan ' + scheduled + '.', 'error');
        return;
      }
      var reason = reasonEl ? String(reasonEl.value).trim() : '';
      if (val < scheduled && reason.length === 0) {
        showToast('Alasan penyesuaian wajib diisi saat mengurangi JTM.', 'error');
        if (reasonEl) reasonEl.focus();
        return;
      }
      if (reason.length > 500) {
        showToast('Alasan penyesuaian maksimal 500 karakter.', 'error');
        return;
      }
      var token = localStorage.getItem('auth_token');
      var restoreBtn = _busyButton(btnEl, 'Menyimpan...');
      var payload = {
        occurrence_type: 'EXAM',
        supervisor_id: supervisorId,
        adjusted_jtm: val,
        reason: reason
      };
      google.script.run
        .withSuccessHandler(function (res) {
          restoreBtn();
          if (res && res.status === 'success') {
            showToast('Penyesuaian JTM tersimpan.', 'success');
            var _statusEl = document.getElementById('jtmExamAdjStatus-' + sid);
            var schedEl = document.getElementById('jtmExamSchedDisp-' + sid);
            var adjEl   = document.getElementById('jtmExamAdjDisp-'   + sid);
            var diffEl  = document.getElementById('jtmExamDiffDisp-'  + sid);
            if (schedEl) schedEl.textContent = res.scheduled_jtm;
            if (adjEl)   adjEl.textContent   = res.adjusted_jtm;
            if (diffEl)  diffEl.textContent  = res.jtm_difference;
            if (_statusEl) _statusEl.textContent = '';
            var _panel    = document.getElementById('jtmExamAllocPanel-' + sid);
            var _listEl   = document.getElementById('jtmExamAllocList-'  + sid);
            var _remainEl = document.getElementById('jtmExamRemainDisp-' + sid);
            var newDiff   = Number(res.jtm_difference) || 0;
            var allocSum  = 0;
            if (_listEl) {
              var rows = _listEl.querySelectorAll('[data-alloc-jtm]');
              for (var _i = 0; _i < rows.length; _i++) {
                allocSum += Number(rows[_i].dataset.allocJtm) || 0;
              }
            }
            var newRemaining = Math.max(0, newDiff - allocSum);
            if (_remainEl) _remainEl.textContent = newRemaining;
            if (_panel) {
              _panel.dataset.remaining = newRemaining;
              if (newDiff > 0) _panel.classList.remove('hidden');
              else             _panel.classList.add('hidden');
            }
            var _cancelBtnExam = document.getElementById('jtmExamCancelBtn-' + sid);
            if (_cancelBtnExam) _cancelBtnExam.classList.remove('hidden');
          } else {
            showToast((res && res.message) || 'Gagal menyimpan penyesuaian JTM.', 'error');
            var _statusEl2 = document.getElementById('jtmExamAdjStatus-' + sid);
            if (_statusEl2) _statusEl2.textContent = (res && res.message) || '';
          }
        })
        .withFailureHandler(function (err) {
          restoreBtn();
          showToast('Koneksi gagal: ' + err, 'error');
        })
        .adjustOccurrenceJtm(token, payload);
    }

    function renderExamJtmAllocPanel(supervisorId, res) {
      var sid = _jtmSid(supervisorId);
      var panel = document.getElementById('jtmExamAllocPanel-' + sid);
      if (!panel) return;
      var scheduled = Number(res.scheduled_jtm) || 0;
      var adjusted = Number(res.adjusted_jtm) || 0;
      var difference = scheduled - adjusted;
      var allocs = res.allocations || [];
      var allocated = 0;
      for (var i = 0; i < allocs.length; i++) {
        allocated += Number((allocs[i] || {}).allocated_jtm) || 0;
      }
      var remaining = difference - allocated;
      if (remaining < 0) remaining = 0;
      if (difference > 0) {
        panel.classList.remove('hidden');
      } else {
        panel.classList.add('hidden');
      }
      var remainEl = document.getElementById('jtmExamRemainDisp-' + sid);
      if (remainEl) remainEl.textContent = remaining;
      _examJtmEnsureTeachers(function () {
        _examJtmPopulateAllocSelect(sid, panel.dataset.originalUid);
        _examJtmRenderAllocList(supervisorId, allocs);
      });
      panel.dataset.remaining = remaining;

    function addExamJtmAllocation(supervisorId, userId, btnEl) {

      var val = Number(raw);
      if (!substituteUserId) {
        showToast('Pilih guru pengganti terlebih dahulu.', 'error');
        return;
      }
      if (raw === '' || !isFinite(val) || val <= 0) {
        showToast('Alokasi JTM harus berupa angka lebih dari 0.', 'error');
        return;
      }
      var remaining = panel ? Number(panel.dataset.remaining || 0) : 0;
      if (val > remaining) {
        showToast('Alokasi melebihi sisa selisih JTM (' + remaining + ').', 'error');
        return;

        allocations: [{ substitute_user_id: substituteUserId, allocated_jtm: val }]
      };

        .withSuccessHandler(function (res) {

            if (btnEl) {

                  while (el && !el.dataset.reallocId) el = el.parentElement;
                  return el;

              _mahSumChip('🟢', sum.hadir || 0, 'Hadir') +
              _mahSumChip('🔴', sum.tidak_hadir || 0, 'Tidak Hadir') +
              _mahSumChip('⏰', sum.terlambat || 0, 'Terlambat') +
              _mahSumChip('🏖️', sum.libur || 0, 'Hari Libur') +
              _mahSumChip('📅', sum.total_days || 0, 'Total Hari');
          } else {
            summaryBar.style.display = 'none';
            summaryBar.innerHTML = '';
          }
          if (days.length === 0) {
            container.innerHTML = '<div class="mah-empty-state">' +
              '<svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>' +
              '<p>Tidak ada data</p><span>Belum ada data kehadiran untuk periode ini.</span></div>';
            return;
          }
          var html = '';
          days.forEach(function(d) {
            html += _mahRenderDay(d);
          });
          container.innerHTML = html;
        })
        .withFailureHandler(function() {
          container.innerHTML = '<div class="mah-empty-state">' +
            '<svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18.364 5.636l-12.728 12.728M5.636 5.636l12.728 12.728"/></svg>' +
            '<p>Koneksi gagal</p><span>Periksa koneksi internet Anda.</span></div>';
</script>
