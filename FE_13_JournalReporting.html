    function updatePicketBadge() {
      const token = localStorage.getItem('auth_token');
      const badge = document.getElementById('badgePicketNotification');
      const badgeAdmin = document.getElementById('badgePicketNotification_Admin');
      if (!badge && !badgeAdmin) return;
      google.script.run.withSuccessHandler((res) => {
        if (res.status === 'success' && res.is_picket) {
          if (badge) badge.classList.remove('hidden');
          if (badgeAdmin) badgeAdmin.classList.remove('hidden');
        } else {
          if (badge) badge.classList.add('hidden');
          if (badgeAdmin) badgeAdmin.classList.add('hidden');
        }
      }).getPicketStatus(token);
    }
    function updateNotificationBadges() {
      const role = localStorage.getItem('user_role');
      if (String(role).toLowerCase() !== 'admin') return;
      const token = localStorage.getItem('auth_token');
      const badgeSidebar = document.getElementById('badgeResetRequest');
      const badgeSettings = document.getElementById('badgeResetCount');
      const badgeTabBtn = document.getElementById('badgeResetTabBtn');
      google.script.run.withSuccessHandler((res) => {
        if (res.status === 'success' && res.count > 0) {
          if (badgeSidebar) {
            badgeSidebar.innerText = res.count;
            badgeSidebar.classList.remove('hidden');
          }
          if (badgeSettings) {
            badgeSettings.innerText = res.count;
            badgeSettings.classList.remove('hidden');
          }
          if (badgeTabBtn) {
            badgeTabBtn.innerText = res.count;
            badgeTabBtn.classList.remove('hidden');
          }
        } else {
          if (badgeSidebar) badgeSidebar.classList.add('hidden');
          if (badgeSettings) badgeSettings.classList.add('hidden');
          if (badgeTabBtn) badgeTabBtn.classList.add('hidden');
        }
      }).getPendingResetCount(token);
    }

    function submitSubstitute() {
      if (_subSubmitInFlight) {
        showToast('Sedang memproses, mohon tunggu...', 'info');
        return;
      }
      const subSelect = document.getElementById('inpSubTeacher');
      const subId = subSelect ? subSelect.value : '';
      if (!subId) {
        showToast('Pilih guru pengganti terlebih dahulu.', 'error');
        if (subSelect) subSelect.focus();
        return;
      }
      const newSubName = subSelect.options[subSelect.selectedIndex] ? subSelect.options[subSelect.selectedIndex].text : 'Guru Pengganti';
      const submitBtn = document.getElementById('btnSubmitSubstitute');
      const submitLbl = document.getElementById('lblSubmitSubstitute');
      const ctx = _subModalContext || {};
      const isCeremony = (document.getElementById('inpIsCeremonySub').value === 'true');
      const isPicket = (document.getElementById('inpIsPicketSub').value === 'true');
      const token = localStorage.getItem('auth_token');
      _subSubmitInFlight = true;
      if (submitBtn) submitBtn.dataset.submitting = 'true';
      var subBtnRestore = _busyButton(submitBtn, 'Menyimpan...');
      const restore = () => {
        _subSubmitInFlight = false;
        try { subBtnRestore(); } catch (_) { }
        if (submitBtn) {
          submitBtn.dataset.submitting = 'false';
          submitBtn.disabled = false;
          submitBtn.style.opacity = '';
        }
        if (submitLbl) submitLbl.innerText = 'Tetapkan Pengganti';
      };
      const handleSuccess = (res) => {
        restore();
        if (res && res.status === 'success') {
          showToast(res.message || 'Pengganti berhasil ditetapkan.', 'success');
          const modal = document.getElementById('subModal');
          if (modal) modal.classList.add('hidden');
          _subModalContext = null;
          initPicket();
        } else {
          handleError(res || {});
        }
      };
      const handleError = (res) => {
        restore();
        if (res && res.code === 'COLLISION' && res.collision) {
          const existingName = res.existing_sub_name || 'Guru Pengganti';
          const modal = document.getElementById('subModal');
          if (modal) modal.classList.add('hidden');
          setTimeout(() => showReplaceConfirmModal(existingName, newSubName, subId, ctx.scheduleId), 250);
        } else {
          showToast((res && res.message) || 'Gagal menyimpan pengganti.', 'error');
        }
      };
      const failHandler = (err) => {
        restore();
        showToast('Koneksi gagal: ' + err, 'error');
      };
      if (isCeremony) {
        google.script.run
          .withSuccessHandler(handleSuccess)
          .withFailureHandler(failHandler)
          .substituteCeremonyLeader(token, subId);
      } else if (isPicket) {
        const originalUserId = ctx.originalUserId || document.getElementById('inpSubScheduleId').value;
        google.script.run
          .withSuccessHandler(handleSuccess)
          .withFailureHandler(failHandler)
          .substitutePicketDaily(token, originalUserId, subId);
      } else {
        const schedId = ctx.scheduleId || document.getElementById('inpSubScheduleId').value;
        google.script.run
          .withSuccessHandler(handleSuccess)
          .withFailureHandler(failHandler)
          .assignSubstitute(token, schedId, subId);
      }
    }

    function generatePageNumbers(current, total, gotoFnName) {

      let endPage = Math.min(total, startPage + maxVisible - 1);
      if (endPage - startPage < maxVisible - 1) {
        startPage = Math.max(1, endPage - maxVisible + 1);
      }
      if (startPage > 1) {
        html += createPageButton(1, current === 1, gotoFnName);
        if (startPage > 2) html += `<span class="px-2 text-slate-400">...</span>`;
      }
      for (let i = startPage; i <= endPage; i++) {

      if (endPage < total) {
        if (endPage < total - 1) html += `<span class="px-2 text-slate-400">...</span>`;

    /**
     * Mendeteksi semua .db-marquee-wrap di halaman, lalu menambahkan
     * class `is-overflow` hanya jika teks benar-benar melebihi container
     * (scrollWidth > clientWidth). Animasi marquee aktif lewat CSS hanya
     * di layar < 480px saat class is-overflow ada.
     */
    function _initDashboardMarquees(root) {
      var scope = root || document;
      var wraps = scope.querySelectorAll('.db-marquee-wrap');
      wraps.forEach(function(wrap) {
        var inner = wrap.querySelector('.db-marquee-inner');
        if (!inner) return;
        // Skip elemen yang tidak visible — clientWidth/scrollWidth tidak bisa diukur
        // saat parent punya display:none (panel hidden)
        if (wrap.offsetParent === null && wrap.clientWidth === 0) return;
        // Reset dulu agar re-check akurat
        wrap.classList.remove('is-overflow');
        inner.style.animation = 'none';
        // Paksa reflow pada INNER (bukan wrap) agar browser flush animasi CSS
        void inner.offsetWidth;
        inner.style.animation = '';
        // Cek apakah teks melebar melebihi wrapper
        if (inner.scrollWidth > wrap.clientWidth + 2) {
          wrap.classList.add('is-overflow');
        }
      });
    }

            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-1 min-w-0">
                <p class="text-sm font-bold text-slate-800 truncate flex-1 min-w-0"><span class="db-marquee-wrap"><span class="db-marquee-inner">${escapeHtml(activeName)}</span></span></p>
                <span class="flex-shrink-0">${substBadge}</span>
              </div>
              ${origHint}
              <div class="flex flex-wrap items-center gap-1.5 mt-1">
                ${confirmBadgeHtml}
              </div>
              ${timeHtml}
            </div>
            <button
              onclick="openAdminPicketModal(${idx})"
              class="db-piket-action-btn flex-shrink-0"
              style="background:${accentColor};color:white;border-color:transparent;"
              title="Kelola piket ini">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              Kelola
            </button>
          </div>
        </div>`;
    }

    /**
     * Membuka modal manajemen piket untuk item tertentu (berdasarkan index di cache).
     */
    function openAdminPicketModal(idx) {
      if (!_apmCache || !_apmCache.picket_items) return;
      const item = _apmCache.picket_items[idx];
      if (!item) return;
      // Reset _apmInFlight setiap kali modal dibuka untuk mencegah state
      // "macet" apabila modal dibuka ulang sementara request sebelumnya masih berjalan
      _apmInFlight = false;
      _apmContext = { item: item, idx: idx };

      const modal    = document.getElementById('adminPicketModal');
      const title    = document.getElementById('apmModalTitle');
      const subtitle = document.getElementById('apmModalSubtitle');
      if (!modal) return;

      const sub = item.substitute;
      const hasSubst = !!sub;

      // Header
      if (title) title.innerText = 'Kelola Piket: ' + (item.name || '—');
      if (subtitle) subtitle.innerText = hasSubst
        ? 'Piket asli + pengganti aktif'
        : 'Guru piket hari ini';

      // Info guru utama
      const avatar      = document.getElementById('apmGuruAvatar');
      const nameEl      = document.getElementById('apmGuruName');
      const roleBadge   = document.getElementById('apmRoleBadge');
      const confBadge   = document.getElementById('apmConfirmBadge');
      const confDot     = document.getElementById('apmConfirmDot');
      const confText    = document.getElementById('apmConfirmText');

      const activeIsConfirmed = hasSubst ? sub.is_confirmed : item.is_confirmed;
      const displayName       = hasSubst ? sub.name : item.name;
      const initial           = (displayName || '?').charAt(0).toUpperCase();

      if (avatar) {
        avatar.innerText = initial;
        avatar.style.cssText = hasSubst
          ? 'background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE;'
          : (activeIsConfirmed
              ? 'background:#ECFDF5;color:#065F46;border-color:#A7F3D0;'
              : 'background:#FEF3C7;color:#92400E;border-color:#FCD34D;');
      }
      if (nameEl) nameEl.innerText = displayName || '—';

      if (roleBadge) {
        if (hasSubst) {
          roleBadge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-indigo-500 inline-block"></span>Guru Piket Pengganti';
          roleBadge.style.cssText = 'background:#EEF2FF;color:#4338CA;border-color:#C7D2FE;';
        } else {
          roleBadge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-amber-500 inline-block"></span>Guru Piket';
          roleBadge.style.cssText = 'background:#FEF3C7;color:#92400E;border-color:#FCD34D;';
        }
      }

      if (confDot && confText && confBadge) {
        if (activeIsConfirmed) {
          confDot.style.background = '#10B981';
          confText.innerText = 'Sudah Dikonfirmasi';
          confBadge.style.cssText = 'background:#ECFDF5;color:#065F46;border-color:#A7F3D0;';
        } else {
          confDot.style.background = '#F59E0B';
          confText.innerText = 'Belum Dikonfirmasi';
          confBadge.style.cssText = 'background:#FEF3C7;color:#92400E;border-color:#FCD34D;';
        }
      }

      // --- Section ① Konfirmasi ---
      const btnKonfirmasi       = document.getElementById('apmBtnKonfirmasi');
      const btnBatalKonfirmasi  = document.getElementById('apmBtnBatalKonfirmasi');
      // Tentukan userId yang perlu dikonfirmasi (pengganti jika ada, asli jika tidak)
      const activeUserId = hasSubst ? sub.user_id : item.user_id;
      if (btnKonfirmasi && btnBatalKonfirmasi) {
        if (activeIsConfirmed) {
          btnKonfirmasi.classList.add('hidden');
          btnBatalKonfirmasi.classList.remove('hidden');
          btnBatalKonfirmasi.classList.add('flex');
        } else {
          btnKonfirmasi.classList.remove('hidden');
          btnBatalKonfirmasi.classList.add('hidden');
          btnBatalKonfirmasi.classList.remove('flex');
        }
      }

      // --- Section ② Pengganti ---
      const substInfo  = document.getElementById('apmSubstInfo');
      const substForm  = document.getElementById('apmSubstForm');
      const substName  = document.getElementById('apmSubstName');
      const substAvat  = document.getElementById('apmSubstAvatar');
      const substConf  = document.getElementById('apmSubstConfirmBadge');
      const substSel   = document.getElementById('apmSubstSelect');

      if (hasSubst) {
        // Tampilkan info pengganti, sembunyikan form
        if (substInfo) substInfo.classList.remove('hidden');
        if (substForm) substForm.classList.add('hidden');
        if (substName) substName.innerText = sub.name || '—';
        if (substAvat) substAvat.innerText = (sub.name || '?').charAt(0).toUpperCase();
        if (substConf) {
          if (sub.is_confirmed) {
            substConf.innerText = '✅ Sudah Konfirmasi';
            substConf.style.cssText = 'background:#ECFDF5;color:#065F46;border-color:#A7F3D0;';
          } else {
            substConf.innerText = '⏳ Belum Konfirmasi';
            substConf.style.cssText = 'background:#FEF3C7;color:#92400E;border-color:#FCD34D;';
          }
        }
      } else {
        // Tampilkan form pilih pengganti
        if (substInfo) substInfo.classList.add('hidden');
        if (substForm) substForm.classList.remove('hidden');

        // Isi dropdown guru (dari cache)
        if (substSel && _apmCache.teacher_list) {
          let opts = '<option value="">— Pilih Guru Pengganti —</option>';
          _apmCache.teacher_list.forEach(function(t) {
            // Jangan tampilkan guru piket asli di dropdown
            if (String(t.id) !== String(item.user_id)) {
              opts += `<option value="${escapeHtml(t.id)}">${escapeHtml(t.name)}</option>`;
            }
          });
          substSel.innerHTML = opts;
        }

        // Disable tombol + select jika guru piket sudah dikonfirmasi hadir
        // (tidak perlu pengganti karena guru asli sudah hadir)
        const btnTunjuk = document.getElementById('apmBtnTunjukPengganti');
        const noteElId  = 'apmSubstDisabledNote';
        const noteElExisting = document.getElementById(noteElId);
        if (item.is_confirmed) {
          if (substSel) {
            substSel.disabled = true;
            substSel.style.opacity = '0.5';
            substSel.style.cursor = 'not-allowed';
          }
          if (btnTunjuk) {
            btnTunjuk.disabled = true;
            btnTunjuk.classList.add('opacity-50', 'cursor-not-allowed', 'pointer-events-none');
          }
          // Tampilkan catatan alasan disable (jika belum ada)
          if (!noteElExisting && btnTunjuk && btnTunjuk.parentNode) {
            const note = document.createElement('p');
            note.id = noteElId;
            note.className = 'flex items-start gap-1.5 text-[11px] text-emerald-700 font-semibold mt-1.5 bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-2';
            note.innerHTML = '<svg class="w-3.5 h-3.5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>Guru piket sudah hadir &amp; dikonfirmasi — pengganti tidak diperlukan.';
            btnTunjuk.parentNode.insertBefore(note, btnTunjuk.nextSibling);
          }
        } else {
          if (substSel) {
            substSel.disabled = false;
            substSel.style.opacity = '';
            substSel.style.cursor = '';
          }
          if (btnTunjuk) {
            btnTunjuk.disabled = false;
            btnTunjuk.classList.remove('opacity-50', 'cursor-not-allowed', 'pointer-events-none');
          }
          if (noteElExisting) noteElExisting.remove();
        }
      }

      // --- Section ③ Jam ---
      const jamOrigSection  = document.getElementById('apmJamOrigSection');
      const jamSubstSection = document.getElementById('apmJamSubstSection');
      const jamOrigLabel    = document.getElementById('apmJamOrigLabel');
      const jamSubstLabel   = document.getElementById('apmJamSubstLabel');
      const tInOrig         = document.getElementById('apmTimeInOrig');
      const tOutOrig        = document.getElementById('apmTimeOutOrig');
      const tInSubst        = document.getElementById('apmTimeInSubst');
      const tOutSubst       = document.getElementById('apmTimeOutSubst');

      if (jamOrigLabel) jamOrigLabel.innerText = item.name || 'Guru Piket Asli';
      if (tInOrig)  tInOrig.value  = item.time_in  || '';
      if (tOutOrig) tOutOrig.value = item.time_out || '';

      if (hasSubst) {
        // Ada pengganti: sembunyikan section jam asli, tampilkan section jam pengganti
        if (jamOrigSection) jamOrigSection.classList.add('hidden');
        if (jamSubstSection) jamSubstSection.classList.remove('hidden');
        if (jamSubstLabel)   jamSubstLabel.innerText = sub.name || 'Guru Piket Pengganti';
        if (tInSubst)  tInSubst.value  = sub.time_in  || '';
        if (tOutSubst) tOutSubst.value = sub.time_out || '';
      } else {
        // Tidak ada pengganti: tampilkan section jam asli, sembunyikan section pengganti
        if (jamOrigSection)  jamOrigSection.classList.remove('hidden');
        if (jamSubstSection) jamSubstSection.classList.add('hidden');
      }

      // Tampilkan modal
      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeAdminPicketModal() {
      const modal = document.getElementById('adminPicketModal');
      if (modal) modal.classList.add('hidden');
      document.body.style.overflow = '';
      // Bersihkan note "pengganti tidak diperlukan" yang disisipkan secara dinamis
      // agar tidak tersisa di DOM dan muncul ganda saat modal dibuka lagi
      const staleNote = document.getElementById('apmSubstDisabledNote');
      if (staleNote) staleNote.remove();
      _apmContext = null;
      _apmInFlight = false;
    }

    // Konfirmasi kehadiran piket
    function apmDoKonfirmasi() {
      if (_apmInFlight) return;
      if (!_apmContext) return;
      const item     = _apmContext.item;
      const sub      = item.substitute;
      const hasSubst = !!sub;
      const userId   = hasSubst ? sub.user_id : item.user_id;
      const name     = hasSubst ? sub.name    : item.name;
      const token    = localStorage.getItem('auth_token');

      _apmInFlight = true;
      const btn = document.getElementById('apmBtnKonfirmasi');
      if (btn) { btn.disabled = true; btn.innerHTML = '<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg> Mengonfirmasi...'; }

      google.script.run
        .withSuccessHandler(function(res) {
          _apmInFlight = false;
          if (btn) { btn.disabled = false; }
          if (res && res.status === 'success') {
            showToast('Kehadiran ' + escapeHtml(name) + ' berhasil dikonfirmasi.', 'success');
            closeAdminPicketModal();
            loadAdminDashboardPicket();
          } else {
            showToast((res && res.message) || 'Gagal mengonfirmasi kehadiran.', 'error');
            if (btn) { btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg> Konfirmasi Hadir'; }
          }
        })
        .withFailureHandler(function(err) {
          _apmInFlight = false;
          if (btn) { btn.disabled = false; btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg> Konfirmasi Hadir'; }
          showToast('Koneksi gagal: ' + escapeHtml(String(err)), 'error');
        })
        .confirmPicketSubPresenceBackend(token, userId);
    }

    // Batalkan konfirmasi piket
    function apmDoRevokeKonfirmasi() {
      if (_apmInFlight) return;
      if (!_apmContext) return;
      const item     = _apmContext.item;
      const sub      = item.substitute;
      const hasSubst = !!sub;
      const userId   = hasSubst ? sub.user_id : item.user_id;
      const name     = hasSubst ? sub.name    : item.name;
      const token    = localStorage.getItem('auth_token');

      showConfirm(
        'Batalkan Konfirmasi Piket',
        'Apakah Anda yakin ingin <strong>membatalkan konfirmasi kehadiran</strong> ' + escapeHtml(name) + '? JTM piket akan dihapus dari sistem honorarium.',
        function() {
          _apmInFlight = true;
          const btn = document.getElementById('apmBtnBatalKonfirmasi');
          if (btn) { btn.disabled = true; btn.innerHTML = '<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg> Membatalkan...'; }
          google.script.run
            .withSuccessHandler(function(res) {
              _apmInFlight = false;
              if (btn) btn.disabled = false;
              if (res && res.status === 'success') {
                showToast('Konfirmasi kehadiran ' + escapeHtml(name) + ' dibatalkan.', 'warning');
                closeAdminPicketModal();
                loadAdminDashboardPicket();
              } else {
                showToast((res && res.message) || 'Gagal membatalkan konfirmasi.', 'error');
                if (btn) btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg> Batalkan Konfirmasi';
              }
            })
            .withFailureHandler(function(err) {
              _apmInFlight = false;
              if (btn) { btn.disabled = false; btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg> Batalkan Konfirmasi'; }
              showToast('Koneksi gagal: ' + escapeHtml(String(err)), 'error');
            })
            .revokePicketDaily(token, userId);
</script>
