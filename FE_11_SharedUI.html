<script>
        'Minggu': { bg: '#FEF2F2', color: '#9F1239', dot: '#F43F5E', border: '#FECACA' },
      };
      const examPanel = document.getElementById('panelExamMySchedule');

          } else {
            if (elSesi) elSesi.textContent = totalSesi;
            if (elJtm) elJtm.textContent = totalJtm;
            if (elPiket) elPiket.textContent = totalPiket;

            } else {
              badgeCount.textContent = totalSesi + ' Sesi · ' + totalJtm + ' JTM';
              badgeCount.style.cssText = 'background:#EFF6FF;color:#2563EB;border:1px solid #BFDBFE;';

          renderMyWeeklyScheduleTable(res.schedules || [], { dayColors, todayName });
          if (!res.picket_days || res.picket_days.length === 0) {
            listPickets.innerHTML = `<li class="ms-empty" style="padding:1rem 0;">
            <svg class="w-9 h-9" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>

                : '';
              html += `<li class="ms-piket-item" style="background:${bg}; border-radius:8px; padding-left:8px; padding-right:8px;">
              <span class="ms-piket-dot"></span>

            res.allowances.forEach(a => {

              const amt = a.amount && String(a.amount).replace(/[^0-9]/g, '') !== '0' ? a.amount : 'Rp 0';
              html += `<li class="ms-allowance-item" title="Tunjangan bulanan untuk ${dutyName}">
              <span class="ms-allowance-name">${dutyName}</span>

              <svg class="w-9 h-9" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9"/></svg>
              <p>Tidak ada jadwal pembina upacara</p>
              <span>Belum ditugaskan sebagai pembina upacara</span>

            } else {
              let html = '';
              ceremonies.forEach(c => {
                let bg, border, dotColor, labelHtml;
                if (c.is_today) {
                  bg = '#EFF6FF'; border = '#BFDBFE'; dotColor = '#3B82F6';
                  labelHtml = `<span style="font-size:0.65rem; font-weight:800; color:#1D4ED8; background:#DBEAFE; padding:2px 8px; border-radius:999px;display:inline-flex;align-items:center;gap:4px;"><span class="w-1.5 h-1.5 rounded-full bg-blue-500 inline-block animate-pulse"></span>Hari Ini</span>`;
                } else if (c.is_past) {
                  bg = c.is_confirmed ? '#F8FAFC' : '#FFF1F2';
                  border = c.is_confirmed ? '#E2E8F0' : '#FECDD3';
                  dotColor = c.is_confirmed ? '#94A3B8' : '#F43F5E';
                  labelHtml = c.is_confirmed

                <span class="ms-ceremony-dot" style="background:${dotColor};"></span>
                <p style="flex:1; min-width:0; font-size:0.8125rem; font-weight:600; color:#1E293B;">${escapeHtml(c.date_formatted)}</p>
                ${labelHtml}
              </div>`;

              listCeremonies.innerHTML = html;

          }
        } else {
          tbody.innerHTML = `<tr><td colspan="5" class="py-2">${errorStateHTML(res.message || 'Gagal memuat data.', 'initMySchedule()')}</td></tr>`;
          if (listAllowances) listAllowances.innerHTML = `<li style="color:#EF4444; font-size:0.8rem; text-align:center;">Gagal memuat data.</li>`;
          if (listPickets) listPickets.innerHTML = `<li style="color:#EF4444; font-size:0.8rem; text-align:center;">Gagal memuat data.</li>`;
          ['statTotalJadwal', 'statTotalJtm', 'statTotalPiket', 'statTotalUpacara'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.textContent = '0';

      }).withFailureHandler((err) => {
        tbody.innerHTML = `<tr><td colspan="5" class="py-2">${errorStateHTML('Koneksi gagal: ' + err, 'initMySchedule()')}</td></tr>`;
        if (listAllowances) listAllowances.innerHTML = `<li style="color:#EF4444; font-size:0.8rem; text-align:center;">Koneksi gagal.</li>`;
        if (listPickets) listPickets.innerHTML = `<li style="color:#EF4444; font-size:0.8rem; text-align:center;">Koneksi gagal.</li>`;
        ['statTotalJadwal', 'statTotalJtm', 'statTotalPiket', 'statTotalUpacara'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.textContent = '—';
        });
      }).getMyWeeklyData(token);
      checkExamForMySchedule();
      setTimeout(() => { if (typeof _fixMobileLayouts === 'function') _fixMobileLayouts(); }, 250);
    }
    function renderMyWeeklyScheduleTable(schedules, opts) {
      const tbody = document.getElementById('tbodyMyWeeklySchedule');
      if (!tbody) return;
      if (!schedules || schedules.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-8">
        <div class="ms-empty">
          <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          <p>Belum ada jadwal mengajar</p>
          <span>Hubungi admin jika seharusnya ada jadwal yang tersedia</span>
        </div>
      </td></tr>`;
        return;
      }
      const dayColors = (opts && opts.dayColors) || {};
      const todayName = (opts && opts.todayName) || '';
      const nowMin = (() => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); })();
      const toMin = (t) => {
        const parts = String(t || '00:00').split(':').map(Number);
        return (parts[0] || 0) * 60 + (parts[1] || 0);
      };
      let html = '';
      let prevDay = null;
      schedules.forEach((s, idx) => {
        const dc = dayColors[s.day_name] || { bg: '#F8FAFC', color: '#475569', dot: '#94A3B8', border: '#E2E8F0' };
        const isToday = s.day_name === todayName;
        const sMin = toMin(s.time_start);
        const eMin = toMin(s.time_end);
        const isLive = isToday && nowMin >= sMin && nowMin <= eMin;
        const isUpcomingToday = isToday && nowMin < sMin;
        const isFirstOfNewDay = (prevDay !== null && prevDay !== s.day_name);
        prevDay = s.day_name;
        let inlineStyle = 'cursor:pointer;';
        let liveBadge = '';
        if (isLive) {
          inlineStyle += 'background:linear-gradient(90deg,#FEFCE8,#FFFBEB);box-shadow:inset 3px 0 0 #F59E0B;';
          liveBadge = '<span class="inline-flex items-center gap-1 ml-1.5 text-[9px] font-extrabold bg-amber-500 text-white px-1.5 py-0.5 rounded-full uppercase tracking-wider"><span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse inline-block"></span>Live</span>';
        } else if (isUpcomingToday) {
          inlineStyle += 'background:linear-gradient(90deg,#EFF6FF,#F0F9FF);box-shadow:inset 3px 0 0 #3B82F6;';
          liveBadge = '<span class="inline-flex items-center gap-1 ml-1.5 text-[9px] font-bold bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded-full uppercase tracking-wider">Berikutnya</span>';
        }
        if (isFirstOfNewDay) {
          inlineStyle += 'border-top:2px solid #F1F5F9;';
        }
        html += `<tr data-day="${escapeHtml(s.day_name)}" onclick="openMyScheduleDetailModal(${idx})" style="${inlineStyle}">
        <td>
          <span class="ms-day-badge" style="background:${dc.bg}; color:${dc.color}; border:1px solid ${dc.border};">
            <span class="ms-day-dot" style="background:${dc.dot};"></span>
            ${escapeHtml(s.day_name)}
          </span>
        </td>
        <td>
          <span style="font-family:monospace; font-size:0.75rem; color:#64748B; font-weight:600; background:#F8FAFC; border:1px solid #E2E8F0; border-radius:6px; padding:3px 8px; display:inline-flex;align-items:center;gap:4px; white-space:nowrap;">
            ${escapeHtml(String(s.time_start))}<span style="color:#CBD5E1;">&ndash;</span>${escapeHtml(String(s.time_end))}
          </span>
          ${liveBadge}
        </td>
        <td><span class="ms-class-badge">${escapeHtml(s.class_name)}</span></td>
        <td class="ms-cell-clip" style="color:#334155; font-weight:500;" title="${escapeHtml(s.subject)}">${escapeHtml(s.subject)}</td>
        <td style="text-align:center;"><span class="ms-jtm-badge">${escapeHtml(String(s.jtm_val || '0'))}</span></td>
      </tr>`;
      });
      tbody.innerHTML = html;
    }
    function openMyScheduleDetailModal(idx) {
      const sch = (window._mySchedulesCache || [])[idx];
      if (!sch) return;
      const modal = document.getElementById('msDetailModal');
      if (!modal) return;
      const setT = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
      setT('msDetailDay', sch.day_name || '-');
      setT('msDetailTime', `${sch.time_start || '--:--'} – ${sch.time_end || '--:--'}`);
      setT('msDetailClass', sch.class_name || '-');
      setT('msDetailSubject', sch.subject || '-');
      setT('msDetailJtm', String(sch.jtm_val || '0'));
      const toMin = (t) => { const p = String(t || '00:00').split(':').map(Number); return (p[0] || 0) * 60 + (p[1] || 0); };
      const dur = Math.max(0, toMin(sch.time_end) - toMin(sch.time_start));
      setT('msDetailDuration', `${dur} menit (~${(dur / 60).toFixed(1)} jam)`);
      modal.classList.remove('hidden');
    }
    function closeMyScheduleDetailModal() {
      const modal = document.getElementById('msDetailModal');
      if (modal) modal.classList.add('hidden');
    }
    function refreshMySchedule() {
      const btn = document.getElementById('btnRefreshMySchedule');
      if (btn) {
        btn.classList.add('rotating');
        setTimeout(() => btn.classList.remove('rotating'), 800);
      }
      if (typeof showToast === 'function') showToast('Memperbarui jadwal...', 'info');
      initMySchedule();
    }
    function filterMySchedule() {
      const all = window._mySchedulesCache || [];
      const search = (document.getElementById('msSearchInput')?.value || '').toLowerCase().trim();
      const dayFilter = document.getElementById('msDayFilter')?.value || '';
      const filtered = all.filter(s => {
        const matchSearch = !search ||
          String(s.subject || '').toLowerCase().includes(search) ||
          String(s.class_name || '').toLowerCase().includes(search);
        const matchDay = !dayFilter || s.day_name === dayFilter;
        return matchSearch && matchDay;
      });
      const dayColors = {
        'Senin': { bg: '#EFF6FF', color: '#1D4ED8', dot: '#3B82F6', border: '#BFDBFE' },
        'Selasa': { bg: '#F5F3FF', color: '#5B21B6', dot: '#8B5CF6', border: '#DDD6FE' },
        'Rabu': { bg: '#ECFDF5', color: '#065F46', dot: '#10B981', border: '#A7F3D0' },
        'Kamis': { bg: '#FFF7ED', color: '#9A3412', dot: '#F97316', border: '#FED7AA' },
        'Jumat': { bg: '#FDF4FF', color: '#7E22CE', dot: '#D946EF', border: '#F0ABFC' },
        'Sabtu': { bg: '#F0F9FF', color: '#0369A1', dot: '#38BDF8', border: '#BAE6FD' },
        'Minggu': { bg: '#FEF2F2', color: '#9F1239', dot: '#F43F5E', border: '#FECACA' },
      };
      const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      const todayName = days[new Date().getDay()];
      const tbody = document.getElementById('tbodyMyWeeklySchedule');
      if (!tbody) return;
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-8">
        <div class="ms-empty">
          <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <p>Tidak ada hasil</p>
          <span>Coba kata kunci atau filter hari yang berbeda</span>
        </div>
      </td></tr>`;
        const badgeCount = document.getElementById('badgeJadwalCount');
        if (badgeCount) badgeCount.textContent = '0 dari ' + all.length + ' sesi · 0 JTM';
        return;
      }
      const nowMin = (() => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); })();
      const toMin = (t) => { const p = String(t || '00:00').split(':').map(Number); return (p[0] || 0) * 60 + (p[1] || 0); };
      let html = '';
      let prevDay = null;
      filtered.forEach((s) => {
        const origIdx = all.indexOf(s);
        const dc = dayColors[s.day_name] || { bg: '#F8FAFC', color: '#475569', dot: '#94A3B8', border: '#E2E8F0' };
        const isToday = s.day_name === todayName;
        const sMin = toMin(s.time_start);
        const eMin = toMin(s.time_end);
        const isLive = isToday && nowMin >= sMin && nowMin <= eMin;
        const isUpcomingToday = isToday && nowMin < sMin;
        const isFirstOfNewDay = (prevDay !== null && prevDay !== s.day_name);
        prevDay = s.day_name;
        let inlineStyle = 'cursor:pointer;';
        let liveBadge = '';
        if (isLive) {
          inlineStyle += 'background:linear-gradient(90deg,#FEFCE8,#FFFBEB);box-shadow:inset 3px 0 0 #F59E0B;';
          liveBadge = '<span class="inline-flex items-center gap-1 ml-1.5 text-[9px] font-extrabold bg-amber-500 text-white px-1.5 py-0.5 rounded-full uppercase tracking-wider"><span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse inline-block"></span>Live</span>';
        } else if (isUpcomingToday) {
          inlineStyle += 'background:linear-gradient(90deg,#EFF6FF,#F0F9FF);box-shadow:inset 3px 0 0 #3B82F6;';
          liveBadge = '<span class="inline-flex items-center gap-1 ml-1.5 text-[9px] font-bold bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded-full uppercase tracking-wider">Berikutnya</span>';
        }
        if (isFirstOfNewDay) inlineStyle += 'border-top:2px solid #F1F5F9;';
        html += `<tr data-day="${escapeHtml(s.day_name)}" onclick="openMyScheduleDetailModal(${origIdx})" style="${inlineStyle}">
        <td>
          <span class="ms-day-badge" style="background:${dc.bg}; color:${dc.color}; border:1px solid ${dc.border};">
            <span class="ms-day-dot" style="background:${dc.dot};"></span>
            ${escapeHtml(s.day_name)}
          </span>
        </td>
        <td>
          <span style="font-family:monospace; font-size:0.75rem; color:#64748B; font-weight:600; background:#F8FAFC; border:1px solid #E2E8F0; border-radius:6px; padding:3px 8px; display:inline-flex;align-items:center;gap:4px; white-space:nowrap;">
            ${escapeHtml(String(s.time_start))}<span style="color:#CBD5E1;">&ndash;</span>${escapeHtml(String(s.time_end))}
          </span>
          ${liveBadge}
        </td>
        <td><span class="ms-class-badge">${escapeHtml(s.class_name)}</span></td>
        <td class="ms-cell-clip" style="color:#334155; font-weight:500;" title="${escapeHtml(s.subject)}">${escapeHtml(s.subject)}</td>
        <td style="text-align:center;"><span class="ms-jtm-badge">${escapeHtml(String(s.jtm_val || '0'))}</span></td>
      </tr>`;
      });
      tbody.innerHTML = html;
      const badgeCount = document.getElementById('badgeJadwalCount');
      if (badgeCount) {
        const totalJtmFiltered = filtered.reduce((s, x) => s + Number(x.jtm_val || 0), 0);
        badgeCount.textContent = filtered.length + ' dari ' + all.length + ' sesi · ' + totalJtmFiltered + ' JTM';
      }
    }
    function resetMyScheduleFilter() {
      const inp = document.getElementById('msSearchInput');
      const sel = document.getElementById('msDayFilter');
      if (inp) inp.value = '';
      if (sel) sel.value = '';
      filterMySchedule();
    }
    function printMySchedule() {
      const data = window._myWeeklyData;
      if (!data || !Array.isArray(data.schedules)) {
        showToast('Data belum siap untuk dicetak', 'error');
        return;
      }
      const userName = localStorage.getItem('user_name') || 'Pengguna';
      const today = new Date();
      const dateStr = formatDateID(today);
      const appVersion = (typeof globalConfig !== 'undefined' && globalConfig.app_version) ? globalConfig.app_version : '2.1.1';
      const schoolName = (typeof globalConfig !== 'undefined' && globalConfig.school_name) ? globalConfig.school_name : 'MTs Nurul Falah';
      const appName = (typeof globalConfig !== 'undefined' && globalConfig.app_name) ? globalConfig.app_name : 'Sistem Manajemen Guru';
      const activeTP = (typeof globalConfig !== 'undefined' && globalConfig.tahun_pelajaran) ? globalConfig.tahun_pelajaran : '-';
      const activeSem = (typeof globalConfig !== 'undefined' && globalConfig.semester) ? globalConfig.semester : '-';
      const totalJtm = data.schedules.reduce((s, x) => s + Number(x.jtm_val || 0), 0);
      let jadwalRows = '';
      data.schedules.forEach((s, i) => {
        const jtmTxt = (s.jtm_val === null || s.jtm_val === undefined || s.jtm_val === '') ? '0' : String(s.jtm_val);
        jadwalRows += `<tr>
          <td class="tc">${i + 1}</td>
          <td>${escapeHtml(s.day_name)}</td>
          <td class="mono">${escapeHtml(s.time_start)} &ndash; ${escapeHtml(s.time_end)}</td>
          <td>${escapeHtml(s.class_name)}</td>
          <td>${escapeHtml(s.subject)}</td>
          <td class="tc">${escapeHtml(jtmTxt)}</td>
        </tr>`;
      });
      const picketDays = Array.isArray(data.picket_days) ? data.picket_days : [];
      let piketRows = '';
      if (picketDays.length === 0) {
        piketRows = '<tr><td colspan="2" class="empty">Tidak ada jadwal piket.</td></tr>';
      } else {
        picketDays.forEach((day, i) => {
          piketRows += `<tr>
            <td class="tc">${i + 1}</td>
            <td>${escapeHtml(day)}</td>
          </tr>`;
        });
      }
      const ceremonies = Array.isArray(data.ceremony_assignments) ? data.ceremony_assignments : [];
      let upacaraRows = '';
      if (ceremonies.length === 0) {
        upacaraRows = '<tr><td colspan="3" class="empty">Tidak ada jadwal sebagai pembina upacara.</td></tr>';
      } else {
        ceremonies.forEach((c, i) => {
          let statusTxt, statusClass;
          if (c.is_today) {
            statusTxt = 'Hari Ini'; statusClass = 'badge-today';
