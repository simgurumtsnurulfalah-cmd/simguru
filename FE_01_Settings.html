          if (pageName === 'Page_StudentAttendance' || pageName === 'Page_StudentAttendanceInput') initStudentAttendance();
          if (pageName === 'Page_StudentAttendanceHistory') initStudentAttendanceHistory();
          updateNotificationBadges();
          updatePicketBadge();
          if (typeof navLoadingBarFinish === 'function') navLoadingBarFinish();
          if (typeof window.refreshFloatingScrollTop === 'function') {
            window.refreshFloatingScrollTop();
          }
          if (pageName !== 'Page_Login' && typeof window.maybeShowAnnouncements === 'function') {
            window.maybeShowAnnouncements();
          }
        })
        .withFailureHandler(function (err) {
          container.innerHTML = `<div class="p-10 text-red-500 font-bold">Error Loading Page: ${err}</div>`;
          container.classList.remove('opacity-0');
          if (typeof navLoadingBarFinish === 'function') navLoadingBarFinish();
        })
        .getPageContent(pageName);
    }
    function handleLogin(event) {
      event.preventDefault();
      var modalOpen = !!(document.getElementById('simLoginModal') &&
        document.getElementById('simLoginModal').classList.contains('sim-modal-open'));
      var pfx = modalOpen ? 'm_' : '';
      const btn = document.getElementById(pfx + 'btnLogin');
      const userEl = document.getElementById(pfx + 'username');
      const passEl = document.getElementById(pfx + 'password');
      const userInp = (userEl ? userEl.value : '').trim();
      const passInp = passEl ? passEl.value : '';
      function _markFieldError(el, isErr) {
        if (!el) return;
        var wrap = el.closest && el.closest('.sim-input-wrap');
        if (!wrap) return;
        wrap.classList.toggle('is-error', !!isErr);
      }
      _markFieldError(userEl, false);
      _markFieldError(passEl, false);
      if (!userInp) {
        _showLoginInlineError(pfx, 'Username wajib diisi.');
        _markFieldError(userEl, true);
        try { userEl.focus(); } catch (_) { }
        showToast('Username wajib diisi', 'error');
        return;
      }
      if (!passInp) {
        _showLoginInlineError(pfx, 'Password wajib diisi.');
        _markFieldError(passEl, true);
        try { passEl.focus(); } catch (_) { }
        showToast('Password wajib diisi', 'error');
        return;
      }
      _showLoginInlineError(pfx, '');
      if (!btn) return;
      btn.disabled = true;
      btn.dataset.origHtml = btn.innerHTML;
      btn.innerHTML = '<span class="sim-btn-loader" aria-hidden="true"></span><span class="sim-btn-label">Memverifikasi...</span>';
      function _restoreBtn() {
        if (!btn) return;
        btn.disabled = false;
        if (btn.dataset.origHtml) {
          btn.innerHTML = btn.dataset.origHtml;
          delete btn.dataset.origHtml;
        } else {
          btn.innerHTML = '<span class="sim-btn-label">Masuk Aplikasi</span>';
        }
      }
      function _showLoginError(msg) {
        showToast(msg, 'error');
        _showLoginInlineError(pfx, msg);
        _markFieldError(passEl, true);
        try { passEl.focus(); passEl.select && passEl.select(); } catch (_) { }
      }
      google.script.run
        .withSuccessHandler((res) => {
          if (res && res.status === 'maintenance') {
            _restoreBtn();
            _showLoginInlineError(pfx, '');
            showMaintenanceModal(res);
            return;
          }
          if (res && res.status === 'success') {
            showToast('Login berhasil', 'success');
            try {
              var rememberEl = document.getElementById(pfx + 'chkRemember');
              if (rememberEl && rememberEl.checked) {
                localStorage.setItem('remember_username', userInp);
              } else {
                localStorage.removeItem('remember_username');
              }
            } catch (_) { }
            localStorage.setItem('auth_token', res.token);
            localStorage.setItem('user_name', res.user.name);
            localStorage.setItem('user_role', res.user.role);
            localStorage.setItem('is_default_pass', res.user.is_default_pass);
            localStorage.setItem('has_security_question', res.user.has_security_question ? 'true' : 'false');
            localStorage.setItem('has_email_verified', res.user.has_email_verified ? 'true' : 'false');
            if (res.user.email) localStorage.setItem('user_email', String(res.user.email));
            else localStorage.removeItem('user_email');
            localStorage.setItem('user_username', String(userInp || '').trim());
            if (typeof window._onLoginSuccess === 'function') window._onLoginSuccess();
            if (modalOpen) closeLoginModal();
            try {
              sessionStorage.removeItem('ann_session_shown');
              localStorage.removeItem('ann_seen_ids_v1');
              if (window._annCache) window._annCache = null;
            } catch (_) { }
            if (res.user.is_default_pass) {
              loadPage('Page_Profile');
            } else if (!res.user.has_security_question) {
              localStorage.setItem('force_security_question', 'true');
              showSecurityQuestionOverlay();
              loadPage('Page_Profile');
            } else if (!res.user.has_email_verified) {
              localStorage.setItem('force_email_verify', 'true');
              loadPage('Page_Profile');
            } else {
              loadPage('Page_Dashboard');
            }
          } else {
            _showLoginError((res && res.message) || 'Username atau password salah.');
            _restoreBtn();
          }
        })
        .withFailureHandler((err) => {
          _showLoginError('Gagal terhubung ke server. Periksa koneksi Anda.');
          _restoreBtn();
        })
        .loginUser(userInp, passInp);
    }
    // ─── Maintenance Modal Functions ───────────────────────────────────
    function showMaintenanceModal(res) {
      var modal = document.getElementById('maintenanceModal');
      if (!modal) return;
      // Timestamp
      var ts = document.getElementById('mtnTimestamp');
      if (ts) {
        var now = new Date();
        var days = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
        ts.textContent = days[now.getDay()] + ', ' +
          String(now.getDate()).padStart(2,'0') + '/' +
          String(now.getMonth()+1).padStart(2,'0') + '/' + now.getFullYear() + ' ' +
          String(now.getHours()).padStart(2,'0') + ':' +
          String(now.getMinutes()).padStart(2,'0');
      }
      // Custom message
      var msgBox  = document.getElementById('mtnMessageBox');
      var msgEl   = document.getElementById('mtnCustomMsg');
      var tipBox  = document.getElementById('mtnDefaultTips');
      var customMsg = (res && res.message && String(res.message).trim()) ? String(res.message).trim() : '';
      if (customMsg && msgBox && msgEl) {
        msgEl.textContent = customMsg;
        msgBox.style.display = 'block';
        if (tipBox) tipBox.style.display = 'none';
      } else {
        if (msgBox) msgBox.style.display = 'none';
        if (tipBox) tipBox.style.display = 'block';
      }
      // FIX Bug 3: Reset progress bar — must reset width AND remove animation
      // so the CSS-class animation restarts correctly on every open.
      var bar = modal.querySelector('.mtn-progress-bar');
      if (bar) {
        bar.style.animation = 'none';
        bar.style.width = '5%';
        bar.offsetHeight; // force reflow to restart animation
        bar.style.animation = '';
        bar.style.width = '';
      }
      modal.classList.add('mtn-open');
      document.body.style.overflow = 'hidden';
    }
    function closeMaintenanceModal() {
      var modal = document.getElementById('maintenanceModal');
      if (!modal) return;
      modal.classList.remove('mtn-open');
      // FIX Bug 6: Only clear overflow if no other modal is currently holding it
      // (e.g., simLoginModal may still be open underneath)
      var loginModal = document.getElementById('simLoginModal');
      var loginModalOpen = loginModal && loginModal.classList.contains('sim-modal-open');
      if (!loginModalOpen) {
        document.body.style.overflow = '';
      }
    }
    function updateMaintenanceCardStyle() {
      var manualChk = document.getElementById('cfgMaintenanceEnabled');
      var schedChk = document.getElementById('cfgMaintenanceScheduledEnabled');
      var card = document.getElementById('maintenanceConfigCard');
      var badge = document.getElementById('maintenanceStatusBadge');
      
      var isManualOn = manualChk && manualChk.checked;
      var isSchedOn = schedChk && schedChk.checked;
      var isAnyOn = isManualOn || isSchedOn;

      if (card) {
        card.style.borderColor = isAnyOn ? '#EF4444' : '#FECACA';
        card.style.background  = isAnyOn ? 'rgba(254,226,226,0.5)' : 'rgba(254,242,242,0.38)';
      }
      
      if (badge) {
        if (isManualOn) {
          badge.textContent = '⚠ Mode Manual AKTIF';
          badge.style.cssText = 'background:#FEF2F2;color:#DC2626;border:1.5px solid #FECACA;';
          badge.classList.remove('hidden');
        } else if (isSchedOn) {
          badge.textContent = '⏳ Penjadwalan AKTIF';
          badge.style.cssText = 'background:#FFF7ED;color:#C2410C;border:1.5px solid #FFEDD5;';
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }
      }
    }
    function toggleMaintenanceMsgField() {
      var chk = document.getElementById('cfgMaintenanceEnabled');
      var sec = document.getElementById('maintenanceMsgSection');
      var isOn = chk && chk.checked;
      if (sec) sec.classList.toggle('hidden', !isOn);
      
      if (typeof updateMaintenanceCardStyle === 'function') updateMaintenanceCardStyle();
    }
    function toggleScheduledMsgField() {
      var chk = document.getElementById('cfgMaintenanceScheduledEnabled');
      var sec = document.getElementById('scheduledMaintenanceSection');
      if (sec) sec.classList.toggle('hidden', !(chk && chk.checked));
      
      if (typeof updateMaintenanceCardStyle === 'function') updateMaintenanceCardStyle();
    }
    function saveMaintenanceModeUI() {
      var token = localStorage.getItem('auth_token');
      var chk   = document.getElementById('cfgMaintenanceEnabled');
      var msgEl = document.getElementById('cfgMaintenanceMessage');
      var isOn  = chk && chk.checked;
      var msg   = (msgEl ? msgEl.value : '').trim();
      var schedChk = document.getElementById('cfgMaintenanceScheduledEnabled');
      var startEl = document.getElementById('cfgMaintenanceStart');
      var endEl = document.getElementById('cfgMaintenanceEnd');
      var isSchedOn = schedChk && schedChk.checked;
      var schedStart = startEl ? startEl.value : '';
      var schedEnd = endEl ? endEl.value : '';
      // FIX Bug 5: Validate message only when turning ON (not when OFF)
      if (isOn && !msg) {
        showToast('Mohon isi pesan maintenance yang akan ditampilkan ke pengguna.', 'warning');
        if (msgEl) try { msgEl.focus(); } catch (_) { }
        return;
      }
      if (isSchedOn) {
        if (!schedStart || !schedEnd) {
          showToast('Mohon lengkapi Waktu Mulai dan Waktu Selesai untuk jadwal maintenance.', 'warning');
          return;
        }
        if (new Date(schedStart) >= new Date(schedEnd)) {
          showToast('Waktu Mulai harus lebih awal dari Waktu Selesai.', 'warning');
          return;
        }
      }
      var btn = document.getElementById('btnSaveMaintenanceConfig');
      var restore = (typeof _busyButton === 'function') ? _busyButton(btn, 'Menyimpan...') :
        (function() {
          if (btn) { btn.disabled = true; btn.dataset._oh = btn.innerHTML; btn.innerHTML = 'Menyimpan...'; }
          return function() { if (btn) { btn.disabled = false; if (btn.dataset._oh) { btn.innerHTML = btn.dataset._oh; delete btn.dataset._oh; } } };
</script>
