      showConfirm(

          const restoreBtn = _busyButton(btnEl, 'Mengonfirmasi...');
          const restoreBlock = _setBlockLoading(btnEl, '#panelPicketSubstitutes');
          google.script.run
            .withSuccessHandler((res) => {
              restoreBtn(); restoreBlock();
              if (res && res.status === 'success') {
                showToast(`✅ Kehadiran ${name} berhasil dikonfirmasi`, 'success');
                initPicket();
              } else {
                showToast((res && res.message) || 'Gagal mengonfirmasi', 'error');
              }
            })
            .withFailureHandler((err) => {
              restoreBtn(); restoreBlock();
              showToast('Gagal: ' + err, 'error');
            })
            .confirmPicketSubPresenceBackend(token, userId);
        }
      );

    /* =====================================================================
     * JTM Adjustment — Frontend controls (Feature: jtm-adjustment, task 10.1)
     * Per-occurrence KBM adjustment: Adjusted_JTM input, Reason textarea, and

     * adjustOccurrenceJtm(token, payload) and
     * getOccurrenceJtmState(token, 'KBM', schedule_id) via google.script.run.
     * Client-side validation is for UX only; authoritative validation is in
     * the backend.
     * ===================================================================== */
    function _jtmSid(scheduleId) {
      return String(scheduleId == null ? '' : scheduleId).replace(/[^a-zA-Z0-9_-]/g, '_');
    }
    function toggleJtmAdjustPanel(scheduleId, userId) {
      var sid = _jtmSid(scheduleId);
      var row = document.getElementById('jtmAdjRow-' + sid);
      if (!row) return;
      if (row.classList.contains('hidden')) {
        row.classList.remove('hidden');
        loadJtmAdjustState(scheduleId);
      } else {
        row.classList.add('hidden');
      }
    }
    function toggleJtmAdjustPanelSub(scheduleId, userId, sid) {
      var row = document.getElementById('jtmAdjRow-' + sid);
      if (!row) return;
      if (row.classList.contains('hidden')) {
        row.classList.remove('hidden');
        // Bangun scheduleId yang akan dipakai untuk load state.
        // sid = _jtmSid('PICKET-DUTY_' + userId) — ekstrak userId bersih dari prefix sid.
        var isPiketSid = /^PICKET_DUTY_/.test(sid);
        var loadId;
        if (isPiketSid) {
          // sid adalah PICKET_DUTY_<sanitizedUid>; susun ulang dengan userId asli
          loadId = 'PICKET-DUTY_' + userId;
        } else {
          loadId = scheduleId + '_' + userId;
        }
        loadJtmAdjustState(loadId);
      } else {
        row.classList.add('hidden');
      }
    }
    function loadJtmAdjustState(scheduleId) {
      var sid = _jtmSid(scheduleId);
      var token = localStorage.getItem('auth_token');
      var statusEl = document.getElementById('jtmAdjStatus-' + sid);
      if (statusEl) statusEl.textContent = 'Memuat...';
      var isPiketLoad = /^PICKET-DUTY/.test(scheduleId);
      if (isPiketLoad) {
        var picketUidLoad = scheduleId.replace(/^PICKET-DUTY_?/, '');
        var todayLoad = new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Jakarta' }).slice(0, 10);
        var piketRef = picketUidLoad + '|' + todayLoad;
        google.script.run
          .withSuccessHandler(function (res) { _jtmAdjStateHandler(sid, scheduleId, res); })
          .withFailureHandler(function (err) {
            var _se = document.getElementById('jtmAdjStatus-' + sid);
            if (_se) _se.textContent = 'Koneksi gagal: ' + err;
          })
          .getOccurrenceJtmState(token, 'PIKET', piketRef);
      } else {
        google.script.run
          .withSuccessHandler(function (res) { _jtmAdjStateHandler(sid, scheduleId, res); })
          .withFailureHandler(function (err) {
            var _se = document.getElementById('jtmAdjStatus-' + sid);
            if (_se) _se.textContent = 'Koneksi gagal: ' + err;
          })
          .getOccurrenceJtmState(token, 'KBM', scheduleId);
      }
    }
    function _jtmAdjStateHandler(sid, scheduleId, res) {
      var _statusEl = document.getElementById('jtmAdjStatus-' + sid);
      if (!res || res.status !== 'success') {
        var _errMsg = res ? (res.message || ('Status: ' + res.status)) : 'Response kosong dari server';
        if (_statusEl) _statusEl.textContent = _errMsg;
        return;
      }
      var schedEl = document.getElementById('jtmSchedDisp-' + sid);
      var adjEl   = document.getElementById('jtmAdjDisp-'   + sid);
      var diffEl  = document.getElementById('jtmDiffDisp-'  + sid);
      var inputEl = document.getElementById('jtmAdjInput-'  + sid);
      var reasonEl = document.getElementById('jtmReason-'   + sid);
      if (schedEl) schedEl.textContent = res.scheduled_jtm;
      if (adjEl)   adjEl.textContent   = res.adjusted_jtm;
      if (diffEl)  diffEl.textContent  = res.jtm_difference;
      if (inputEl) {
        inputEl.value = res.adjusted_jtm;
        inputEl.setAttribute('max', res.scheduled_jtm);
        inputEl.dataset.scheduled = res.scheduled_jtm;
      }
      if (reasonEl) reasonEl.value = res.reason || '';
      if (_statusEl) _statusEl.textContent = '';
      recomputeJtmDifferenceDisplay(scheduleId);
      var _cancelBtn = document.getElementById('jtmCancelBtn-' + sid);
      if (_cancelBtn) {
        var _hasAdj = (Number(res.adjusted_jtm) !== Number(res.scheduled_jtm))
          || (res.reason && String(res.reason).trim().length > 0)
          || (res.allocations && res.allocations.length > 0);
        if (_hasAdj) _cancelBtn.classList.remove('hidden');
        else         _cancelBtn.classList.add('hidden');
      }
      renderJtmAllocationPanel(scheduleId, res);
    }
    function recomputeJtmDifferenceDisplay(scheduleId) {
      var sid = _jtmSid(scheduleId);
      var inputEl = document.getElementById('jtmAdjInput-' + sid);
      if (!inputEl) return;
      var adjEl = document.getElementById('jtmAdjDisp-' + sid);
      var diffEl = document.getElementById('jtmDiffDisp-' + sid);
      var reasonWrap = document.getElementById('jtmReasonWrap-' + sid);
      var scheduled = Number(inputEl.dataset.scheduled || inputEl.getAttribute('max') || 0);
      var raw = String(inputEl.value).trim();
      var val = Number(raw);
      var isWholeInRange = raw !== '' && isFinite(val) && Math.floor(val) === val && val >= 0 && val <= scheduled;
      if (isWholeInRange) {
        if (adjEl) adjEl.textContent = val;
        if (diffEl) diffEl.textContent = (scheduled - val);
      }
      if (reasonWrap) {
        if (isWholeInRange && val < scheduled) reasonWrap.classList.remove('hidden');
        else reasonWrap.classList.add('hidden');
      }
    }
    function saveJtmAdjustment(scheduleId, userId, btnEl) {
      var sid = _jtmSid(scheduleId);
      var inputEl = document.getElementById('jtmAdjInput-' + sid);
      var reasonEl = document.getElementById('jtmReason-' + sid);
      var statusEl = document.getElementById('jtmAdjStatus-' + sid);
      if (!inputEl) return;
      var scheduled = Number(inputEl.dataset.scheduled || inputEl.getAttribute('max') || 0);
      var raw = String(inputEl.value).trim();
      var val = Number(raw);
      if (raw === '' || !isFinite(val) || Math.floor(val) !== val) {
        showToast('Adjusted JTM harus berupa bilangan bulat.', 'error');
        return;
      }
      if (val < 0 || val > scheduled) {
        showToast('Adjusted JTM harus di antara 0 dan ' + scheduled + '.', 'error');
        return;
      }
      var reason = reasonEl ? String(reasonEl.value).trim() : '';
      if (val < scheduled && reason.length === 0) {
        showToast('Alasan penyesuaian wajib diisi saat mengurangi JTM.', 'error');
        if (reasonEl) reasonEl.focus();
        return;
      }
      if (reason.length > 500) {
        showToast('Alasan penyesuaian maksimal 500 karakter.', 'error');
        return;
      }
      var token = localStorage.getItem('auth_token');
      var restoreBtn = _busyButton(btnEl, 'Menyimpan...');
      var isPiket = /^PICKET-DUTY/.test(scheduleId);
      var todayJkt = new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Jakarta' }).slice(0, 10);
      var payload = isPiket
        ? {
            occurrence_type: 'PIKET',
            target_user_id: userId,
            date: todayJkt,
            adjusted_jtm: val,
            reason: reason
          }
        : {
            occurrence_type: 'KBM',
            schedule_id: scheduleId,
            target_user_id: userId,
            adjusted_jtm: val,
            reason: reason
          };
      google.script.run
        .withSuccessHandler(function (res) {
          restoreBtn();
          if (res && res.status === 'success') {
            showToast('Penyesuaian JTM tersimpan.', 'success');
            var _statusEl = document.getElementById('jtmAdjStatus-' + sid);
            var schedEl = document.getElementById('jtmSchedDisp-' + sid);
            var adjEl   = document.getElementById('jtmAdjDisp-'   + sid);
            var diffEl  = document.getElementById('jtmDiffDisp-'  + sid);
            if (schedEl) schedEl.textContent = res.scheduled_jtm;
            if (adjEl)   adjEl.textContent   = res.adjusted_jtm;
            if (diffEl)  diffEl.textContent  = res.jtm_difference;
            if (_statusEl) _statusEl.textContent = '';
            var _panel     = document.getElementById('jtmAllocPanel-' + sid);
            var _listEl    = document.getElementById('jtmAllocList-'  + sid);
            var _remainEl  = document.getElementById('jtmRemainDisp-' + sid);
            var newDiff    = Number(res.jtm_difference) || 0;
            var allocSum   = 0;
            if (_listEl) {
              var rows = _listEl.querySelectorAll('[data-alloc-jtm]');
              for (var _i = 0; _i < rows.length; _i++) {
                allocSum += Number(rows[_i].dataset.allocJtm) || 0;
              }
            }
            var newRemaining = Math.max(0, newDiff - allocSum);
            if (_remainEl) _remainEl.textContent = newRemaining;
            if (_panel) {
              _panel.dataset.remaining = newRemaining;
              if (newDiff > 0) _panel.classList.remove('hidden');
              else             _panel.classList.add('hidden');
            }
            var _cancelBtn = document.getElementById('jtmCancelBtn-' + sid);
            if (_cancelBtn) _cancelBtn.classList.remove('hidden');
          } else {
            showToast((res && res.message) || 'Gagal menyimpan penyesuaian JTM.', 'error');
            var _statusEl2 = document.getElementById('jtmAdjStatus-' + sid);
            if (_statusEl2) _statusEl2.textContent = (res && res.message) || '';
          }
        })
        .withFailureHandler(function (err) {
          restoreBtn();
          showToast('Koneksi gagal: ' + err, 'error');
        })
        .adjustOccurrenceJtm(token, payload);
    }

    }
    function addJtmAllocation(scheduleId, userId, btnEl) {
      var sid = _jtmSid(scheduleId);
      var selEl = document.getElementById('jtmAllocSelect-' + sid);
      var inputEl = document.getElementById('jtmAllocInput-' + sid);
      var panel = document.getElementById('jtmAllocPanel-' + sid);
      if (!selEl || !inputEl) return;
      var substituteUserId = String(selEl.value || '');
      var raw = String(inputEl.value).trim();
      var val = Number(raw);
      if (!substituteUserId) {
        showToast('Pilih guru pengganti terlebih dahulu.', 'error');
        return;
      }
      if (raw === '' || !isFinite(val) || val <= 0) {
        showToast('Alokasi JTM harus berupa angka lebih dari 0.', 'error');
        return;
      }
      var remaining = panel ? Number(panel.dataset.remaining || 0) : 0;
      if (val > remaining) {
        showToast('Alokasi melebihi sisa selisih JTM (' + remaining + ').', 'error');
        return;
      }
      var token = localStorage.getItem('auth_token');
      var restoreBtn = _busyButton(btnEl, 'Menyimpan...');
      var isPiketAlloc = /^PICKET-DUTY/.test(scheduleId);
      var todayAllocJkt = new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Jakarta' }).slice(0, 10);
      var payload = isPiketAlloc
        ? {
            occurrence_type: 'PIKET',
            occurrence_ref: scheduleId.replace(/^PICKET-DUTY_?/, '') + '|' + todayAllocJkt,
            allocations: [{ substitute_user_id: substituteUserId, allocated_jtm: val }]
          }
        : {
            occurrence_type: 'KBM',
            occurrence_ref: scheduleId,
            allocations: [{ substitute_user_id: substituteUserId, allocated_jtm: val }]
          };
      google.script.run
        .withSuccessHandler(function (res) {
          restoreBtn();
          if (res && res.status === 'success') {
            showToast('Alokasi JTM pengganti tersimpan.', 'success');
            if (inputEl) inputEl.value = '';
            if (selEl) selEl.value = '';
            var _panel = document.getElementById('jtmAllocPanel-' + sid);
            var _remainEl = document.getElementById('jtmRemainDisp-' + sid);
            var _newRemaining = Number(res.remaining_difference);
            if (isNaN(_newRemaining)) _newRemaining = 0;
            if (_remainEl) _remainEl.textContent = _newRemaining;
            if (_panel) {
              _panel.dataset.remaining = _newRemaining;
              if (_newRemaining > 0) _panel.classList.remove('hidden');
              else _panel.classList.add('hidden');
            }
            _jtmRenderAllocList(scheduleId, res.allocations || []);
            _jtmPopulateAllocSelect(sid, _panel ? _panel.dataset.originalUid : '');
          } else {
            showToast((res && res.message) || 'Gagal menyimpan alokasi JTM.', 'error');
          }
        })
        .withFailureHandler(function (err) {
          restoreBtn();
          showToast('Koneksi gagal: ' + err, 'error');
        })
        .reallocateJtmDifference(token, payload);
    }
    function removeJtmAllocation(scheduleId, reallocationId, btnEl) {
      var sid = _jtmSid(scheduleId);
      var token = localStorage.getItem('auth_token');
      var restoreBtn = _busyButton(btnEl, 'Menghapus...');
      google.script.run
        .withSuccessHandler(function (res) {
          restoreBtn();
          if (res && res.status === 'success') {
            showToast('Alokasi JTM dihapus.', 'success');
            var listEl = document.getElementById('jtmAllocList-' + sid);
            var panel = document.getElementById('jtmAllocPanel-' + sid);
            var removedJtm = 0;
            if (btnEl) {
              var rowEl = btnEl.closest
                ? btnEl.closest('[data-realloc-id]')
                : (function () {
                  var el = btnEl;
                  while (el && !el.dataset.reallocId) el = el.parentElement;
                  return el;
                })();
              if (rowEl) {
                removedJtm = Number(rowEl.dataset.allocJtm) || 0;
                rowEl.parentNode && rowEl.parentNode.removeChild(rowEl);
              }
            }
            var remainEl = document.getElementById('jtmRemainDisp-' + sid);
            var currentRemaining = panel ? Number(panel.dataset.remaining || 0) : 0;
            var newRemaining = currentRemaining + removedJtm;
            if (remainEl) remainEl.textContent = newRemaining;
            if (panel) {
              panel.dataset.remaining = newRemaining;
              if (newRemaining > 0) panel.classList.remove('hidden');
            }
          } else {
            showToast((res && res.message) || 'Gagal menghapus alokasi JTM.', 'error');
          }
        })
        .withFailureHandler(function (err) {
          restoreBtn();
          showToast('Koneksi gagal: ' + err, 'error');
        })
        .removeReallocation(token, reallocationId);
    }
    function cancelJtmAdjustment(scheduleId, btnEl) {
      showConfirm(
        'Batalkan Penyesuaian JTM',
        'Apakah Anda yakin? Semua penyesuaian dan alokasi pengganti sebagian untuk jadwal ini akan dihapus, dan JTM akan kembali ke nilai terjadwal.',
        function () {

              loadJtmAdjustState(scheduleId);
              var inputEl  = document.getElementById('jtmAdjInput-'   + sid);
              var sched = inputEl ? Number(inputEl.dataset.scheduled || inputEl.getAttribute('max') || 0) : 0;
              ['jtmSchedDisp-','jtmAdjDisp-'].forEach(function(p){
                var e = document.getElementById(p+sid); if(e) e.textContent = sched;

              var diffEl = document.getElementById('jtmDiffDisp-'+sid); if(diffEl) diffEl.textContent = 0;
              if(inputEl) inputEl.value = sched;
              var reasonEl = document.getElementById('jtmReason-'+sid); if(reasonEl) reasonEl.value = '';
              var rw = document.getElementById('jtmReasonWrap-'+sid); if(rw) rw.classList.add('hidden');
              var ap = document.getElementById('jtmAllocPanel-'+sid);
              if(ap) { ap.classList.add('hidden'); ap.dataset.remaining = 0; }
              var al = document.getElementById('jtmAllocList-'+sid); if(al) al.innerHTML = '';
              var rd = document.getElementById('jtmRemainDisp-'+sid); if(rd) rd.textContent = 0;
              var cb = document.getElementById('jtmCancelBtn-'+sid); if(cb) cb.classList.add('hidden');
            } else {
              showToast((res && res.message) || 'Gagal membatalkan penyesuaian JTM.', 'error');
            }
          }
          function _onCancelFail(err) { restoreBtn(); showToast('Koneksi gagal: ' + err, 'error'); }
          var isPiketCancel = /^PICKET-DUTY/.test(scheduleId);
          if (isPiketCancel) {
            var picketUidC = scheduleId.replace(/^PICKET-DUTY_?/, '');
            var todayC = new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Jakarta' }).slice(0, 10);
            google.script.run
              .withSuccessHandler(_onCancelSuccess)
              .withFailureHandler(_onCancelFail)
              .resetOccurrenceJtm(token, { occurrence_type: 'PIKET', occurrence_ref: picketUidC + '|' + todayC });
          } else {
            google.script.run
              .withSuccessHandler(_onCancelSuccess)
              .withFailureHandler(_onCancelFail)
              .resetOccurrenceJtm(token, { occurrence_type: 'KBM', occurrence_ref: scheduleId });
          }
        },
        { type: 'danger' }
      );
    }
    function savePicketScheduleAction() {

      const data = {
        day_index: dayEl ? dayEl.value : '',
        user_id: teacherEl ? teacherEl.value : ''

      if (!data.user_id) return showToast('Pilih guru terlebih dahulu.', 'error');

      if (!btn) return;

      btn.dataset.saving = 'true';
      const restore = _busyButton(btn, 'Menyimpan...');
      const finalize = () => {
        btn.dataset.saving = 'false';
        restore();
      };
      google.script.run
        .withSuccessHandler((res) => {
          finalize();
          if (res && res.status === 'success') {
            showToast('Jadwal piket disimpan.', 'success');
            if (teacherEl) teacherEl.value = '';
            initPicket();
          } else {
            showToast((res && res.message) || 'Gagal menyimpan jadwal.', 'error');
          }
        })
        .withFailureHandler((err) => {
          finalize();
          showToast('Koneksi gagal: ' + err, 'error');
        })
        .savePicketSchedule(token, data);
    }
